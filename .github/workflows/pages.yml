# The demo on GitHub Pages: the real dashboard, on made-up data, with no server.
#
# Built by scripts/build-demo.mjs from public/ and demo/demo.js, and published
# whenever either changes on main. It holds nothing from the live deployment -
# no address, no plant, no reading - and needs no secret: the sample data is
# made up in the visitor's browser.
#
# Needs Pages switched on once, with "GitHub Actions" as its source (Settings ->
# Pages). Until then the deploy job fails and nothing else is affected.
#
# Third-party actions are pinned to a commit rather than a tag, because a tag
# can be moved to point at different code after it has been reviewed.

name: Demo

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'demo/**'
      - 'scripts/build-demo.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time; a newer one replaces a run still waiting.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Locally: node scripts/build-demo.mjs, then open site/index.html through any
  # static server (npm run test:e2e serves it at /demo/).
  build:
    name: Build the demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/build-demo.mjs site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
