# What happens after a merge, in order.
#
# It starts only when Checks has passed on main, so a merge that combines two
# changes which each passed alone cannot reach the live dashboard. Then it
# stops and waits: the `production` environment carries a required reviewer, so
# nothing is deployed until a person approves the run on GitHub.
#
# After deploying, the live site is asked whether it actually works. If it does
# not, the version that was serving a minute ago is put back automatically.

name: Deploy

on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
  # For a deploy of the current main without a new commit - re-running a failed
  # deploy, or pushing out a rollback of a rollback.
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and never cancel one half-way.
#
# The group carries the branch, which matters more than it looks: this workflow
# starts whenever *any* Checks run finishes, pull requests included, and those
# runs skip on the `if` below. Under one shared group they queued against each
# other anyway, and GitHub keeps only the newest waiting run - so a deploy of
# main sat waiting for an approval until a pull request's own check run
# cancelled it. Three deploys of 2.7.0 died that way before the cause was clear.
concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Migrations, then the deploy, then a smoke test of the live site, and the
  # previous version put back if that test fails. When it fails, the step
  # "Ask the live site whether it works" names each check that did; the same
  # test runs locally against any URL: SOLARLENS_URL=<url> node scripts/ci/smoke.mjs
  deploy:
    name: Deploy to production
    # A hand-started run deploys main only: "Run workflow" offers every branch,
    # and a branch that never passed review must not reach the live dashboard.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The approval gate. Its secrets are the only place the Cloudflare token and
    # the deployment's address exist.
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
      SOLARLENS_URL: ${{ secrets.SOLARLENS_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The exact commit that passed its checks, not whatever main says by
          # the time a person gets round to approving.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # All of history and the tags, so the relay note below can compare
          # with whatever was live before, however many commits back it is.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Not fatal: the very first deploy has no previous version, and a deploy
      # is still the right thing to do. But it is said out loud, because it is
      # the difference between a failure that undoes itself and one that waits
      # for someone to notice.
      - name: Remember the version serving right now
        id: before
        run: |
          if version=$(node scripts/ci/worker-version.mjs); then
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "Rollback target: $version"
          else
            echo "Could not read the version now serving: this run cannot roll itself back." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          # And the commit it was deployed from, which the relay note at the end
          # compares with. A version deployed before deploys recorded one has
          # none; the note falls back to the last release tag.
          if commit=$(node scripts/ci/worker-version.mjs --commit); then
            echo "commit=$commit" >> "$GITHUB_OUTPUT"
            echo "Serving commit: $commit"
          fi

      # A restore point, before anything changes the database. D1 keeps thirty
      # days of history (Time Travel) whatever this does; the bookmark is the
      # exact moment to go back to, written where the person who approved this
      # run will find it. Rolling the Worker back never needs it - migrations
      # only add - but a migration that damaged data would. Not fatal: a
      # database that cannot report its bookmark can still be migrated.
      - name: Mark a restore point in the database
        run: |
          if out=$(npm run --silent cf -- d1 time-travel info solar-lens --json 2>/dev/null) \
             && bookmark=$(node -e "process.stdout.write(JSON.parse(process.argv[1]).bookmark || '')" "$out") \
             && [ -n "$bookmark" ]; then
            {
              echo "### Database restore point"
              echo
              echo "Taken before this run's migrations. To put the database back to it:"
              echo
              echo '```'
              echo "npm run cf -- d1 time-travel restore solar-lens --bookmark=$bookmark"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Restore point: $bookmark"
          else
            echo "Could not read a restore point; D1 Time Travel still keeps thirty days, by time." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Migrations are additive by rule, so the version currently serving keeps
      # working against the new schema - which is what makes a rollback of the
      # Worker alone a safe answer.
      - name: Apply database migrations
        run: npm run db:remote

      # The new version records the commit it was built from - the whole of it
      # in its message, which the next deploy reads back (worker-version.mjs
      # --commit), and the short form as its tag, for the dashboard's list.
      - name: Deploy the Worker
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: npm run deploy -- --tag "${SHA:0:12}" --message "From commit $SHA"

      - name: Ask the live site whether it works
        id: smoke
        run: node scripts/ci/smoke.mjs

      - name: Put the previous version back
        if: failure() && steps.before.outputs.version != ''
        run: |
          echo "The deploy or its smoke test failed - rolling back to ${{ steps.before.outputs.version }}"
          npm run cf -- rollback "${{ steps.before.outputs.version }}" --yes \
            --message "Smoke test failed for ${{ github.event.workflow_run.head_sha || github.sha }}"
          {
            echo "### Rolled back"
            echo
            echo "The deploy failed its smoke test, so version \`${{ steps.before.outputs.version }}\` was put back."
            echo "The run is marked failed on purpose - the logs above say which check failed."
          } >> "$GITHUB_STEP_SUMMARY"

      # The relay laptops run their own copy of the relay code, so the summary
      # says when a deploy changed it. It compares with what was serving before
      # this deploy, not with the commit before this one: "Rebase and merge"
      # brings a pull request's commits to main in one push, and the 3.0.0
      # merge was twenty-seven of them, with the relay's setup changed in an
      # early one that HEAD^..HEAD never saw. What was serving is read from the
      # version itself (the commit each deploy records on it), so it is right
      # after a rollback or a re-run of an older deploy too; a version from
      # before deploys recorded one falls back to the last release tag.
      - name: Say whether the relay computers need updating
        if: success()
        env:
          LIVE: ${{ steps.before.outputs.commit }}
        run: |
          live="$LIVE"
          if [ -n "$live" ] && git cat-file -e "$live^{commit}" 2>/dev/null; then
            echo "Comparing with $live, the commit the version serving before this deploy was built from"
          else
            live=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
            echo "The version serving before this deploy recorded no commit; comparing with the last release tag instead: ${live:-there is none}"
          fi
          changed=''
          if [ -n "$live" ]; then changed=$(git diff --name-only "$live" HEAD || true); fi
          {
            echo "### Deployed"
            echo
            echo "Commit \`${{ github.event.workflow_run.head_sha || github.sha }}\` is live, and the smoke test passed."
            if [ -z "$live" ]; then
              echo
              echo "Could not tell what was live before it, so this run cannot say whether the relay computers need updating."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # What runs on the relay laptops, and all the list below names: one
          # merge can bring dozens of other scripts, which the laptops never run.
          relay='^(agent/|scripts/(setup-relay|renew-solis-login|relay-hidden)\.|.*\.cmd$)'
          if echo "$changed" | grep -qE "$relay"; then
            {
              echo
              echo "**The relay computers need updating.** This change touches the code that runs on them:"
              echo
              echo '```'
              echo "$changed" | grep -E "$relay" || true
              echo '```'
              echo
              echo "On each relay laptop, double-click \`setup-solarlens-relay.cmd\`, or \`renew-solis-login.cmd\` in the SolarLens folder."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if echo "$changed" | grep -q '^scripts/make-laptop-installer.ps1$'; then
            echo "Also make a new \`setup-solarlens-relay.cmd\`: its generator changed." >> "$GITHUB_STEP_SUMMARY"
          fi
