<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SolarLens</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e100f" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<!-- iOS ignores the manifest's icons and reads this one, and it will not scale
     an SVG, so the rendered PNG is what a home-screen install actually uses. -->
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SolarLens">
<meta name="mobile-web-app-capable" content="yes">
<script>
  // Applied before first paint so a chosen theme never flashes the other one.
  try {
    var t = localStorage.getItem('sl-theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) { /* private mode: fall back to the OS preference */ }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    --bg: #f7f6f2;
    --surface: #ffffff;
    --surface-2: #f1f0ea;
    --ink: #17191a;
    --muted: #5f6570;
    /* 4.58:1 on the page's own ground, where #8b919b measured 2.93 and failed
       AA. Muted text on a phone in daylight is exactly the case that matters. */
    --faint: #646a75;
    --line: #e5e4dc;
    --line-soft: #efeee7;
    --ok: #136b33;
    --ok-bg: #e8f3ec;
    --warn: #97450a;
    --warn-bg: #fbf1e2;
    --bad: #b91c1c;
    --bad-bg: #fbeaea;
    --solis: #db6b1c;
    /* Type versions of the brand colours. The chart keeps the brighter ones,
       which measured 3.42:1 as 11px bold text on white, where 4.5 is the bar. */
    --solis-ink: #a44f0e;
    --solarman: #2f6fde;
    --solarman-ink: #2a62c4;
    --local: #6b4fbb;
    --local-ink: #5b3fa8;
    --total: #17191a;
    --shadow: 0 1px 2px rgba(20, 24, 30, .05), 0 10px 28px -12px rgba(20, 24, 30, .16);
    --shadow-lift: 0 2px 6px rgba(20, 24, 30, .07), 0 18px 40px -16px rgba(20, 24, 30, .22);
    --r: 18px;
    --r-sm: 11px;
    --font: "Manrope", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e100f;
      --surface: #171a18;
      --surface-2: #1f2320;
      --ink: #edeee9;
      --muted: #9aa1a8;
      --faint: #6f767d;
      --line: #262a27;
      --line-soft: #202422;
      --ok: #4ade80; --ok-bg: #12251a;
      --warn: #fbbf24; --warn-bg: #2a2113;
      --bad: #f87171; --bad-bg: #2a1616;
      --solis: #f0913f;
      --solis-ink: #f0913f;
      --solarman: #6fa0f0;
      --solarman-ink: #6fa0f0;
      --local: #a78bfa;
      --local-ink: #a78bfa;
      --total: #edeee9;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px -12px rgba(0,0,0,.6);
      --shadow-lift: 0 2px 6px rgba(0,0,0,.5), 0 18px 40px -16px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e100f; --surface: #171a18; --surface-2: #1f2320; --ink: #edeee9;
    --muted: #9aa1a8; --faint: #6f767d; --line: #262a27; --line-soft: #202422;
    --ok: #4ade80; --ok-bg: #12251a; --warn: #fbbf24; --warn-bg: #2a2113;
    --bad: #f87171; --bad-bg: #2a1616;
    --solis: #f0913f; --solarman: #6fa0f0; --local: #a78bfa; --total: #edeee9;
    --solis-ink: #f0913f; --solarman-ink: #6fa0f0; --local-ink: #a78bfa;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px -12px rgba(0,0,0,.6);
    --shadow-lift: 0 2px 6px rgba(0,0,0,.5), 0 18px 40px -16px rgba(0,0,0,.7);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: var(--font);
    font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--solarman); outline-offset: 3px; border-radius: 8px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px 56px; }

  /* ---------- top bar ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(180%) blur(12px);
    border-bottom: 1px solid var(--line-soft);
  }
  .topbar .inner {
    max-width: 1180px; margin: 0 auto; padding: 14px 20px 0;
    display: flex; flex-wrap: wrap; align-items: center; gap: 14px 22px;
  }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 17px; letter-spacing: -0.02em; }
  .brand .mark { width: 28px; height: 28px; border-radius: 8px; flex: none; display: block; }
  .fleet { display: flex; align-items: flex-end; gap: 12px; margin-left: auto; }
  .battinfo { flex: 1; min-width: 0; }
  .battgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 4px 14px; margin-top: 5px; }
  .battgrid > div { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; }
  .battgrid span { color: var(--faint); }
  .battgrid b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .derived { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint);
             border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-left: 4px; }
  .fitem { display: flex; flex-direction: column; gap: 1px; }
  #poll-status .feed { display: inline-flex; align-items: baseline; gap: 4px; margin-right: 18px; white-space: nowrap; }
  #poll-status .feed.bad { color: var(--bad); }
  #poll-status .feed em { font-style: normal; color: var(--faint); max-width: 46ch; overflow: hidden; text-overflow: ellipsis; }
  .openwarn { font-size: 11.5px; font-weight: 700; color: var(--bad); background: var(--bad-bg);
              border-radius: 999px; padding: 5px 12px; }
  .quiet { font-size: 10.5px; font-weight: 650; color: var(--warn); margin-top: 1px; }
  .navbadge { display: inline-block; min-width: 17px; padding: 0 5px; margin-left: 7px; border-radius: 999px;
              background: var(--warn-bg); color: var(--warn); font-size: 10.5px; font-weight: 800;
              line-height: 17px; text-align: center; vertical-align: 1px; }
  .navbadge.bad { background: var(--bad-bg); color: var(--bad); }
  .alertsum { font-size: 15px; color: var(--muted); }
  .alertsum b { color: var(--ink); font-size: 19px; font-weight: 800; }
  .alerts { list-style: none; margin: 0; padding: 0; }
  .alerts li { padding: 14px 16px; border-bottom: 1px solid var(--line-soft); }
  .alerts li:last-child { border-bottom: none; }
  .a-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .a-title { font-weight: 700; font-size: 15px; }
  .a-src { margin-left: auto; font-size: 11px; font-weight: 700; letter-spacing: .05em;
           text-transform: uppercase; color: var(--faint); }
  .a-detail { margin-top: 5px; font-size: 13.5px; color: var(--muted); }
  .a-when { margin-top: 6px; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--faint); }
  .allclear { padding: 18px 16px; }
  .ac-head { font-weight: 700; font-size: 15px; color: var(--ok); }
  .ac-sub { margin-top: 6px; font-size: 12.5px; color: var(--faint); }
  .flowstale { font-size: 11.5px; font-weight: 650; color: var(--warn); margin: 2px 0 6px; }
  [hidden] { display: none !important; }
  .flabel { font-size: 10px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); }
  .fleet .num.small { font-size: 17px; }
  .fleet .num { font-size: 24px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .fleet .unit { font-size: 13px; color: var(--muted); font-weight: 600; }
  .fleet .sep { width: 1px; height: 28px; background: var(--line); }
  .fleet .sub { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .livedot {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted);
    padding: 4px 10px; border-radius: 999px; background: var(--surface-2);
  }
  .livedot i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
  .livedot.stale i { background: var(--warn); }
  .themebtn, .tvbtn {
    font: inherit; font-size: 15px; line-height: 1; cursor: pointer;
    background: var(--surface-2); color: var(--ink); border: 1px solid var(--line);
    border-radius: 999px; padding: 7px 11px; transition: background .15s, border-color .15s;
  }
  .tvbtn { text-decoration: none; }
  .themebtn:hover, .tvbtn:hover { border-color: var(--muted); }
  /* The guide button: a book, and the word Guide where there is room for it. */
  .guidebtn { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 700; }
  .guidebtn .guideicon { display: block; flex: none; }
  @media (max-width: 640px) { .guidebtn .guidelabel { display: none; } }
  .guidebtn.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }

  /* ---------- the guide (#/guide) ---------- */
  .guide { display: grid; gap: 16px; }
  .guide p { margin: 0 0 10px; max-width: 74ch; line-height: 1.55; }
  .guide p:last-child { margin-bottom: 0; }
  .guide ul + .cardnote { margin-top: 16px; }
  .guide .lead { font-size: 15.5px; }
  .guide ul { margin: 0; padding-left: 20px; display: grid; gap: 7px; max-width: 78ch; line-height: 1.5; }
  .guide .ver { display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2);
    font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: none; color: var(--muted); }
  .guide .systems { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .guide .systems span { padding: 5px 12px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; }
  .guide dl.tabs { display: grid; grid-template-columns: minmax(140px, max-content) 1fr; gap: 12px 20px; margin: 0; }
  .guide dl.tabs dt { font-weight: 700; }
  .guide dl.tabs dt a { color: var(--ink); }
  .guide dl.tabs dd { margin: 0; color: var(--muted); line-height: 1.5; max-width: 78ch; }
  .guide table.find { width: 100%; border-collapse: collapse; font-size: 14px; }
  .guide table.find th, .guide table.find td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
  .guide table.find th { font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); }
  .guide table.find td:last-child { color: var(--muted); }
  .guide table.find a { color: var(--ink); font-weight: 600; }
  @media (max-width: 640px) {
    .guide dl.tabs { grid-template-columns: 1fr; gap: 4px; }
    .guide dl.tabs dd { margin-bottom: 10px; }
  }

  /* The tabs scroll sideways inside their own strip rather than widening the
     page: on a phone five tabs do not fit, and a page wider than the screen
     makes the browser zoom the whole layout out - which pushed anything fixed
     to the bottom of the screen, like the new-version notice, out of sight. */
  nav { display: flex; gap: 2px; padding: 10px 0 0; overflow-x: auto; scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
  nav a {
    flex: none; white-space: nowrap;
    padding: 9px 16px 12px; font-size: 14.5px; font-weight: 600; color: var(--muted);
    border-bottom: 2.5px solid transparent; transition: color .15s, border-color .15s;
  }
  nav a:hover { color: var(--ink); }
  nav a.on { color: var(--ink); border-bottom-color: var(--ink); }
  @media (max-width: 640px) { nav a { padding: 9px 11px 12px; font-size: 14px; } }

  main { padding-top: 26px; }
  .back {
    display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--muted);
    font-weight: 600; margin-bottom: 16px;
  }
  .back:hover { color: var(--ink); }

  /* ---------- cards ---------- */
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
    box-shadow: var(--shadow);
  }
  .card > h2, .card > h3 {
    margin: 0; padding: 15px 20px; font-size: 12px; font-weight: 700; letter-spacing: .09em;
    text-transform: uppercase; color: var(--faint); border-bottom: 1px solid var(--line-soft);
  }
  .card .body { padding: 18px 20px 20px; }

  h2.band {
    margin: 26px 0 12px; font-size: 12px; font-weight: 700; letter-spacing: .09em;
    text-transform: uppercase; color: var(--faint);
  }
  h2.band:first-child { margin-top: 0; }
  .sysgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 18px; }

  /* ---------- system card ---------- */
  .sys {
    position: relative; display: block; overflow: hidden;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
    box-shadow: var(--shadow); padding: 22px 22px 20px;
    transition: transform .18s cubic-bezier(.2,.8,.3,1), box-shadow .18s;
  }
  .sys::before { content: ""; position: absolute; inset: 0 0 auto; height: 3px; background: var(--accent); }
  a.sys:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
  .sys-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
  .vendor {
    font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--accent-ink);
  }
  .sys-name { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; margin-top: 2px; }
  .sys-plant { font-size: 13px; color: var(--muted); }

  .pill {
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    font-size: 12px; font-weight: 650; padding: 5px 11px; border-radius: 999px;
    background: var(--surface-2); color: var(--muted);
  }
  .pill i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.bad { background: var(--bad-bg); color: var(--bad); }

  .herolabel { font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); margin-bottom: 2px; }
  .hero { display: flex; align-items: baseline; gap: 9px; }
  .hero .val { font-size: 50px; font-weight: 800; letter-spacing: -0.04em; line-height: .95; font-variant-numeric: tabular-nums; }
  .hero .unit { font-size: 19px; font-weight: 600; color: var(--muted); }
  .hero .cap { margin-left: auto; font-size: 12.5px; color: var(--faint); font-weight: 600; }
  .freshness { font-size: 12.5px; color: var(--muted); margin: 8px 0 2px; min-height: 1.2em; }
  .freshness.stale { color: var(--warn); font-weight: 600; }

  .spark { width: 100%; height: 68px; display: block; margin: 10px 0 16px; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 14px 16px; }
  .stat .k { color: var(--faint); font-size: 11.5px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; }
  .stat .v { font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; margin-top: 1px; }
  .stat .v.import { color: var(--solarman); }
  .stat .v.export { color: var(--ok); }

  .batt { display: flex; align-items: center; gap: 14px; margin-top: 18px; padding-top: 16px; border-top: 1px dashed var(--line); }
  .ring { width: 54px; height: 54px; flex: none; }
  .ring circle { fill: none; stroke-width: 6.5; }
  .ring .track { stroke: var(--surface-2); }
  .ring .fill { stroke: var(--ok); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }
  .ring text { font-size: 14px; font-weight: 800; fill: var(--ink); font-family: var(--font); }
  .batt .k { color: var(--faint); font-size: 11.5px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; }
  .batt .v { font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 1px; }

  /* ---------- chart ---------- */
  .legend { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .legitem { display: inline-flex; align-items: center; gap: 7px; font: inherit; font-size: 12.5px; font-weight: 600;
             color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px;
             padding: 5px 12px; cursor: pointer; transition: opacity .12s, border-color .12s; }
  .legitem:hover { border-color: var(--muted); }
  .legitem i { display: inline-block; width: 16px; height: 3px; border-radius: 2px; }
  /* A switched-off series keeps its swatch, struck through, so you can still
     see which line you turned off rather than guessing from what is missing. */
  .legitem.off { opacity: .5; text-decoration: line-through; }
  .legitem.off i { background: var(--line) !important; }
  .legitem em { font-style: normal; color: var(--faint); font-weight: 600; }
  .snote { font-size: 11.5px; font-weight: 600; color: var(--faint); margin-left: auto; }
  .combined { width: 100%; height: 250px; display: block; }
  .axis { fill: var(--muted); font-size: 12.5px; font-family: var(--font); font-weight: 600; }
  .axis.unit { fill: var(--faint); font-size: 11px; }
  .axis.gap { fill: var(--warn); font-size: 12px; font-weight: 650; }
  /* The stretch of day nobody recorded, so an empty axis does not read as a
     flat zero the system genuinely produced. */
  .nodata { fill: var(--faint); opacity: .07; }
  .peaklab { fill: var(--ink); font-size: 12.5px; font-weight: 700; font-family: var(--font); }
  .grid { stroke: var(--line); opacity: .7; }

  /* ---------- flow ---------- */
  /* The same drawing serves a half-width overview card and a full-width detail
     page. Capping the width stops the detail page blowing the type up to
     poster size, and the viewBox does the shrinking at the other end. */
  .flow { width: 100%; max-width: 760px; height: auto; display: block; margin: 0 auto; }
  .flow .wire { fill: none; stroke: var(--line); stroke-linecap: round; stroke-linejoin: round; }
  /* An arm carrying nothing is dashed as well as grey, so it still reads as
     "no power here" in a screenshot, in print, or to a colour-blind eye. */
  .flow .wire.dead { stroke-dasharray: 2 9; opacity: .8; }
  .flow .wire.live { stroke: var(--accent); }
  .flow .pip { fill: var(--accent); }
  .flow .nodebg { fill: var(--surface-2); stroke: var(--line); stroke-width: 1.5; }
  .flow .nodebg.live { stroke: var(--accent); stroke-width: 2.5; }
  .flow .halo { fill: var(--accent); opacity: .10; }
  .flow .glyph.dim { opacity: .45; }
  .flow .val.idle { fill: var(--muted); }
  .flow .house { fill: var(--surface-2); stroke: var(--line); stroke-width: 1.5; }
  .flow .glyph { font-size: 34px; }
  .flow .glyph.big { font-size: 46px; }
  .flow .lbl { fill: var(--muted); font-size: 22px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; font-family: var(--font); }
  .flow .val { fill: var(--ink); font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; font-family: var(--font); }
  .flow .sub { fill: var(--faint); font-size: 20px; font-weight: 600; font-family: var(--font); }
  .flowbar { margin-top: 10px; max-width: 760px; margin-inline: auto; }
  /* One system's box carries a self-powered bar the other cannot have, so the
     cards are told to fill the row rather than each ending where its own
     content does. */
  .flowlink { display: flex; }
  .flowlink > .card { flex: 1; display: flex; flex-direction: column; }
  .flowlink > .card > .body { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .flowbar-t { display: flex; justify-content: space-between; align-items: baseline; font-size: 12.5px;
               font-weight: 650; color: var(--muted); margin-bottom: 5px; }
  .flowbar-t b { font-size: 15px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; }
  .flowstats { display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); gap: 16px 18px; margin-top: 6px; padding-top: 18px; border-top: 1px solid var(--line-soft); }
  .flowstats .k { color: var(--faint); font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
  .flowstats .v { font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .flowstats .v.import { color: var(--solarman); }
  .flowstats .v.export { color: var(--ok); }
  /* ---------- overview: one column per system, one screenful ----------
     The three stacked bands - flow, then figures, then curve, each full width
     and each repeated per system - came to 1,695px on a 1440x900 laptop, so
     nothing below the first diagram was visible and the two systems could
     never be compared. They are columns now. The height is won back mostly by
     printing each reading once: producing now, house load, grid and battery
     are in the diagram, so the tiles below it do not repeat them. */
  /* min(430px, 100%): a phone is narrower than one column, and a column that
     cannot shrink below 430px widened the whole page past the screen. */
  .ovgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(430px, 100%), 1fr)); gap: 16px; }
  .ovsys {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
    box-shadow: var(--shadow); display: flex; flex-direction: column; min-height: 0; overflow: hidden;
  }
  /* The link wrapper takes only the height its contents need. Left to grow it
     shares the spare space with the chart, and the curve - the one part that
     gets better with more room - ends up smaller than the air above it. */
  .ovmain {
    display: flex; flex-direction: column; flex: 0 0 auto;
    text-decoration: none; color: inherit;
  }
  .ovmain:hover .ovname { text-decoration: underline; text-underline-offset: 3px; }
  .ovmain:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; border-radius: var(--r); }
  .ovchart:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; border-radius: var(--r); }
  .ovhead { display: flex; align-items: center; gap: 10px; padding: 14px 18px 0; flex: 0 0 auto; }
  .ovname { font-weight: 700; font-size: 16px; letter-spacing: -.01em; color: var(--accent-ink, var(--accent)); }
  .ovchip {
    font-size: 10.5px; padding: 2px 9px; border-radius: 999px; white-space: nowrap;
    border: 1px solid var(--line); color: var(--muted); background: var(--surface-2);
  }
  .ovwhen { margin-left: auto; display: flex; align-items: center; gap: 9px; font-size: 11.5px; color: var(--faint); white-space: nowrap; }
  /* ---------- overview energy flow ----------
     A row of nodes rather than the detail page's plan view. In a half-width
     column the plan view shrinks until its own labels cannot be read, and a
     hybrid - which has more to draw - ends up with a picture half the size of
     the on-grid one beside it. A row keeps every figure at full size. */
  .ovnodes { display: flex; align-items: flex-start; justify-content: center; gap: 2px; padding: 4px 14px 14px; }
  .ovnode { display: flex; flex-direction: column; align-items: center; gap: 5px; flex: 0 1 120px; min-width: 0; }
  .ovring {
    width: clamp(40px, 3.4vw, 52px); height: clamp(40px, 3.4vw, 52px); border-radius: 50%;
    border: 2px solid var(--line); background: var(--surface-2);
    display: grid; place-items: center; font-size: clamp(16px, 1.4vw, 21px);
  }
  .ovnode.live .ovring { border-color: var(--accent); }
  .ovnode .ovlab {
    font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--faint); text-align: center; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; max-width: 100%;
  }
  .ovnode .ovval { font-size: clamp(13px, 1.1vw, 16px); font-weight: 700; font-variant-numeric: tabular-nums; }
  .ovnode .ovval.good { color: var(--ok); }
  .ovnode .ovval.dim { color: var(--faint); }
  .ovnode .ovsub { font-size: 9.5px; color: var(--faint); white-space: nowrap; }
  .ovarrow {
    flex: 1 1 auto; min-width: 12px; max-width: 84px; height: 2px; position: relative;
    background: var(--line); margin-top: clamp(18px, 1.6vw, 25px);
  }
  .ovarrow::after {
    content: ""; position: absolute; right: -1px; top: -4px;
    border-left: 8px solid var(--line);
    border-top: 5px solid transparent; border-bottom: 5px solid transparent;
  }
  .ovarrow.live { background: var(--accent); }
  .ovarrow.live::after { border-left-color: var(--accent); }
  .ovarrow.back { transform: scaleX(-1); }

  /* The chart's caption above the drawing, not written across it: what the
     reading is on the left, the day's peak on the right. */
  .soc { margin-top: 16px; }
  .soc .ovchart-head { margin-bottom: 6px; }
  .soc-chart { width: 100%; height: auto; display: block; }
  .soc-chart .axis { font-size: 11px; }
  .ovchart-head { display: flex; align-items: baseline; gap: 10px; padding: 4px 12px 2px; }
  .ovchart-head .t { font-size: 9.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
  .ovchart-head .p { margin-left: auto; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  /* Diagram and chart are both pinned; the tiles take the slack.
     A hybrid has more to say than an on-grid inverter - twelve figures instead
     of eight, and a self-powered bar - and that difference has to land
     somewhere. Letting it land on the diagram drew one system's picture at
     318px and the other's at 203px, which reads as a mistake rather than as
     information. Letting it land on the chart makes the two day curves
     different sizes, which defeats the comparison the layout exists for. So it
     lands on the tile grid, where a row of eight simply gets more air than a
     row of twelve, and nothing looks broken. */
  .ovflow { flex: 0 0 auto; padding: 0 10px; }
  .ovtiles {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px;
    background: var(--line-soft); border-top: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft);
    /* The figures take the height they need and the curve takes what is left,
       which is the way round the reviewed design had it: a chart is worth more
       to a reader than air between two rows of numbers. Rows may still
       compress on a short window rather than pushing the curve out of the
       card - grid rows size to their content by default, which is what once
       drew the figures straight over the chart. */
    flex: 0 1 auto; grid-auto-rows: minmax(0, auto);
  }
  .ovtiles > div { background: var(--surface); padding: 11px 14px; min-width: 0; }
  .ovtiles .k {
    color: var(--faint); font-size: 9.5px; letter-spacing: .09em; text-transform: uppercase;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ovtiles .v {
    font-weight: 700; font-size: 18px; line-height: 1.4; letter-spacing: -.02em; margin-top: 3px; font-variant-numeric: tabular-nums;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* The unit is not the figure. Setting it smaller and quieter lets a column
     of tiles read as numbers instead of as a wall of text. */
  .ovtiles .v small { font-size: 11px; font-weight: 600; color: var(--muted); margin-left: 2px; }
  .ovtiles .v.sm { font-size: 14px; }
  .ovtiles .v.import { color: var(--solarman); }
  .ovtiles .v.export { color: var(--ok); }
  .ovchart {
    display: flex; flex-direction: column; flex: 1 1 auto; min-height: 120px;
    padding: 0 8px 6px; text-decoration: none; color: inherit;
  }
  .ovchart svg { display: block; width: 100%; flex: 1 1 auto; min-height: 0; }

  /* Four tiles across needs about 150px each to hold "Discharged today" and a
     five-digit lifetime figure without truncating. Below that, two. */
  @media (max-width: 720px) {
    .ovtiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .ovhead { flex-wrap: wrap; }
    .ovwhen { margin-left: 0; }
  }

  /* Wide screens get the whole thing in one screenful; narrow ones stack the
     columns and scroll, because there is no honest way to fit two systems on
     a phone. 1080px is where two 430px columns plus the gap stop fitting. */
  /* Fitting the window also needs the window to be worth fitting. On a short
     one the diagram, twelve figures and a readable curve genuinely do not go
     together, and squeezing them until they collide is worse than a short
     scroll. */
  @media (min-width: 1080px) and (min-height: 660px) {
    body.ovfit { height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    body.ovfit .wrap { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; max-width: 1560px; padding-bottom: 0; }
    body.ovfit #view { flex: 1 1 auto; min-height: 0; display: flex; }
    body.ovfit .ovgrid { flex: 1 1 auto; min-height: 0; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    body.ovfit footer { margin: 10px 0 12px; }
  }

  .chartgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px 22px; }
  .chartmini { min-width: 0; }
  .chartmini .combined { height: 200px; }
  .flowgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 4px 20px; }
  .flowmini { min-width: 0; }
  .flowmini .mini-name { font-size: 13.5px; font-weight: 700; margin-bottom: 2px; }
  .flowmini .flow { max-height: 230px; }
  a.flowlink { display: block; color: inherit; }
  a.flowlink:hover .card { box-shadow: var(--shadow-lift); }
  .seemore { font-size: 12.5px; font-weight: 700; color: var(--muted); }
  a.flowlink:hover .seemore { color: var(--ink); }
  .cardhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 15px 20px; border-bottom: 1px solid var(--line-soft); }
  .cardhead h2 { margin: 0; padding: 0; border: none; font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--faint); }
  .flowhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }

  /* ---------- blocks (detail) ---------- */
  .blocks { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 16px; align-items: start; }
  .kv { display: grid; grid-template-columns: minmax(96px, auto) 1fr; gap: 9px 18px; font-size: 14px; margin: 0; }
  .kv dt { color: var(--muted); font-weight: 500; }
  .kv dd { margin: 0; font-weight: 650; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .kv dd.mono { font-family: var(--mono); font-size: 12.5px; font-weight: 500; }

  .bars { display: flex; flex-direction: column; gap: 12px; }
  .bar-row { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; font-size: 13px; }
  .bar-row .lbl { color: var(--muted); font-weight: 600; }
  .bar-row.unused { opacity: .55; }
  .bar-row.unused .num { color: var(--faint); font-weight: 650; }
  .cardnote { margin: 12px 0 0; font-size: 12.5px; color: var(--faint); }
  .rangepick { display: flex; gap: 8px; flex-wrap: wrap; }
  .exportrow { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .notifyrow { display: grid; gap: 6px; padding: 16px 20px; }
  .notifylabel { display: flex; align-items: center; gap: 10px; font-weight: 600; cursor: pointer; }
  .notifylabel input { width: 18px; height: 18px; accent-color: var(--solarman); cursor: pointer; }
  .pushrow { display: grid; gap: 8px; margin-top: 10px; padding-top: 12px; border-top: 1px solid var(--line); }
  .pushrow .exportrow { margin-top: 0; }
  .pushkey { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); color: var(--ink); min-width: 0; width: 16em; max-width: 100%; }
  .rangebtn, .groupbtn, .sysbtn { font: inherit; font-size: 12.5px; font-weight: 650; color: var(--muted); background: var(--surface-2);
              border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  .rangebtn:hover, .groupbtn:hover, .sysbtn:hover { border-color: var(--muted); }
  .sysbtn.on { background: var(--ink); color: var(--surface); border-color: transparent; }

  /* ---------- "a new version is available" ---------- */
  .newversion {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 60;
    display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px 12px;
    width: max-content; max-width: calc(100vw - 32px); padding: 10px 10px 10px 18px;
    border-radius: 14px; background: var(--ink); color: var(--bg); box-shadow: var(--shadow-lift);
    font-size: 14px; font-weight: 600;
  }
  .newversion button { font: inherit; font-size: 13px; cursor: pointer; border-radius: 999px; padding: 6px 14px; }
  .newversion .nv-reload { background: var(--bg); color: var(--ink); border: 1px solid var(--bg); font-weight: 700; }
  .newversion .nv-later { background: none; color: inherit; border: 1px solid transparent; font-weight: 600; }
  .newversion button:focus-visible { outline: 2px solid var(--bg); outline-offset: 2px; }
  body.tv .newversion { display: none; }
  .syspick { margin-bottom: 10px; }
  .rangesep { width: 1px; background: var(--line); margin: 2px 4px; }
  .card.relays { margin-top: 18px; }
  .faulthist { padding: 6px 20px 18px; border-top: 1px solid var(--line-soft); }
  .fh-title { margin: 14px 0 4px; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .fh-sum { margin-bottom: 10px; }
  table.faults td { vertical-align: top; }
  td.partial { color: var(--muted); }
  .rangebtn.on, .groupbtn.on { background: var(--accent, var(--ink)); color: var(--surface); border-color: transparent; }
  .daybar { rx: 2; }
  td.faint { color: var(--faint); }
  .bar-track { height: 9px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 999px; }
  .bar-row .num { font-variant-numeric: tabular-nums; font-weight: 700; }
  .bar-row .sub2 { grid-column: 2 / -1; color: var(--faint); font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ---------- devices ---------- */
  .tablewrap { overflow-x: auto; }
  .tablewrap:focus-visible { outline: 2px solid var(--solarman); outline-offset: 2px; border-radius: 8px; }
  table.devices { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.devices th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--faint); font-weight: 700; padding: 14px 14px 10px; border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  table.devices td { padding: 13px 14px; border-bottom: 1px solid var(--line-soft); vertical-align: top; font-variant-numeric: tabular-nums; }
  table.devices tr:last-child td { border-bottom: none; }
  table.devices td.mono { font-family: var(--mono); font-size: 12.5px; }
  .dev-name { font-weight: 700; }
  .dev-meta { color: var(--muted); font-size: 12.5px; }

  /* Each datalogger: what it says about itself, and its link over a week. */
  .loggers { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap: 16px; margin-bottom: 16px; }
  .linkhist { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
  .linkhist .lh-head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; font-size: 13px; }
  .linkhist .lh-head .t { font-weight: 700; }
  .linkhist .lh-head .p { color: var(--muted); }
  .lstrip { display: flex; height: 14px; border-radius: 4px; overflow: hidden; background: var(--line-soft); }
  .lstrip > i { display: block; height: 100%; min-width: 1px; }
  .lstrip .on { background: var(--ok); }
  .lstrip .off { background: var(--bad); }
  .lstrip .alarm { background: var(--warn); }
  .lstrip .unknown, .lstrip .none { background: var(--line); }
  .lh-axis { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .lh-key { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
  .lh-key i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .lh-key .on { background: var(--ok); } .lh-key .off { background: var(--bad); } .lh-key .none { background: var(--line); }
  .sig-chart { width: 100%; height: auto; display: block; }
  .sig-chart .grid { stroke: var(--line-soft); stroke-width: 1; }
  .sig-chart .axis { fill: var(--faint); font-size: 11px; }

  details.syssec { margin-top: 20px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow); overflow: hidden; }
  details.syssec > summary {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 16px 20px; cursor: pointer; list-style: none;
    border-bottom: 1px solid transparent;
  }
  details.syssec[open] > summary { border-bottom-color: var(--line-soft); }
  details.syssec > summary::-webkit-details-marker { display: none; }
  details.syssec > summary::before { content: "▸"; color: var(--faint); font-size: 13px; }
  details.syssec[open] > summary::before { content: "▾"; }
  details.syssec > summary:hover { background: var(--surface-2); }
  details.syssec .sname { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
  details.syssec .snow { margin-left: auto; font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
  details.syssec .snow small { font-size: 12px; color: var(--muted); font-weight: 600; }
  .secbody { padding: 18px 20px 22px; display: flex; flex-direction: column; gap: 16px; background: var(--bg); }
  .secbody > .blocks { margin: 0; }
  details.raw { margin-top: 16px; }
  details.raw summary { padding: 15px 20px; cursor: pointer; font-size: 13px; color: var(--muted); font-weight: 650; list-style: none; }
  details.raw summary::-webkit-details-marker { display: none; }
  details.raw summary::before { content: "▸ "; color: var(--faint); }
  details.raw[open] summary::before { content: "▾ "; }
  details.raw summary:hover { color: var(--ink); }
  details.raw .body { padding: 0 20px 20px; }
  details.raw input {
    width: 100%; padding: 10px 12px; margin-bottom: 12px; font: inherit; font-size: 13.5px;
    background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r-sm);
  }
  .rawgrid {
    display: grid; grid-template-columns: minmax(130px, max-content) 1fr; gap: 5px 18px;
    font-family: var(--mono); font-size: 12.5px; max-height: 360px; overflow: auto;
  }
  .rawgrid .rk { color: var(--muted); }
  .rawgrid .rv { overflow-wrap: anywhere; }

  footer { margin-top: 26px; color: var(--faint); font-size: 12.5px; display: flex; gap: 16px; flex-wrap: wrap; }
  .empty { padding: 56px 24px; text-align: center; color: var(--muted); }

  /* TV mode: a wall display. No chrome, type sized to the screen rather than to
     a reading distance, and nothing that scrolls - a display nobody touches has
     no way to scroll. */
  body.tv .topbar, body.tv footer { display: none; }
  body.tv { height: 100dvh; overflow: hidden; }
  body.tv .wrap { max-width: none; margin: 0; padding: 3vh 3vw; }
  /* #view keeps a top padding for the tabs above it; with no tabs that padding
     is exactly the height that pushed the page past the bottom of the screen. */
  body.tv #view { padding: 0; }
  .tvwrap { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 3vh; height: 94dvh; }
  .tvhead { display: flex; justify-content: space-between; align-items: flex-end; gap: 3vw; }
  .tvhead .k { color: var(--muted); font-size: clamp(14px, 1.4vw, 24px); font-weight: 600; }
  .tvtotal { font-size: clamp(44px, 7vw, 120px); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .tvtotal small, .tvnow small { font-size: .38em; color: var(--muted); font-weight: 600; margin-left: .15em; }
  .tvclock { text-align: right; }
  .tvclock .t { font-size: clamp(28px, 4vw, 68px); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  .tvgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 2.5vw; min-height: 0; }
  .tvsys { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 3vh 2.4vw;
           display: flex; flex-direction: column; gap: 2vh; min-height: 0; border-top: 6px solid var(--accent); }
  .tvname { display: flex; align-items: center; justify-content: space-between; gap: 12px;
            font-size: clamp(20px, 2.2vw, 38px); font-weight: 700; }
  .tvnow { font-size: clamp(60px, 9vw, 160px); font-weight: 800; line-height: .95; font-variant-numeric: tabular-nums; }
  .tvnow.off { color: var(--muted); }
  .tvfigs { display: flex; flex-wrap: wrap; gap: 1.5vh 3.5vw; font-size: clamp(20px, 2.3vw, 40px); font-weight: 700; font-variant-numeric: tabular-nums; }
  .tvfigs .k { display: block; color: var(--muted); font-size: .5em; font-weight: 600; margin-bottom: .2em; }
  .tvcurve { flex: 1; min-height: 0; }
  .tvcurve svg { width: 100%; height: 100%; }
  .tvexit { position: fixed; top: 14px; right: 14px; opacity: 0; transition: opacity .25s; z-index: 5; }
  body.tv.moving .tvexit { opacity: 1; }
  body:not(.tv) .tvexit { display: none; }
  .empty code { background: var(--surface-2); padding: 3px 8px; border-radius: 7px; font-family: var(--mono); font-size: 12.5px; }
  .stack { display: flex; flex-direction: column; gap: 18px; }
</style>
</head>
<body>
<div class="topbar">
  <div class="inner">
    <a class="brand" href="#/"><img class="mark" src="/icon.svg" alt="" width="28" height="28">SolarLens</a>
    <div class="fleet">
      <div class="fitem" title="Both systems added together. An offline system counts as zero, and is named underneath."><span class="flabel">Producing now</span><span class="num" id="fleet-power">—</span><span class="quiet" id="fleet-quiet" hidden></span></div>
      <span class="sep"></span>
      <div class="fitem" title="Both systems added together, since midnight"><span class="flabel">Produced today</span><span class="num small" id="fleet-today">—</span></div>
      <span class="sep"></span>
      <div class="fitem" title="What the houses used today"><span class="flabel">Consumed today</span><span class="num small" id="fleet-used">—</span></div>
      <span class="sep" id="wx-sep" hidden></span>
      <div class="fitem" id="wx-item" hidden><span class="flabel">Weather</span><span class="num small" id="fleet-wx">—</span></div>
    </div>
    <span class="livedot" id="updated"><i></i>loading…</span>
    <a class="tvbtn guidebtn" id="guidebtn" href="#/guide" aria-label="Guide: what SolarLens does and where to find it" title="Guide: what SolarLens does and where to find it"><svg class="guideicon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 6.5C10.3 5.2 7.9 4.5 3 4.5v13c4.9 0 7.3.7 9 2 1.7-1.3 4.1-2 9-2v-13c-4.9 0-7.3.7-9 2z"/><path d="M12 6.5v13"/></svg><span class="guidelabel">Guide</span></a>
    <a class="tvbtn" id="tvbtn" href="#/tv" aria-label="TV mode" title="TV mode: full screen, for a wall display">📺</a>
    <button class="themebtn" id="theme" type="button" aria-label="Change theme">🖥️</button>
  </div>
  <div class="inner" style="padding-top:0">
    <nav id="nav">
      <a href="#/">Overview</a>
      <a href="#/power">Power</a>
      <a href="#/history">Historical Data</a>
      <a href="#/alerts">Alerts<span class="navbadge" id="alertbadge" hidden></span></a>
      <a href="#/devices">Devices</a>
    </nav>
  </div>
</div>

<a class="tvbtn tvexit" href="#/" aria-label="Leave TV mode">Exit TV mode · Esc</a>
<div class="wrap">
  <main id="view"><div class="empty">Loading…</div></main>
  <footer>
    <span id="poll-status">—</span>
  </footer>
</div>

<script>
/*
  The whole dashboard is this one script: no framework, no build step. It
  fetches JSON from the Worker's /api routes and draws each view as an HTML
  string into <main id="view">. Its parts, in the order they appear - search
  for "---------- <name>" to jump to one:

    setup            how often to fetch, and the one `state` object every view reads
    history as a file    Download CSV on Historical Data
    notifications    "Tell me when something changes", while the page is open
    notifications to a closed browser (Web Push)    the phone half
    formatting       watts, kWh, dates, "5 min ago", HTML escaping
    time and days    each plant's own midnight, and which day a reading belongs to
    batteries        whether a system has one, and its derived cycle count
    charts           sparklines, one system's day curve, the shared chart
    energy flow      the solar / house / grid / battery diagram
    power            the Power tab
    overview         the Overview tab
    alerts           the Alerts tab: what is wrong now, and fault history
    historical data  the Historical Data tab
    devices          the Devices tab: each datalogger and its week, hardware, SolisCloud relays
    system detail    one system in full: the blocks Power and a system page share
    the guide        the Guide page, behind the book icon in the header
    routing          which view the address (#/...) asks for; TV mode
    loading data     fetching from /api, on a timer and on coming back to the tab
    theme            light, dark, or follow the device
    a new version    offering a reload when a release is out

  Everything a view needs is in `state` (below): state.latest from
  /api/latest, state.series from /api/series, and so on. A view reads state and
  writes HTML; refresh() fills state and asks the current view to draw again.
*/
(() => {
  const $ = (id) => document.getElementById(id);
  // What is actually running: this script and the page's styles, exactly as
  // they were served. Read now, while the script is executing - currentScript
  // is only set during that - for the new-version check at the foot of this file.
  const RUNNING_SCRIPT = document.currentScript ? document.currentScript.textContent : null;
  const RUNNING_STYLE = document.querySelector('head style')?.textContent ?? null;
  // ---------- setup ----------
  /**
   * How often to ask.
   *
   * Neither cloud produces a new sample more often than every five minutes, so
   * the original thirty-second poll asked twenty times over for the same
   * answer - and kept asking in background tabs nobody was looking at. Ten
   * minutes is comfortably inside what the data can actually change.
   *
   * A hidden tab asks for nothing at all; returning to it fetches immediately,
   * which is the moment a stale figure would matter.
   */
  const REFRESH_MS = 10 * 60_000;
  // A wall display is never hidden, so it never gets the refresh-on-return that
  // makes ten minutes enough for a tab. Five matches the vendors' own sample
  // rate: any faster would ask for data that cannot have changed.
  const TV_REFRESH_MS = 5 * 60_000;
  // Declared up here, not beside schedule(): a page opened straight on #/tv
  // routes, and so schedules, before the bottom of this script has run.
  let timer = null;
  // Comfortably longer than the poll interval plus a vendor's own publishing
  // gap. At a ten-minute poll a fifteen-minute cutoff would tip a perfectly
  // healthy system into "offline" in the minutes before the next fetch, purely
  // because nobody had asked recently.
  const STALE_AFTER_S = 25 * 60;

  // Which chart series the reader has switched off. Remembered per browser:
  // having to switch the same line off after every refresh is worse than not
  // being able to switch it off at all.
  const savedHidden = (() => {
    try { return new Set(JSON.parse(localStorage.getItem('sl-hidden') || '[]')); } catch { return new Set(); }
  })();
  // Everything the views draw from, filled by refresh() and the load*()
  // functions: the newest reading per system, today's samples, the hardware,
  // the poll log, and which chart lines the reader has switched off.
  const state = { latest: null, series: null, devices: [], deviceHistory: null, health: null, error: null, hidden: savedHidden };

  // Each vendor's colour, for chart lines and accents.
  const colorFor = (p) => ({ soliscloud: 'var(--solis)', solarman: 'var(--solarman)', local: 'var(--local)' }[p] || 'var(--muted)');

  // ---------- history as a file ----------
  /**
   * History, as a file.
   *
   * The Historical tab already holds every figure the vendors publish per day,
   * month and year; this writes the same rows out so they can be opened in a
   * spreadsheet. Built in the page from what is already on screen - no new
   * request, and nothing the Worker has to spend a database read on.
   *
   * Semicolon-safe: a value containing a comma, a quote or a newline is quoted
   * and its quotes doubled, which is the rule every spreadsheet agrees on.
   */
  const csvCell = (v) => {
    if (v === null || v === undefined) return '';
    let text = String(v);
    // A plant is named by its vendor, and a spreadsheet runs any cell starting
    // with =, +, - or @ as a formula the moment the file is opened. A leading
    // apostrophe makes it text again, which is all a name ever was.
    if (/^[=+\-@\t\r]/.test(text)) text = "'" + text;
    return /[",\n\r]/.test(text) ? '"' + text.split('"').join('""') + '"' : text;
  };

  /** A header and rows as CSV text, with Windows line endings Excel expects. */
  function toCsv(header, rows) {
    return [header, ...rows].map((r) => r.map(csvCell).join(',')).join('\r\n') + '\r\n';
  }

  /**
   * Hand the browser a file.
   *
   * A blob and an anchor, rather than a route on the Worker: the data is
   * already here, and a download endpoint would be one more thing to guard.
   */
  function downloadCsv(name, text) {
    const blob = new Blob(['\ufeff' + text], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    // Revoked on the next turn of the loop: Safari needs the URL to outlive the
    // click, and every browser leaks the blob if it is never revoked at all.
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  // ---------- notifications ----------
  /**
   * Telling you once, when something changes.
   *
   * The Alerts tab has always been right and always been silent: it says a
   * system is offline only while somebody is looking at it. This raises the
   * browser's own notification when a row appears that was not there before -
   * on the laptop or the wall display that keeps the dashboard open, which is
   * where a fault is worth hearing about.
   *
   * Deliberately modest about what it claims. The browser only runs this page
   * while a tab holds it open, so this is a louder dashboard rather than a
   * pager: a machine that is asleep tells nobody anything. Notifications that
   * reach a closed browser are the Web Push half, in the next section.
   *
   * Permission is asked for only when the switch is turned on, never on load.
   */
  const NOTIFY_KEY = 'solarlens-notify';
  const notifySupported = () => typeof Notification !== 'undefined';
  const notifyOn = () => {
    try { return localStorage.getItem(NOTIFY_KEY) === 'on' && notifySupported() && Notification.permission === 'granted'; }
    catch { return false; }
  };

  /** What has already been announced, so a standing fault is not repeated. */
  const announced = new Set();
  let announcedPrimed = false;

  /** One stable key per alert: the same fault on the same system is one thing. */
  const alertKey = (inv, row) => `${inv.id}|${row.level}|${row.title}`;

  /** Every alert on screen right now, as keys. */
  function currentAlertRows() {
    const rows = [];
    for (const inv of state.latest?.inverters ?? []) {
      for (const row of alertsFor(inv)) rows.push({ inv, row, key: alertKey(inv, row) });
    }
    return rows;
  }

  /**
   * Raise a browser notification for each alert that was not there before.
   * Called after every refresh; does nothing unless the switch is on.
   */
  function notifyOfAlerts() {
    if (!notifyOn()) return;
    const rows = currentAlertRows();
    const keys = new Set(rows.map((r) => r.key));
    // Drop anything that has cleared, so it can announce itself if it returns.
    for (const key of [...announced]) if (!keys.has(key)) announced.delete(key);

    // The first pass after the switch is turned on records what is already
    // wrong without shouting about it: you turned this on to hear what happens
    // next, not to be told the last week at once.
    if (!announcedPrimed) {
      for (const k of keys) announced.add(k);
      announcedPrimed = true;
      return;
    }

    for (const { inv, row, key } of rows) {
      if (announced.has(key)) continue;
      announced.add(key);
      try {
        const n = new Notification(`${inv.name}: ${row.title}`, {
          body: row.detail,
          tag: key,            // one notification per fault, replaced rather than stacked
          icon: '/icon-192.png',
          badge: '/icon-192.png',
          requireInteraction: row.level === 'bad',
        });
        n.onclick = () => { window.focus(); location.hash = '#/alerts'; n.close(); };
      } catch { /* a browser that refuses is not a reason to break the refresh */ }
    }
  }

  /** The switch itself, on the Alerts tab. */
  async function toggleNotify(on) {
    try {
      if (!on) { localStorage.setItem(NOTIFY_KEY, 'off'); announcedPrimed = false; return true; }
      if (!notifySupported()) return false;
      const permission = Notification.permission === 'granted'
        ? 'granted'
        : await Notification.requestPermission();
      if (permission !== 'granted') return false;
      localStorage.setItem(NOTIFY_KEY, 'on');
      // Prime here, from what is on screen, rather than on the next refresh:
      // that refresh is often the one carrying the new alert, and priming then
      // would swallow the first thing you turned this on to hear about.
      announced.clear();
      for (const { key } of currentAlertRows()) announced.add(key);
      announcedPrimed = true;
      return true;
    } catch { return false; }
  }

  // ---------- notifications to a closed browser (Web Push) ----------
  //
  // The switch above needs the dashboard open. This half reaches a phone in a
  // pocket: the device hands the server its push address, and the server wakes
  // it when a system stops mid-day, a fault is recorded, or a SolisCloud login
  // needs renewing. Which of those is worth waking someone for is decided on
  // the server - see src/push.ts - because the on-grid system goes quiet every
  // night, and a phone should not be told so every evening.
  //
  // Signing a device up is a write, so it needs the SolarLens key: from the
  // cookie /auth leaves on a device that has been signed in, or typed here
  // once. A typed key is sent with that one request and kept only in memory,
  // for the test button, until the page is closed.
  const pushSupported = () => window.isSecureContext && 'serviceWorker' in navigator && 'PushManager' in window && notifySupported();
  const pushBytes = (s) => {
    const b = s.replace(/-/g, '+').replace(/_/g, '/');
    return Uint8Array.from(atob(b + '='.repeat((4 - (b.length % 4)) % 4)), (c) => c.charCodeAt(0));
  };
  let pushTypedKey = '';
  let pushNote = '';

  /** The page's service worker - registered now if it was not yet - once it is ready. */
  async function pushRegistration() {
    const reg = (await navigator.serviceWorker.getRegistration()) ?? (await navigator.serviceWorker.register('/sw.js'));
    return navigator.serviceWorker.ready.then(() => reg);
  }

  /**
   * Where this device stands: push unsupported, not set up on the server, or
   * set up and either on or off here - with what is needed to change it.
   */
  async function pushState() {
    if (!pushSupported()) return { kind: 'unsupported' };
    try {
      const res = await fetch('/api/push/key', { credentials: 'same-origin' });
      if (res.status === 404) return { kind: 'unset' };
      if (!res.ok) return { kind: 'error' };
      const { publicKey } = await res.json();
      const reg = await pushRegistration();
      const sub = await reg.pushManager.getSubscription();
      return { kind: sub ? 'on' : 'off', publicKey, reg, sub };
    } catch {
      return { kind: 'error' };
    }
  }

  // A POST to one of the push routes, with the typed key when there is one.
  const pushPost = (path, body, key) => fetch(path, {
    method: 'POST',
    credentials: 'same-origin',
    headers: { 'content-type': 'application/json', ...(key ? { authorization: `Bearer ${key}` } : {}) },
    body: JSON.stringify(body),
  });

  /**
   * Turn notifications on for this device: ask the browser for permission,
   * subscribe with the server's public key, and hand the subscription to the
   * server. Returns a note for the reader, or needKey when the server wants one.
   */
  async function pushOn(st, key) {
    const permission = Notification.permission === 'granted' ? 'granted' : await Notification.requestPermission();
    if (permission !== 'granted') return { note: 'This browser refused permission to notify. Allow notifications for this site and try again.' };
    const sub = st.sub ?? (await st.reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: pushBytes(st.publicKey) }));
    const res = await pushPost('/api/push/subscribe', { endpoint: sub.endpoint }, key);
    if (res.ok) return { note: 'On. A test notification is on its way to this device.' };
    // Not signed up on the server, so not signed up here either: a device that
    // believes it will be told, and will not be, is worse than one that knows.
    await sub.unsubscribe().catch(() => {});
    if (res.status === 401) return { needKey: true, note: key ? 'That key was not accepted.' : '' };
    const why = (await res.json().catch(() => ({}))).error;
    return { note: why ? `The server refused: ${why}.` : 'The server refused.' };
  }

  /** Draw the "Also when this browser is closed" part of the Alerts tab for the state it is in. */
  async function fillPushRow(extra = {}) {
    const row = $('pushrow');
    if (!row) return;
    // Ask where this device stands, then draw the matching state below:
    // unsupported, not set up on the server, unreadable, on, or off.
    const st = await pushState();
    const say = (html) => { if ($('pushrow') === row) row.innerHTML = html; };
    const note = (extra.note ?? pushNote) ? `<small class="faint">${esc(extra.note ?? pushNote)}</small>` : '';
    const lead = '<strong>Also when this browser is closed</strong>';
    if (st.kind === 'unsupported') {
      say(`${lead}<small class="faint">This browser cannot be told anything while it is closed. On an iPhone or iPad, add the dashboard to the home screen first and open it from there.</small>`);
      return;
    }
    if (st.kind === 'unset') {
      say(`${lead}<small class="faint">Not set up on this server yet: it needs a signing key, which its owner adds once. The README says how.</small>`);
      return;
    }
    if (st.kind === 'error') {
      say(`${lead}<small class="faint">Could not check whether this device is signed up. Try again when the dashboard is reachable.</small>`);
      return;
    }
    // On: offer a test, and a way to turn it off (no key needed for that).
    if (st.kind === 'on') {
      say(`${lead}<small class="faint">On for this device. It is told when a system stops mid-day, a fault is recorded, or a SolisCloud login needs renewing.</small>
        <div class="exportrow"><button type="button" class="rangebtn" id="pushtest">Send a test</button>
          <button type="button" class="rangebtn" id="pushoff">Turn off for this device</button></div>${note}`);
      $('pushtest').onclick = async () => {
        const res = await pushPost('/api/push/test', { endpoint: st.sub.endpoint }, pushTypedKey);
        fillPushRow({ note: res.ok ? 'Sent. It should arrive within a few seconds.'
          : res.status === 401 ? 'Sending a test needs this device to be signed in. Turn this off and on again with the key.'
            : 'The server could not reach this device. Turn this off and on again.' });
      };
      $('pushoff').onclick = async () => {
        await pushPost('/api/push/unsubscribe', { endpoint: st.sub.endpoint }).catch(() => {});
        await st.sub.unsubscribe().catch(() => {});
        pushNote = 'Off. This device will not be told anything while the dashboard is closed.';
        fillPushRow();
      };
      return;
    }
    // Off: offer to turn it on, with a field for the key if the server asked for one.
    const needKey = !!extra.needKey;
    say(`${lead}<small class="faint">Tells this device when a system stops mid-day, a fault is recorded, or a SolisCloud login needs renewing - even with the dashboard closed.</small>
      <div class="exportrow">${needKey
        ? `<input type="password" class="pushkey" id="pushkey" autocomplete="off" placeholder="SolarLens key" aria-label="SolarLens key">`
        : ''}<button type="button" class="rangebtn" id="pushon">Turn on for this device</button></div>
      ${needKey ? '<small class="faint">This device is not signed in, and signing a device up needs the key. It is sent with this request and not stored.</small>' : ''}${note}`);
    $('pushon').onclick = async () => {
      const typed = $('pushkey') ? $('pushkey').value.trim() : '';
      if (typed) pushTypedKey = typed;
      const out = await pushOn(st, typed || pushTypedKey);
      pushNote = out.needKey ? '' : out.note;
      fillPushRow(out);
    };
  }

  /**
   * The Historical tab's rows, exactly as the table shows them.
   *
   * Taken from what the view built rather than from the raw response: the
   * month and year tables are days folded together, and sometimes the vendor's
   * own totals in their place. Exporting the raw days under a file named
   * "month" would be a different set of numbers wearing the same label.
   */
  function historyCsv() {
    const view = state.historyView;
    const group = view?.group ?? state.historyGroup ?? 'day';
    const nameOf = (id) => (state.latest?.inverters ?? []).find((i) => i.id === id)?.name ?? id;
    const iso = (ts) => (ts ? new Date(ts * 1000).toISOString() : '');

    const header = group === 'day'
      ? ['day', 'system', 'generated_kwh', 'peak_w', 'consumed_kwh', 'imported_kwh', 'exported_kwh',
        'battery_charged_kwh', 'battery_discharged_kwh', 'samples', 'first_reading_utc', 'last_reading_utc']
      : [group, 'system', 'generated_kwh', 'recorded_here_kwh', 'peak_w', 'consumed_kwh', 'imported_kwh',
        'exported_kwh', 'battery_charged_kwh', 'battery_discharged_kwh', 'days_recorded', 'samples', 'figures_from'];

    const body = [];
    for (const [invId, rows] of Object.entries(view?.byInv ?? {})) {
      for (const r of rows) {
        body.push(group === 'day'
          ? [r.day, nameOf(invId), r.yield_kwh, r.peak_w, r.load_kwh, r.import_kwh, r.export_kwh,
            r.batt_charge_kwh, r.batt_discharge_kwh, r.samples, iso(r.first_ts), iso(r.last_ts)]
          : [r.day, nameOf(invId), r.yield_kwh, r.recorded_kwh, r.peak_w, r.load_kwh,
            r.import_kwh, r.export_kwh, r.batt_charge_kwh, r.batt_discharge_kwh, r.days, r.samples,
            r.source === 'vendor' ? 'vendor total' : 'recorded here']);
      }
    }
    // A file of one system is named for it, so two downloads side by side in a
    // folder say which is which.
    const slug = view?.system ? `${String(view.system).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '')}-` : '';
    return { header, body, name: `solarlens-history-${slug}${group}-${new Date().toISOString().slice(0, 10)}.csv` };
  }
  // ---------- formatting ----------
  // The same vendor in a colour that can be read as small bold type: axe
  // measured the brand orange at 3.42:1 against white, and 4.5 is the bar.
  const inkFor = (p) => ({ soliscloud: 'var(--solis-ink)', solarman: 'var(--solarman-ink)', local: 'var(--local-ink)' }[p] || 'var(--muted)');
  const providerName = (p) => p === 'soliscloud' ? 'SolisCloud' : p === 'solarman' ? 'SolarMan' : p;

  // Watts as [number, unit] - "8.47", "kW" - so a view can set the unit
  // smaller; fmtWs as one string; fmtKwh as energy. A missing figure is a dash.
  const fmtW = (w) => {
    if (w === null || w === undefined) return ['—', ''];
    const a = Math.abs(w);
    return a >= 1000 ? [(w / 1000).toFixed(2), 'kW'] : [Math.round(w).toString(), 'W'];
  };
  const fmtWs = (w) => { const [v, u] = fmtW(w); return u ? `${v} ${u}` : v; };
  const fmtKwh = (k) => (k === null || k === undefined) ? '—' : `${k >= 100 ? k.toFixed(0) : k.toFixed(1)} kWh`;
  // Part of a whole as a percentage, or null when the question does not apply.
  // A whole of zero is not a 0% answer, it is no answer: before dawn nothing
  // has been generated and nothing consumed, and 0% self-sufficient would be a
  // claim about a day that has not started. Clamped to 100 because the vendor's
  // own counters are rounded independently and can cross by a rounding step.
  const share = (part, whole) => (part == null || whole == null || !(whole > 0))
    ? null : Math.min(100, Math.round((part / whole) * 100));
  const fmtDate = (s) => !s ? '—' : new Date(s * 1000).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
  // How long ago an epoch-seconds time was, in the words the page uses.
  const ago = (s) => {
    if (!s) return 'never';
    const d = Math.max(0, Math.floor(Date.now() / 1000) - s);
    if (d < 60) return `${d}s ago`;
    if (d < 3600) return `${Math.floor(d / 60)} min ago`;
    return `${Math.floor(d / 3600)} h ${Math.floor((d % 3600) / 60)} min ago`;
  };
  // Every vendor string goes through esc() before it becomes HTML, so a plant
  // name can never be markup.
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // ---------- time and days ----------
  const startOfToday = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return Math.floor(d.getTime() / 1000); };
  // Midnight where the panels are. A solar day ends when the sun sets on the
  // array, so a reader in another country was being shown two half-days glued
  // together. Falls back to the reader's own midnight for a plant whose vendor
  // never reported a timezone, which is exactly what every plant used before.
  const dayStart = (offsetSec) => offsetSec == null
    ? startOfToday()
    : Math.floor((Math.floor(Date.now() / 1000) + offsetSec) / 86400) * 86400 - offsetSec;
  // The reader's clock rendered in the plant's zone, for axis ticks.
  const plantHour = (ts, offsetSec) => offsetSec == null
    ? new Date(ts * 1000).getHours()
    : Math.floor(((ts + offsetSec) % 86400) / 3600);
  // Which day a reading fell on where the plant stands, under the offset it
  // was taken at rather than the one in force now. On the day the clocks change
  // there the two differ, and the morning would otherwise be filed under
  // yesterday - or the last hour of today under tomorrow.
  const plantDay = (ts, offsetSec) => {
    if (offsetSec == null) {
      const d = new Date(ts * 1000);
      return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 1000 / 86400);
    }
    return Math.floor((ts + offsetSec) / 86400);
  };
  // The offset in force around an instant, read off the nearest sample rather
  // than assumed: every reading carries the offset it was taken under.
  const offsetNear = (pts, ts, fallback) => {
    const list = pts || [];
    // Before the first sample, the first sample's own offset - the axis opens
    // at the day's start, which is earlier than anything recorded in it, and
    // the offset in force now is the wrong clock for that end of the day.
    const first = list.find((p) => p.tz_offset_sec != null);
    let off = first ? first.tz_offset_sec : fallback;
    for (const p of list) {
      if (p.ts > ts) break;
      if (p.tz_offset_sec != null) off = p.tz_offset_sec;
    }
    return off;
  };
  // The two instants a plant's day runs between. Normally 24 hours; on the day
  // the clocks change there, 23 or 25 - the morning was read under one offset
  // and the evening under another, so each end is built from the offset that
  // end was actually read at.
  const dayWindow = (inv, pts) => {
    const off = inv && inv.tz_offset_sec;
    const midnightNow = dayStart(off);
    if (off == null) return [midnightNow, midnightNow + 86400];
    const first = (pts || [])[0];
    const morning = first && first.tz_offset_sec != null ? first.tz_offset_sec : off;
    return [midnightNow + (off - morning), midnightNow + 86400];
  };
  // JSON sent as text (metrics, telemetry) as an object, or null.
  const parse = (s) => { try { return s ? JSON.parse(s) : null; } catch { return null; } };
  // One fetch covers every system, and it opens at the earliest plant's
  // midnight - so a system further east is handed samples from its own
  // yesterday evening. Cut each system's list back to its own day before any
  // of it is drawn or reduced to a peak.
  const todayOf = (inv, pts) => {
    const off = inv && inv.tz_offset_sec;
    const today = plantDay(Math.floor(Date.now() / 1000), off);
    return (pts || []).filter((p) => plantDay(p.ts, p.tz_offset_sec ?? off) === today);
  };

  /** GET one /api route as JSON; a refusal becomes an 'unauthorized' error the router shows. */
  async function api(path) {
    const r = await fetch(path, { credentials: 'same-origin' });
    if (r.status === 401) throw new Error('unauthorized');
    if (!r.ok) throw new Error(`${path} -> ${r.status}`);
    return r.json();
  }

  // The two vendors report link quality on different scales: SolisCloud in dBm
  // (negative, closer to 0 is stronger), SolarMan as a 0-100 percent.
  const band = (q) => q >= 75 ? 'strong' : q >= 50 ? 'good' : q >= 25 ? 'weak' : 'very weak';
  const signalLabel = (d) => {
    if (!d) return '—';
    if (d.signal_dbm != null) return `${d.signal_dbm} dBm · ${band((d.signal_dbm + 100) * 2)}`;
    if (d.signal_pct != null) return `${Math.round(d.signal_pct)}% · ${band(d.signal_pct)}`;
    return '—';
  };

  // The hardware records that belong to one system.
  const plantIdOf = (inv) => inv.plant_id || String(inv.id || '').split(':').pop();
  const devicesFor = (inv) => state.devices.filter(
    (d) => d.provider === inv.provider && (!d.plant_id || d.plant_id === plantIdOf(inv)));

  // A hybrid has a battery; an on-grid inverter does not, so its arm and card
  // are omitted rather than drawn as a row of dashes.
  const hasBattery = (inv, m) =>
    (inv.battery_soc !== null && inv.battery_soc !== undefined) ||
    !!(m && (m.battChargeTotalKwh || m.battDischargeTotalKwh || m.batteryStatus));

  // Neither cloud reports a cycle count, but both report cumulative charge and
  // the pack's nameplate - and "energy in / usable capacity" is the equivalent
  // full cycles a BMS would count. Labelled as derived wherever it is shown.
  const packKwh = (bat) => {
    if (!bat || bat.ratedCapacityAh == null || !bat.nominalVoltageV) return null;
    const kwh = (bat.ratedCapacityAh * bat.nominalVoltageV) / 1000;
    return kwh > 0 ? kwh : null;
  };
  // ---------- batteries ----------
  // Equivalent full cycles: lifetime charge over the pack's usable capacity.
  const cycles = (m, bat) => {
    const kwh = packKwh(bat);
    return kwh && m?.battChargeTotalKwh != null ? m.battChargeTotalKwh / kwh : null;
  };

  /**
   * Offline means offline, from either direction: the vendor says the plant is
   * down, or nothing has reached us inside the staleness window. Both end in
   * the same word, because to someone looking at the screen they are the same
   * situation - the system is not telling us anything.
   */
  function statusOf(inv) {
    const age = inv.ts ? Math.floor(Date.now() / 1000) - inv.ts : null;
    const stale = age === null || age > STALE_AFTER_S;
    const offline = stale || inv.status === 'offline';
    return {
      stale, offline,
      cls: !inv.ts ? '' : inv.status === 'alarm' ? 'bad' : offline ? 'warn' : 'ok',
      text: !inv.ts ? 'no data yet' : inv.status === 'alarm' ? 'alarm' : offline ? 'offline' : (inv.status || 'reporting'),
      lastWord: inv.status || null,
    };
  }

  // Grid and battery power in words: arrows for import and export, "idle" for drift.
  const gridText = (v) => v === null || v === undefined ? '—'
    : v >= 0 ? `↓ ${fmtWs(v)}` : `↑ ${fmtWs(-v)}`;
  // A few tens of watts either way is BMS/meter drift, not real charge or
  // discharge - SolarMan reports the same reading as batteryStatus "STATIC".
  const battText = (v) => v === null || v === undefined ? '—'
    : Math.abs(v) < 50 ? 'idle' : v >= 0 ? `charging ${fmtWs(v)}` : `discharging ${fmtWs(-v)}`;

  /** The battery donut on the system detail page. */
  function ring(soc) {
    const r = 21, c = 2 * Math.PI * r, off = c * (1 - Math.min(100, Math.max(0, soc)) / 100);
    return `<svg class="ring" viewBox="0 0 54 54" aria-hidden="true">
      <circle class="track" cx="27" cy="27" r="${r}"/>
      <circle class="fill" cx="27" cy="27" r="${r}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>
      <text x="27" y="32" text-anchor="middle">${Math.round(soc)}%</text>
    </svg>`;
  }

  // ---------- charts ----------
  /** A small line of today's power, for a card. */
  function sparkline(points, color) {
    const W = 300, H = 68, P = 3;
    if (points.length < 2) return `<svg class="spark" viewBox="0 0 ${W} ${H}"></svg>`;
    const t0 = startOfToday(), t1 = t0 + 86400;
    const max = Math.max(1, ...points.map((p) => p.ac_power_w || 0));
    const x = (t) => P + ((t - t0) / (t1 - t0)) * (W - 2 * P);
    const y = (v) => H - P - ((v || 0) / max) * (H - 2 * P);
    const d = points.map((p, i) => `${i ? 'L' : 'M'}${x(p.ts).toFixed(1)},${y(p.ac_power_w).toFixed(1)}`).join(' ');
    const last = points[points.length - 1];
    const area = `${d} L${x(last.ts).toFixed(1)},${H - P} L${x(points[0].ts).toFixed(1)},${H - P} Z`;
    const id = 'g' + Math.random().toString(36).slice(2, 8);
    return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
      <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${color}" stop-opacity=".28"/>
        <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
      </linearGradient></defs>
      <path d="${area}" fill="url(#${id})"/>
      <path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
      <circle cx="${x(last.ts).toFixed(1)}" cy="${y(last.ac_power_w).toFixed(1)}" r="3" fill="${color}"/>
    </svg>`;
  }

  // ---------- energy flow ----------
  /**
   * Each arm is drawn only when the system has it, and the direction of travel
   * comes from the sign of the figure:
   *   grid    + import  -> grid feeds the house;   - export -> house feeds grid
   *   battery + charge  -> house feeds battery;    - discharge -> battery feeds house
   * An arm carrying no power is drawn in the neutral line colour with no pip,
   * so "nothing is flowing" reads differently from "this arm does not exist".
   */
  /**
   * Where the power is going, right now.
   *
   * The house is the hub and it carries the load figure itself - the old
   * version drew a house in the middle AND a separate "Consumption" node with
   * a house glyph, which asked you to work out that they were the same place.
   *
   * Solar and grid always flank the house on one line, and a hybrid hangs its
   * battery below - which is how the pack actually sits in the system, taking
   * the surplus and giving it back later. Every arm is therefore a straight
   * line: elbows made the picture look like a circuit diagram and pushed solar
   * and grid off the house's own line, which left one corner of the box empty
   * and the whole thing leaning.
   */
  function flowSvg(inv, m) {
    const CX = 500;
    const battery = hasBattery(inv, m);
    const accent = colorFor(inv.provider);
    // A hybrid needs room under the house for the pack. An on-grid system has
    // nothing to put there, so its box is simply shorter rather than carrying
    // an empty third of a diagram around.
    // One height for both, so two systems side by side are drawn at the same
    // scale and their boxes match. An on-grid plant simply has nothing to hang
    // below the house, and its row sits on the true centre line instead.
    const H = 580;
    const CY = battery ? 196 : 268;
    const HR = 66, NR = 52, W = 1000;

    const g = inv.grid_power_w, b = inv.battery_power_w;
    const dir = (v, dead, pos, neg) => v == null ? null : Math.abs(v) < dead ? 'idle' : v > 0 ? pos : neg;
    // Share of the array's own rating, which is what makes a 12 kW system and a
    // 3.5 kW one comparable at a glance. Only when there is a rating to divide
    // by, and never above 100 - inverters do overshoot their nameplate.
    const pvPct = inv.capacity_w > 0 && inv.ac_power_w != null
      ? Math.min(100, Math.round((inv.ac_power_w / inv.capacity_w) * 100))
      : null;

    const nodes = [
      {
        key: 'pv', x: 152, y: CY,
        glyph: '☀️',
        // The percentage rides on the title, where it can be read against the
        // other system's without hunting for it.
        label: pvPct == null ? 'Solar' : `Solar · ${pvPct}%`,
        value: inv.ac_power_w, into: true,
        // The single most common question about a small number is "small
        // compared to what?", so the array's rating sits under it.
        sub: inv.capacity_w ? `of ${fmtWs(inv.capacity_w)} rated` : null,
      },
      {
        key: 'grid', x: 848, y: CY, glyph: '⚡', label: 'Grid',
        value: g, into: (g ?? 0) >= 0,
        sub: dir(g, 1, 'importing', 'exporting'),
      },
      battery ? {
        key: 'batt', x: CX, y: 392, glyph: '🔋', dead: 50,
        label: `Battery${inv.battery_soc != null ? ' · ' + Math.round(inv.battery_soc) + '%' : ''}`,
        // Charging (+) draws from the house side; discharging (-) feeds it.
        value: b, into: (b ?? 0) < 0,
        sub: dir(b, 50, 'charging', 'discharging'),
      } : null,
    ].filter(Boolean);

    // A 20 W trickle and a 5 kW flood used to be drawn with identical wire, so
    // the picture said nothing the numbers did not. Width now tracks magnitude
    // against the array's rating - square-rooted, or small flows vanish.
    const ref = Math.max(1000, inv.capacity_w || 0);
    const gauge = (v) => 3.5 + 8 * Math.sqrt(Math.min(1, Math.abs(v ?? 0) / ref));
    // Each arm uses the same dead-band as the figure beside it: a pack drifting
    // a few watts is idle here too, not a live flow with an arrow on it.
    const flowing = (n) => Math.abs(n.value ?? 0) >= (n.dead ?? 1);

    // Every path is drawn node -> house, so "reversed" always means the same
    // thing and the arrow marker and the travelling pip agree on direction.
    const pathFor = (n) => {
