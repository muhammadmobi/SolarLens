        batt_charge_kwh: null, batt_discharge_kwh: null, peak_w: null, samples: 0, days: 0, span: span(k),
      };
      p.yield_kwh = add(p.yield_kwh, r.yield_kwh);
      p.load_kwh = add(p.load_kwh, r.load_kwh);
      p.import_kwh = add(p.import_kwh, r.import_kwh);
      p.export_kwh = add(p.export_kwh, r.export_kwh);
      p.batt_charge_kwh = add(p.batt_charge_kwh, r.batt_charge_kwh);
      p.batt_discharge_kwh = add(p.batt_discharge_kwh, r.batt_discharge_kwh);
      p.peak_w = r.peak_w == null ? p.peak_w : Math.max(p.peak_w ?? 0, r.peak_w);
      p.samples += r.samples ?? 0;
      p.days += 1;
      out.set(k, p);
    }
    // Newest first, like the daily rows.
    return [...out.values()].sort((a, b) => (a.day < b.day ? 1 : -1));
  }

  /**
   * A system's months or years, with the vendor's own totals wherever it has one.
   *
   * SolarLens's record starts on the day it first polled, so on its own the
   * first month is a fraction of a month and every earlier year is missing. The
   * vendors counted all of it. Where a vendor total exists it is the figure for
   * that period, and SolarLens's own record supplies only what the vendor does
   * not report - the peak, and how many of the period's days it saw itself.
   * A period the vendor never reported stays exactly as recorded.
   */
  function withVendor(own, vendorRows, group) {
    const byKey = new Map(own.map((r) => [r.day, r]));
    const keys = new Set([...byKey.keys(), ...vendorRows.map((v) => v.key)]);
    const out = [];
    for (const k of keys) {
      const r = byKey.get(k);
      const v = vendorRows.find((x) => x.key === k);
      out.push(v ? {
        day: k,
        yield_kwh: v.yield_kwh, load_kwh: v.load_kwh, import_kwh: v.import_kwh, export_kwh: v.export_kwh,
        batt_charge_kwh: v.charge_kwh, batt_discharge_kwh: v.discharge_kwh,
        peak_w: r?.peak_w ?? null, samples: r?.samples ?? 0, days: r?.days ?? 0, span: periodSpan(k, group),
        recorded_kwh: r?.yield_kwh ?? null, source: 'vendor',
      } : { ...r, recorded_kwh: r.yield_kwh, source: 'recorded' });
    }
    return out.sort((a, b) => (a.day < b.day ? 1 : -1));
  }

  // The vendors' own month and year totals, fetched once they are first needed.
  async function loadPeriods() {
    state.periods = { loading: true };
    try {
      state.periods = await api('/api/periods');
    } catch (e) {
      state.periods = { error: e.message };
    }
    if (location.hash === '#/history') renderHistory();
  }

  // One row per system per day for the last `days` days.
  async function loadHistory(days) {
    state.historyDays = days;
    try {
      state.history = await api(`/api/history?days=${days}&tz=${new Date().getTimezoneOffset()}`);
    } catch (e) {
      state.history = { error: e.message };
    }
    if (location.hash === '#/history') renderHistory();
  }

  /**
   * The Historical Data tab: the system switch, the grouping and range
   * buttons, Download CSV, then each chosen system's bars, table and totals.
   */
  function renderHistory() {
    const invs = state.latest?.inverters ?? [];
    if (!state.history) { loadHistory(state.historyDays ?? 30); }

    const days = state.historyDays ?? 30;
    const group = state.historyGroup ?? 'day';
    // Vendor totals matter only once days are folded into months or years.
    if (group !== 'day' && !state.periods) loadPeriods();
    // The day ranges mean nothing once rows are folded into months, so the
    // month and year views show only the grouping switch.
    const system = historySystem(invs);
    const systemPick = invs.length > 1
      ? `<div class="rangepick syspick" role="group" aria-label="Which system">${[['all', 'All systems'], ...invs.map((i) => [i.id, i.name])]
          .map(([id, label]) => `<button type="button" class="sysbtn${id === system ? ' on' : ''}" data-system="${esc(id)}"
            aria-pressed="${id === system}">${esc(label)}</button>`).join('')}</div>`
      : '';
    const picker = `${systemPick}<div class="rangepick">${GROUPS.map(([g, label]) =>
      `<button type="button" class="groupbtn${g === group ? ' on' : ''}" data-group="${g}">${label}</button>`).join('')}
      ${group === 'day' ? `<span class="rangesep"></span>${HISTORY_RANGES.map((d) =>
      `<button type="button" class="rangebtn${d === days ? ' on' : ''}" data-days="${d}">${d} days</button>`).join('')}` : ''}</div>`;

    if (state.history?.error) {
      $('view').innerHTML = `<div class="card"><div class="empty">Could not load history: ${esc(state.history.error)}</div></div>`;
      return;
    }
    if (!state.history) {
      $('view').innerHTML = `<section class="card"><h2>Historical Data</h2><div class="body">${picker}
        <div class="empty">Loading…</div></div></section>`;
      bindRange();
      return;
    }

    const rows = state.history.rows ?? [];
    const byInv = {};
    for (const r of rows) (byInv[r.inverter_id] ||= []).push(r);
    if (group !== 'day') {
      const vendor = (state.periods?.periods ?? []).filter((p) => p.period === group);
      for (const inv of invs) {
        byInv[inv.id] = withVendor(rollup(byInv[inv.id] ?? [], group), vendor.filter((p) => p.inverter_id === inv.id), group);
      }
    }
    // One system on its own, or all of them: everything below - the charts,
    // the tables, the row count and the CSV - follows the switch.
    const shown = system === 'all' ? invs : invs.filter((i) => i.id === system);
    const shownById = Object.fromEntries(shown.map((i) => [i.id, byInv[i.id] ?? []]));
    // What the table is about to show, kept for the CSV button: the export
    // says "as shown", and this is what shown means.
    state.historyView = { group, byInv: shownById, system: system === 'all' ? null : shown[0]?.name ?? null };
    const shownCount = Object.values(shownById).reduce((n, list) => n + list.length, 0);
    const periodWord = group === 'month' ? 'Month' : group === 'year' ? 'Year' : 'Day';

    const sections = shown.map((inv, i) => {
      const mine = byInv[inv.id] ?? [];
      const m = parse(inv.metrics) ?? {};
      if (!mine.length) {
        return `<details class="syssec" open><summary>
            <span class="vendor" style="color:${inkOf(inv)}">${esc(providerName(inv.provider))}</span>
            <span class="sname">${esc(inv.name)}</span></summary>
          <div class="secbody"><div class="empty">No days recorded yet for this system.</div></div></details>`;
      }
      const totals = mine.reduce((a, r) => ({
        yield: a.yield + (r.yield_kwh ?? 0),
        load: a.load + (r.load_kwh ?? 0),
        imp: a.imp + (r.import_kwh ?? 0),
        exp: a.exp + (r.export_kwh ?? 0),
      }), { yield: 0, load: 0, imp: 0, exp: 0 });

      const anyLoad = mine.some((r) => r.load_kwh != null);
      const anyGrid = mine.some((r) => r.import_kwh != null || r.export_kwh != null);
      const anyBatt = mine.some((r) => r.batt_charge_kwh != null || r.batt_discharge_kwh != null);

      // With a tariff set, each row also says what it was worth. The sum is
      // of the rows, so it is exactly the column's total.
      const money = state.tariff ? mine.map((r) => valueOf(r.yield_kwh, r.export_kwh)) : null;
      const worth = money ? money.reduce((a, v) => ({ money: a.money + (v?.money ?? 0), co2: a.co2 + (v?.co2 ?? 0),
        assumed: a.assumed || !!v?.assumed }), { money: 0, co2: 0, assumed: false }) : null;

      const head = [periodWord, 'Produced', anyLoad ? 'Consumed' : null, anyGrid ? 'Imported' : null,
        anyGrid ? 'Exported' : null, anyBatt ? 'Charged' : null, anyBatt ? 'Discharged' : null,
        money ? 'Saved' : null, money ? 'CO₂ avoided' : null,
        'Peak', group === 'day' ? null : 'Days recorded', 'Samples', group === 'day' ? null : 'Source'].filter(Boolean);

      // A day well below this system's middle day gets a "Why?": the day_report tool, on the Ask tab.
      const middle = group === 'day' ? (() => {
        const ys = mine.map((r) => r.yield_kwh).filter((v) => v != null).sort((a, b) => a - b);
        return ys.length >= 3 ? ys[Math.floor(ys.length / 2)] : null;
      })() : null;
      const body = mine.map((r, ri) => `<tr>
        <td class="mono">${esc(r.day)}${middle && r.yield_kwh != null && r.yield_kwh < 0.7 * middle
          ? ` <button type="button" class="whybtn" data-why-day="${esc(r.day)}" data-why-sys="${esc(inv.name)}" title="Why was this day low?">Why?</button>` : ''}</td>
        <td>${fmtKwh(r.yield_kwh)}</td>
        ${anyLoad ? `<td>${fmtKwh(r.load_kwh)}</td>` : ''}
        ${anyGrid ? `<td>${fmtKwh(r.import_kwh)}</td><td>${fmtKwh(r.export_kwh)}</td>` : ''}
        ${anyBatt ? `<td>${fmtKwh(r.batt_charge_kwh)}</td><td>${fmtKwh(r.batt_discharge_kwh)}</td>` : ''}
        ${money ? `<td>${esc(fmtMoney(money[ri]?.money))}${money[ri]?.assumed ? '*' : ''}</td><td>${esc(fmtCo2(money[ri]?.co2))}</td>` : ''}
        <td>${fmtWs(r.peak_w)}</td>
        ${group === 'day' ? '' : `<td class="${r.days < r.span ? 'partial' : ''}">${r.days} of ${r.span}</td>`}
        <td class="faint">${r.samples}</td>
        ${group === 'day' ? '' : `<td class="faint">${r.source === 'vendor' ? esc(providerName(inv.provider)) : 'SolarLens'}</td>`}
      </tr>`).join('');
      const usesVendor = mine.some((r) => r.source === 'vendor');

      // The one comparison that says how much of a period the record is
      // missing: the vendor counted the whole of this month and year, even the
      // part before SolarLens was collecting.
      const nowKey = group === 'month' ? mine[0]?.day : group === 'year' ? mine[0]?.day : null;
      const vendorNow = group === 'month' ? m.genMonthKwh : group === 'year' ? m.genYearKwh : null;
      const shortfall = !usesVendor && nowKey && vendorNow != null && mine[0].yield_kwh != null && vendorNow - mine[0].yield_kwh > 0.5
        ? `<p class="cardnote" style="margin:0 20px 4px">${esc(providerName(inv.provider))} counts ${fmtKwh(vendorNow)} for ${esc(nowKey)};
           SolarLens recorded ${fmtKwh(mine[0].yield_kwh)} across ${mine[0].days} of its ${mine[0].span} days.
           The difference is the part of the ${group} before collecting began, or days a feed was down.</p>`
        : '';

      return `<details class="syssec" open>
        <summary>
          <span class="vendor" style="color:${inkOf(inv)}">${esc(providerName(inv.provider))}</span>
          <span class="sname">${esc(inv.name)}</span>
          <span class="snow">${fmtKwh(totals.yield)}<small> in ${group === 'day'
            ? `${mine.length} day${mine.length === 1 ? '' : 's'}`
            : `${mine.length} ${group}${mine.length === 1 ? '' : 's'}`}</small></span>
        </summary>
        <div class="secbody">
          <section class="card"><div class="body">${dailyBars(mine, colorOf(inv), 'hb' + i, group)}</div></section>
          ${shortfall}
          ${group === 'day' ? batteryHealth(inv, mine) : ''}
          ${usesVendor ? `<p class="cardnote" style="margin:0 20px 4px">Figures are ${esc(providerName(inv.provider))}'s own
            ${group} totals, which cover the whole ${group} including any part before SolarLens began collecting.
            "Days recorded" is how much of it SolarLens saw itself, and the peak comes from those days.</p>` : ''}
          <div class="tablewrap" tabindex="0" role="region" aria-label="Table, scrolls sideways"><table class="devices">
            <thead><tr>${head.map((h) => `<th>${esc(h)}</th>`).join('')}</tr></thead>
            <tbody>${body}</tbody>
          </table></div>
          <dl class="kv" style="padding:16px 20px 20px">
            <dt>Recorded here</dt><dd>${fmtKwh(group === 'day' ? totals.yield : mine.reduce((a, r) => a + (r.recorded_kwh ?? 0), 0))} over ${group === 'day' ? mine.length : mine.reduce((a, r) => a + r.days, 0)} day${(group === 'day' ? mine.length : mine.reduce((a, r) => a + r.days, 0)) === 1 ? '' : 's'}</dd>
            ${worth ? `<dt>Saved</dt><dd>${esc(fmtMoney(worth.money))}${worth.assumed ? '*' : ''}</dd>
              <dt>CO₂ avoided</dt><dd>${esc(fmtCo2(worth.co2))}</dd>` : ''}
            ${m.genMonthKwh != null ? `<dt>Vendor · this month</dt><dd>${fmtKwh(m.genMonthKwh)}</dd>` : ''}
            ${m.genYearKwh != null ? `<dt>Vendor · this year</dt><dd>${fmtKwh(m.genYearKwh)}</dd>` : ''}
            ${m.genTotalKwh != null ? `<dt>Vendor · lifetime</dt><dd>${fmtKwh(m.genTotalKwh)}</dd>` : ''}
          </dl>
          ${worth ? `<p class="cardnote" style="margin:0 20px 16px">${esc(tariffLine())}${worth.assumed
            ? ' * No export figure for that period, so every kWh counts as used at home: an upper bound.' : ''}</p>` : ''}
        </div>
      </details>`;
    }).join('');

    $('view').innerHTML = `<section class="card"><h2>Historical Data</h2><div class="body">
        ${picker}
        <div class="exportrow"><button type="button" class="rangebtn" id="csv"
          title="Download these rows as a CSV file">Download CSV</button>
          <small class="faint">${shownCount} row${shownCount === 1 ? '' : 's'}, as shown</small></div>
        <p class="cardnote" style="margin-top:14px">Built from the samples SolarLens has stored, so the record begins when it
        started collecting — not when the array was installed. Each vendor's own running totals are shown at the
        foot of its section for comparison.</p>
        ${state.tariff ? '' : '<p class="cardnote">Money saved and CO₂ avoided appear here once the owner sets the tariff under Settings (the gear).</p>'}
      </div></section>${sections}`;
    bindRange();
    for (const b of document.querySelectorAll('[data-why-day]')) {
      b.onclick = () => {
        state.askPending = { tool: 'day_report', args: { date: b.dataset.whyDay, system: b.dataset.whySys } };
        location.hash = '#/ask';
      };
    }
    const csvBtn = $('csv');
    if (csvBtn) {
      csvBtn.onclick = () => {
        const { header, body, name } = historyCsv();
        downloadCsv(name, toCsv(header, body));
      };
    }
  }

  // Wire the Historical Data buttons: which system, which grouping, which range.
  function bindRange() {
    for (const b of document.querySelectorAll('.sysbtn')) {
      b.onclick = () => {
        state.historySystem = b.dataset.system;
        try { localStorage.setItem(HISTORY_SYSTEM_KEY, b.dataset.system); } catch { /* remembered for this visit only */ }
        renderHistory();
      };
    }
    for (const b of document.querySelectorAll('.rangebtn[data-days]')) {
      b.onclick = () => { state.history = null; loadHistory(Number(b.dataset.days)); renderHistory(); };
    }
    for (const b of document.querySelectorAll('.groupbtn')) {
      b.onclick = () => {
        const g = b.dataset.group;
        if (g === (state.historyGroup ?? 'day')) return;
        state.historyGroup = g;
        // Months and years need the whole window; going back to days restores
        // the default range rather than leaving a 400-day table on screen.
        const want = g === 'day' ? 30 : ROLLUP_DAYS;
        if (state.historyDays !== want) { state.history = null; loadHistory(want); }
        renderHistory();
      };
    }
  }

  /** Daily yield as bars: the shape of a month reads faster than 30 numbers. */
  function dailyBars(rows, colour, id, group = 'day') {
    // T leaves the unit label its own line: at 18 it sat on top of the highest
    // axis value, and "kWh per year" and "18.4k" printed over each other.
    const W = 1000, H = 210, L = 54, R = 12, T = 34, B = 34;
    const days = [...rows].reverse(); // oldest first, left to right
    const max = Math.max(1, ...days.map((r) => r.yield_kwh ?? 0));
    const bw = (W - L - R) / days.length;
    let out = '';
    for (let i = 0; i <= 4; i++) {
      const v = (max / 4) * i, y = T + (1 - v / max) * (H - T - B);
      out += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" vector-effect="non-scaling-stroke"/>`;
      out += `<text class="axis" x="${L - 8}" y="${y + 4}" text-anchor="end">${v >= 1000 ? (v / 1000).toFixed(1) + 'k' : Math.round(v)}</text>`;
    }
    days.forEach((r, i) => {
      const v = r.yield_kwh ?? 0;
      const h = (v / max) * (H - T - B);
      const x = L + i * bw + bw * 0.15;
      out += `<rect class="daybar" x="${x.toFixed(1)}" y="${(H - B - h).toFixed(1)}" width="${(bw * 0.7).toFixed(1)}" height="${Math.max(1, h).toFixed(1)}" fill="${colour}"><title>${esc(r.day)}: ${esc(fmtKwh(v))}</title></rect>`;
      // A label per day is unreadable past a week, so thin them out.
      const step = Math.ceil(days.length / 10);
      if (i % step === 0 || i === days.length - 1) {
        const label = group === 'year' ? r.day
          : group === 'month' ? new Date(`${r.day}-01T00:00:00Z`).toLocaleDateString(undefined, { month: 'short', year: '2-digit', timeZone: 'UTC' })
          : r.day.slice(5);
        out += `<text class="axis" x="${(x + bw * 0.35).toFixed(1)}" y="${H - 12}" text-anchor="middle">${esc(label)}</text>`;
      }
    });
    out += `<text class="axis unit" x="6" y="14">kWh per ${group}</text>`;
    return `<svg class="combined" id="${id}" viewBox="0 0 ${W} ${H}">${out}</svg>`;
  }

  // ---------- ask ----------
  /**
   * The Ask tab: a conversation with SolarLens's assistant - questions in plain
   * words and their follow-ups, statistics, reports, and how to use the app -
   * with the weekly report and each system's health below it.
   *
   * Each message goes to POST /api/chat with the last few turns of the
   * conversation: the Worker keeps none of it, and this tab keeps it only until
   * the tab closes. The assistant (src/assistant.ts) works out which read-only
   * tools answer it, the Worker computes every figure, and the answer comes back
   * with them: each table, its period, a chart where one helps, how fresh the
   * data was, and who worded it. Any answer can be downloaded as a page, to keep
   * or to print - a report most of all.
   *
   * Anyone who can see the dashboard can ask. Someone signed in - the owner, or
   * a share link - gets the model's words, which spend the day's model calls;
   * anyone else gets SolarLens's own reading of the question, and the figures'
   * own words.
   */
  const ASK_EXAMPLES = [
    'Analyse the last 30 days: what should I do?',
    'A report on last month',
    'How much did I export last week?',
    'How much did I make between 2pm and 4pm today?',
    'How steady was the power today?',
    'Graph PV against load today',
    'Which hours do I buy from the grid?',
    'Since when has a system been offline?',
    'Compare my systems per kWp last month',
    'Statistics for the last 30 days',
    'Why was yesterday low?',
    'Is any system slowly making less?',
    'How do I get alerts on Telegram?',
  ];
  const ASK_STALE_MS = 5 * 60 * 1000;
  /** Turns of the conversation kept in this tab, and sent with each message. */
  const CHAT_KEEP = 20;
  const CHAT_SENT = 4;

  /** The conversation so far, from this tab's own storage: it survives a reload, and goes when the tab closes. */
  function savedChat() {
    try { return JSON.parse(sessionStorage.getItem('sl-chat') || '[]'); } catch { return []; }
  }
  function saveChat() {
    try { sessionStorage.setItem('sl-chat', JSON.stringify(state.chat.slice(-CHAT_KEEP))); } catch { /* kept in memory only */ }
  }

  /** Whether there is a model here and who may use it, and the week's report and health: when the tab opens, at most every five minutes. */
  async function loadAskContext(force = false) {
    const fresh = state.askAt && Date.now() - state.askAt < ASK_STALE_MS;
    if (fresh && !force) return;
    state.askAt = Date.now();
    const [status, agents] = await Promise.all([api('/api/ask/status').catch(() => null), api('/api/agents').catch(() => null)]);
    state.askStatus = status;
    state.agents = agents;
    if (location.hash === '#/ask') renderAsk();
  }

  /**
   * Send a message, with the conversation so far - or, from a "Why?" button, a
   * tool asked for directly - and add the answer to the conversation.
   */
  async function sendChat(message, direct = null) {
    state.chat ??= savedChat();
    const history = state.chat.filter((t) => !t.error).slice(-CHAT_SENT).flatMap((t) => [
      { role: 'user', content: t.question },
      { role: 'assistant', content: t.answer, calls: t.calls ?? [] },
    ]);
    state.asking = message;
    renderAsk();
    let entry;
    try {
      const res = await fetch(direct ? '/api/ask' : '/api/chat', {
        method: 'POST', credentials: 'same-origin', headers: { 'content-type': 'application/json' },
        body: JSON.stringify(direct ?? { messages: [...history, { role: 'user', content: message }] }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        entry = { question: message, error: data.error === 'signin' ? 'This dashboard is private: sign in to ask.' : data.error || `The server said ${res.status}.` };
      } else {
        entry = {
          question: message, answer: data.answer, worded: data.worded, understood: data.understood, kind: data.kind, model: data.model,
          calls: data.calls ?? (data.tool ? [{ tool: data.tool, args: data.args }] : []),
          results: data.results ?? (data.result ? [data.result] : []), errors: data.errors ?? [], at: Math.floor(Date.now() / 1000),
        };
        if (state.askStatus) { state.askStatus.used = data.used; state.askStatus.limit = data.limit; }
      }
    } catch (e) {
      entry = { question: message, error: e.message };
    }
    state.asking = null;
    state.chat = [...state.chat, entry].slice(-CHAT_KEEP);
    saveChat();
    if (location.hash === '#/ask') {
      renderAsk();
      document.querySelector('.chatlog .msg:last-child')?.scrollIntoView({ block: 'nearest' });
    }
  }

  /** A figure for a table: numbers with the reader's own separators, a dash for nothing, a page of the dashboard as a link. */
  const cell = (v) => (v === null || v === undefined ? '—'
    : typeof v === 'number' ? v.toLocaleString(undefined, { maximumFractionDigits: 2 })
      : /^#\/[a-z]*$/.test(v) ? `<a href="${esc(v)}">Open</a>` : esc(v));

  /** An answer's words: a paragraph a line, and lines that start "- " as a list. Escaped, all of it. */
  function paragraphs(text) {
    const out = [];
    let list = [];
    const flush = () => { if (list.length) { out.push(`<ul>${list.map((l) => `<li>${esc(l)}</li>`).join('')}</ul>`); list = []; } };
    for (const line of String(text ?? '').split('\n').map((l) => l.trim()).filter(Boolean)) {
      if (line.startsWith('- ')) list.push(line.slice(2));
      else { flush(); out.push(`<p>${esc(line)}</p>`); }
    }
    flush();
    return out.join('');
  }

  /**
   * A chart for a result over time. A chart result says how it is drawn:
   * lines, or bars for one measure day by day. Energy per day, week, month or
   * year, the weekly ratio and a day's power hour by hour are bars of their
   * first figure. The drawing stretches to its box, so the first and last
   * labels sit beneath it as text, where stretching cannot reach them.
   */
  function miniChart(p) {
    if (p.chart) return p.chart.kind === 'line' ? lineChart(p) : barChart(p, p.chart.columns[0]);
    if (!['energy', 'performance_trend', 'power_day'].includes(p.tool) || p.rows.length < 3) return '';
    return barChart(p, p.rows[0].findIndex((v, k) => k > 0 && p.rows.some((r) => typeof r[k] === 'number')));
  }

  /** Bars for one column of a result, one a row. */
  function barChart(p, col) {
    if (p.rows.length < 3) return '';
    if (col < 1) return '';
    const values = p.rows.map((r) => (typeof r[col] === 'number' ? r[col] : 0));
    const W = 600, H = 100, T = 6;
    const max = Math.max(0.1, ...values);
    const bw = W / values.length;
    const bars = values.map((v, i) => {
      const h = (v / max) * (H - T);
      return `<rect x="${(i * bw + bw * 0.15).toFixed(1)}" y="${(H - h).toFixed(1)}" width="${(bw * 0.7).toFixed(1)}" height="${Math.max(0.5, h).toFixed(1)}"><title>${esc(p.rows[i][0])}: ${esc(cellText(values[i]))}</title></rect>`;
    }).join('');
    const first = p.rows[0][0], last = p.rows[p.rows.length - 1][0];
    return `<figure class="minichart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(`${p.columns[col]}, ${first} to ${last}`)}">${bars}</svg>
      <figcaption aria-hidden="true"><span>${esc(first)}</span><span>${esc(last)}</span></figcaption></figure>`;
  }
  /**
   * Lines for a chart result: one or two measures over time on one scale, a
   * dashed zero where the measure runs both ways (the grid, the battery), and
   * beneath the drawing the first and last times, which line is which, and
   * the range of the scale. A missing reading breaks the line rather than
   * joining across it.
   */
  function lineChart(p) {
    const cols = p.chart.columns.filter((c) => p.rows.some((r) => typeof r[c] === 'number'));
    if (!cols.length || p.rows.length < 2) return '';
    const vals = p.rows.flatMap((r) => cols.map((c) => r[c]).filter((v) => typeof v === 'number'));
    const lo = Math.min(0, ...vals);
    const hi = Math.max(...vals) > lo ? Math.max(...vals) : lo + 1;
    const W = 600, H = 100, T = 6, B = 4;
    const x = (i) => (i / (p.rows.length - 1)) * W;
    const y = (v) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
    const lines = cols.map((c, k) => {
      let d = '';
      let pen = false;
      p.rows.forEach((r, i) => {
        if (typeof r[c] !== 'number') { pen = false; return; }
        d += `${pen ? 'L' : 'M'}${x(i).toFixed(1)},${y(r[c]).toFixed(1)} `;
        pen = true;
      });
      return `<path class="s${k}" d="${d.trim()}" fill="none" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
    }).join('');
    const zero = lo < 0 ? `<line class="zero" x1="0" x2="${W}" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}" vector-effect="non-scaling-stroke"/>` : '';
    const first = p.rows[0][0], last = p.rows[p.rows.length - 1][0];
    const key = cols.map((c, k) => `<i class="k${k}"></i>${esc(p.columns[c])}`).join(' ');
    return `<figure class="minichart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(`${cols.map((c) => p.columns[c]).join(' and ')}, ${first} to ${last}`)}">${zero}${lines}</svg>
      <figcaption aria-hidden="true"><span>${esc(first)}</span><span>${key} · ${esc(cellText(lo))} to ${esc(cellText(hi))}</span><span>${esc(last)}</span></figcaption></figure>`;
  }
  const cellText = (v) => (typeof v === 'number' ? v.toLocaleString(undefined, { maximumFractionDigits: 2 }) : String(v ?? '—'));

  /** A result's evidence: its title and period, a chart where one helps, the table, the notes - and a report's parts, each the same. */
  function evidence(r, open) {
    return [r, ...(r.sections ?? [])].map((p, n) => `<details class="evidence" ${open && n === 0 ? 'open' : ''}>
      <summary>${esc(p.title)}${p.period ? ` · ${esc(p.period.label)}` : ''}</summary>
      ${n > 0 ? `<p class="cardnote">${esc(p.summary)}</p>` : ''}
      ${miniChart(p)}
      ${p.rows.length ? `<div class="tablewrap" tabindex="0" role="region" aria-label="${esc(p.title)}, scrolls sideways"><table class="devices">
        <thead><tr>${p.columns.map((c) => `<th>${esc(c)}</th>`).join('')}</tr></thead>
        <tbody>${p.rows.map((row) => `<tr>${row.map((v) => `<td>${cell(v)}</td>`).join('')}</tr>`).join('')}</tbody>
      </table></div>` : ''}
      ${p.notes?.length ? `<ul class="asknotes">${p.notes.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
    </details>`).join('');
  }

  /** One answer in the conversation, with its evidence. */
  function botMessage(t, i) {
    if (t.error) return `<div class="msg bot"><p class="autherr">${esc(t.error)}</p></div>`;
    const results = t.results ?? [];
    const fresh = results.find((r) => r.freshness?.newest)?.freshness;
    const who = t.worded === 'model' ? 'Worded by the model from the figures below, which SolarLens worked out.'
      : results.length ? "In SolarLens's own words, from the figures below." : '';
    const read = t.understood === 'solarlens' && results.length ? ' SolarLens read the question itself.' : '';
    const freshText = fresh?.newest ? ` Data up to ${when(fresh.newest)} (${ago(fresh.newest)})${fresh.offline?.length ? `; not reporting now: ${fresh.offline.join(', ')}` : ''}.` : '';
    return `<div class="msg bot">
      <div class="said">${paragraphs(t.answer)}</div>
      ${who || read || freshText ? `<p class="by">${esc(who + read + freshText)}</p>` : ''}
      ${results.map((r, k) => evidence(r, i === state.chat.length - 1 && k === 0)).join('')}
      ${t.errors?.length ? `<ul class="asknotes">${t.errors.map((e) => `<li>${esc(e)}</li>`).join('')}</ul>` : ''}
      ${results.length ? `<div class="formrow"><button type="button" class="rangebtn" data-download="${i}">${t.kind === 'report' ? 'Download report' : 'Download'}</button></div>` : ''}
    </div>`;
  }

  /**
   * An answer as a page of its own, to keep or to print: the words, then every
   * table it rests on, with the periods, how fresh the data was, and who worded
   * it. Plain HTML with its own styles, no script, every value escaped.
   */
  function reportHtml(t) {
    const results = t.results ?? [];
    const main = results[0];
    const period = main?.period?.label ?? '';
    const table = (p) => (p.rows.length ? `<table><thead><tr>${p.columns.map((c) => `<th>${esc(c)}</th>`).join('')}</tr></thead>
      <tbody>${p.rows.map((row) => `<tr>${row.map((v) => `<td>${esc(cellText(v))}</td>`).join('')}</tr>`).join('')}</tbody></table>` : '');
    // Each part with its chart, where it has one: the same drawing the page shows, coloured by the page's own styles below.
    const part = (p, level) => `<h${level}>${esc(p.title)}${p.period ? ` <small>${esc(p.period.label)}</small>` : ''}</h${level}>
      <p>${esc(p.summary)}</p>${miniChart(p)}${table(p)}${p.notes?.length ? `<ul class="notes">${p.notes.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}`;
    const fresh = results.find((r) => r.freshness?.newest)?.freshness;
    return `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SolarLens - ${esc(t.kind === 'report' ? `report, ${period}` : t.question)}</title>
<style>
  body { font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; color: #17191a; max-width: 880px; margin: 32px auto; padding: 0 20px; }
  h1 { font-size: 24px; margin: 0 0 4px; } h2 { font-size: 18px; margin: 30px 0 6px; } h3 { font-size: 15px; margin: 22px 0 6px; }
  small { color: #5d6360; font-weight: 500; } .meta { color: #5d6360; font-size: 13px; }
  .words p { margin: 0 0 10px; } table { border-collapse: collapse; width: 100%; font-size: 13px; margin: 8px 0; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #e2e4de; } th { font-size: 12px; color: #5d6360; }
  .notes { color: #5d6360; font-size: 13px; }
  .minichart { margin: 10px 0 6px; } .minichart svg { width: 100%; height: 120px; display: block; }
  .minichart rect { fill: #2f6fde; } .minichart path.s0 { stroke: #2f6fde; } .minichart path.s1 { stroke: #db6b1c; }
  .minichart line.zero { stroke: #9aa1a8; stroke-width: 1; stroke-dasharray: 4 3; }
  .minichart figcaption { display: flex; justify-content: space-between; gap: 12px; font-size: 11px; color: #5d6360; }
  .minichart i { display: inline-block; width: 12px; height: 3px; margin: 0 4px 2px 0; vertical-align: middle; }
  .minichart i.k0 { background: #2f6fde; } .minichart i.k1 { background: #db6b1c; margin-left: 6px; }
  @media print { body { margin: 0; } h2, h3 { break-after: avoid; } table { break-inside: auto; } tr { break-inside: avoid; } }
</style></head><body>
<h1>${esc(t.kind === 'report' ? `SolarLens report${period ? `: ${period}` : ''}` : t.question)}</h1>
<p class="meta">${t.kind === 'report' ? `${esc(t.question)} · ` : ''}Made ${esc(when(t.at ?? Math.floor(Date.now() / 1000)))}. Every figure worked out by SolarLens${t.worded === 'model' ? `; the words by ${esc(t.model || 'the model')}` : ''}.${fresh?.newest ? ` Data up to ${esc(when(fresh.newest))}.` : ''}</p>
<div class="words">${paragraphs(t.answer)}</div>
${results.map((r) => `${part(r, 2)}${(r.sections ?? []).map((s) => part(s, 3)).join('')}`).join('')}
</body></html>`;
  }

  function downloadAnswer(i) {
    const t = state.chat[i];
    if (!t || t.error) return;
    const blob = new Blob([reportHtml(t)], { type: 'text/html' });
    const a = document.createElement('a');
    const period = (t.results?.[0]?.period?.label ?? '').replace(/[^\w -]+/g, '').trim();
    a.href = URL.createObjectURL(blob);
    a.download = `SolarLens ${t.kind === 'report' ? 'report' : 'answer'}${period ? ` - ${period}` : ''}.html`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  /** A system's weekly performance ratio as a small line, oldest week first. */
  function ratioSpark(values, colour) {
    const pts = values.map((v, i) => [i, v]).filter(([, v]) => v != null);
    if (pts.length < 2) return '';
    const W = 160, H = 36, P = 3;
    const lo = Math.min(...pts.map(([, v]) => v)), hi = Math.max(...pts.map(([, v]) => v));
    const span = Math.max(0.05, hi - lo);
    const x = (i) => P + (i / (values.length - 1)) * (W - 2 * P);
    const y = (v) => H - P - ((v - lo) / span) * (H - 2 * P);
    const d = pts.map(([i, v], k) => `${k ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    return `<svg class="ratiospark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${d}" fill="none" stroke="${colour}" stroke-width="2" stroke-linejoin="round"/></svg>`;
  }

  function renderAsk() {
    loadAskContext();
    state.chat ??= savedChat();
    const st = state.askStatus;
    const agents = state.agents;
    const invs = state.latest?.inverters ?? [];
    const left = st ? Math.max(0, st.limit - st.used) : null;
    const where = st?.provider === 'openai-compatible' ? st.model : `${st?.model} on Cloudflare`;
    const note = !st ? ''
      : !st.available ? 'No model is set up here: SolarLens reads each question itself, and answers from the figures.'
        : !st.can_ask ? "Answered in SolarLens's own words, from the figures. Sign in for the model's."
          : left === 0 ? "Today's model calls are used up: until midnight UTC, SolarLens reads each question itself."
            : `Worded by ${where}; SolarLens works out every figure. ${left} of ${st.limit} model calls left today.`;

    const health = (agents?.health ?? []).map((h) => {
      const inv = invs.find((i) => i.id === h.system);
      const verdict = h.data?.verdict ?? (h.flagged ? 'declining' : 'steady');
      const cls = verdict === 'declining' ? 'warn' : verdict === 'not enough data' ? '' : 'ok';
      return `<li class="healthrow" style="--accent:${inv ? colorOf(inv) : 'var(--muted)'};--accent-ink:${inv ? inkOf(inv) : 'var(--muted)'}">
        <span class="sysname">${esc(h.name)}</span><span class="pill ${cls}"><i></i>${esc(verdict)}</span>
        ${ratioSpark(h.data?.weekly ?? [], inv ? colorOf(inv) : 'var(--muted)')}
        <span class="healthtext">${esc(h.body)}</span></li>`;
    }).join('');

    const log = state.chat.map((t, i) => `<div class="msg me"><p>${esc(t.question)}</p></div>${botMessage(t, i)}`).join('');
    $('view').innerHTML = `<div class="stack askpage">
      <section class="card"><h2>Ask SolarLens</h2><div class="body">
        <div class="chatlog" aria-live="polite">${log || `<p class="cardnote">Ask about your energy, your systems, a day or any period - statistics, a report - or how to do something in SolarLens. Follow-ups work too: "and the month before?"</p>`}
          ${state.asking ? `<div class="msg me"><p>${esc(state.asking)}</p></div><div class="msg bot"><p class="said faint">Working it out…</p></div>` : ''}</div>
        <form class="askform" id="askform">
          <label for="askq" class="vh">Your message</label>
          <input id="askq" maxlength="500" autocomplete="off" placeholder="${state.chat.length ? 'Ask a follow-up…' : 'How much did I export last week?'}" ${state.asking ? 'disabled' : ''}>
          <button type="submit" class="authbtn" ${state.asking ? 'disabled' : ''}>Ask</button>
          ${state.chat.length ? '<button type="button" class="rangebtn" id="chatnew">New conversation</button>' : ''}
        </form>
        ${state.chat.length ? '' : `<div class="askchips" role="group" aria-label="Examples">${ASK_EXAMPLES.map((q) => `<button type="button" class="filterbtn" data-ask="${esc(q)}">${esc(q)}</button>`).join('')}</div>`}
        ${note ? `<p class="cardnote">${esc(note)}</p>` : ''}
      </div></section>
      <section class="card"><h2>This week's report</h2><div class="body">
        ${agents?.weekly ? `<p class="asked">${esc(agents.weekly.title)}</p><p class="said">${esc(agents.weekly.body)}</p>
          <p class="by">${agents.weekly.worded === 'model' ? 'Written by the model from the week\'s figures.' : 'Written by SolarLens from the week\'s figures.'} Every Monday morning.</p>`
          : '<p class="cardnote">The first report is written on Monday morning.</p>'}
      </div></section>
      <section class="card"><h2>Health</h2><div class="body">
        <p class="cardnote">Each week, each system's output is set against the sunlight on its panels. A fall of 8% or more over a few weeks - dirt, shade, a failing panel or a string down - is flagged, and told like any other alert.</p>
        ${health ? `<ul class="healthlist">${health}</ul>` : '<p class="cardnote">The first check runs on Monday morning.</p>'}
      </div></section>
    </div>`;
    $('askform').onsubmit = (ev) => {
      ev.preventDefault();
      const q = $('askq').value.trim();
      if (q.length >= 2 && !state.asking) sendChat(q);
    };
    for (const b of document.querySelectorAll('[data-ask]')) b.onclick = () => sendChat(b.dataset.ask);
    for (const b of document.querySelectorAll('[data-download]')) b.onclick = () => downloadAnswer(Number(b.dataset.download));
    if ($('chatnew')) $('chatnew').onclick = () => { state.chat = []; saveChat(); renderAsk(); };
    // A "Why?" from Historical Data, waiting for this tab to open.
    if (state.askPending) {
      const p = state.askPending;
      state.askPending = null;
      sendChat(`Why was ${p.args.date} low${p.args.system ? ` for ${p.args.system}` : ''}?`, p);
    }
  }

  // ---------- devices ----------
  /**
   * Each device's link over the last week, from /api/devices/history.
   *
   * Fetched only when a view that draws it opens, and at most every five
   * minutes: the rows only move when a logger changes state, and the Devices
   * tab is not somewhere anyone sits for long. The view is drawn once without
   * it and again when it lands, rather than waiting for it.
   */
  const DEVICE_HISTORY_STALE_MS = 5 * 60 * 1000;
  async function loadDeviceHistory() {
    const h = state.deviceHistory;
    if (h && (h.loading || Date.now() - h.at < DEVICE_HISTORY_STALE_MS)) return;
    state.deviceHistory = { loading: true, at: Date.now() };
    try {
      state.deviceHistory = { ...(await api('/api/devices/history?days=7')), at: Date.now() };
    } catch (e) {
      state.deviceHistory = { error: e.message, at: Date.now() };
    }
    if (location.hash === '#/devices') renderDevices();
  }

  /**
   * How long a device can stay silent before its state is no longer known.
   * A device's history gains a row at least hourly while it is being heard from
   * (see recordDeviceSample in src/db.ts), so past an hour and a quarter
   * without one, nobody was listening - the relay off, the poll failing - and
   * the strip says "not heard from" rather than carrying the last state on.
   */
  const LINK_QUIET_S = 3600 + 900;

  /**
   * One device's week as spans of one state each: 'on', 'off', 'alarm',
   * 'unknown' (heard from, status not given) and 'none' (not heard from).
   * Each row's state holds until the next row, or until the quiet limit runs
   * out, whichever comes first.
   */
  function linkSpans(deviceId, hist) {
    const rows = (hist.samples || []).filter((r) => r.device_id === deviceId);
    const from = hist.from, to = hist.now;
    const kind = (st) => (st === 'online' ? 'on' : st === 'offline' ? 'off' : st === 'alarm' ? 'alarm' : 'unknown');
    const spans = [];
    const push = (a, b, k) => {
      if (b <= a) return;
      const last = spans[spans.length - 1];
      if (last && last.k === k && last.b === a) last.b = b; else spans.push({ a, b, k });
    };
    if (!rows.length || rows[0].ts > from) push(from, rows.length ? rows[0].ts : to, 'none');
    rows.forEach((r, i) => {
      const a = Math.max(from, r.ts);
      const end = i + 1 < rows.length ? rows[i + 1].ts : to;
      const heard = Math.min(end, Math.max(a, r.ts + LINK_QUIET_S));
      push(a, heard, kind(r.status));
      push(heard, end, 'none');
    });
    return spans;
  }

  /** "under a minute", "40 min", "2 h 5 min", "3 d 4 h", for a length in seconds. */
  function spanText(sec) {
    const s = Math.max(0, Math.round(sec));
    if (s < 60) return 'under a minute';
    if (s < 3600) return `${Math.round(s / 60)} min`;
    if (s < 86400) return `${Math.floor(s / 3600)} h ${Math.round((s % 3600) / 60)} min`;
    return `${Math.floor(s / 86400)} d ${Math.round((s % 86400) / 3600)} h`;
  }

  /** The week in one line: share of time online, how often and how long it dropped, and silence. */
  function linkSummary(spans, total) {
    const sum = (k) => spans.filter((x) => x.k === k).reduce((a, x) => a + (x.b - x.a), 0);
    const off = spans.filter((x) => x.k === 'off');
    const parts = [`online ${Math.round((sum('on') / total) * 100)}% of the time`];
    if (off.length) {
      const longest = Math.max(...off.map((x) => x.b - x.a));
      parts.push(`offline ${off.length === 1 ? 'once' : `${off.length} times`}, longest ${spanText(longest)}`);
    } else parts.push('never reported offline');
    const none = sum('none');
    if (none > 0) parts.push(`not heard from for ${spanText(none)}`);
    return parts.join(' · ');
  }

  /**
   * The signal across the week: dBm for SolisCloud, on a fixed -100 to -40
   * scale, and SolarMan's percentage on 0 to 100. Fixed rather than fitted,
   * for the reason the charge chart gives: a signal that moved three dBm,
   * drawn edge to edge, looks like one that collapsed. A silence longer than
   * the quiet limit breaks the line.
   */
  function signalChart(deviceId, hist, isDbm) {
    const key = isDbm ? 'signal_dbm' : 'signal_pct';
    const pts = (hist.samples || []).filter((r) => r.device_id === deviceId && r[key] != null);
    if (pts.length < 2) return '';
    const [lo, hi, unit] = isDbm ? [-100, -40, ' dBm'] : [0, 100, '%'];
    const W = 420, H = 96, L = 54, R = 8, T = 6, B = 18;
    const from = hist.from, to = hist.now;
    const x = (t) => L + ((Math.max(from, t) - from) / (to - from)) * (W - L - R);
    const y = (v) => T + (1 - (Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo)) * (H - T - B);
    let out = '';
    for (const v of [lo, (lo + hi) / 2, hi]) {
      out += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/>`;
      out += `<text class="axis" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}${unit}</text>`;
    }
    out += `<text class="axis" x="${L}" y="${H - 3}">7 days ago</text><text class="axis" x="${W - R}" y="${H - 3}" text-anchor="end">now</text>`;
    // Each value holds until the next row, so the line steps rather than
    // slanting between two readings an hour apart.
    let d = '';
    pts.forEach((p, i) => {
      const gap = i > 0 && p.ts - pts[i - 1].ts > LINK_QUIET_S;
      if (i > 0 && !gap) d += `L${x(p.ts).toFixed(1)},${y(pts[i - 1][key]).toFixed(1)}`;
      d += `${i === 0 || gap ? 'M' : 'L'}${x(p.ts).toFixed(1)},${y(p[key]).toFixed(1)}`;
    });
    const last = pts[pts.length - 1];
    if (to - last.ts <= LINK_QUIET_S) d += `L${x(to).toFixed(1)},${y(last[key]).toFixed(1)}`;
    out += `<path d="${d}" fill="none" stroke="var(--solarman)" stroke-width="2" stroke-linejoin="round"/>`;
    const vals = pts.map((p) => p[key]);
    return `<div class="lh-head"><span class="t">Signal</span><span class="p">weakest ${Math.min(...vals)}${unit} · strongest ${Math.max(...vals)}${unit}</span></div>
      <svg class="sig-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Signal strength over the last seven days">${out}</svg>`;
  }

  /** The week's strip, its key, its summary and the signal line, for one device. */
  function linkHistory(d) {
    const hist = state.deviceHistory;
    if (!hist || hist.loading) return '<div class="linkhist"><div class="lh-head"><span class="p">Loading the last seven days…</span></div></div>';
    if (hist.error || !hist.from) return '<div class="linkhist"><div class="lh-head"><span class="p">The link history could not be loaded.</span></div></div>';
    const total = hist.now - hist.from;
    const spans = linkSpans(d.id, hist);
    const label = { on: 'online', off: 'offline', alarm: 'in alarm', unknown: 'status not given', none: 'not heard from' };
    const bar = spans.map((x) => `<i class="${x.k}" style="width:${(((x.b - x.a) / total) * 100).toFixed(3)}%" title="${esc(label[x.k])}: ${esc(when(x.a))} to ${esc(when(x.b))}"></i>`).join('');
    const summary = linkSummary(spans, total);
    return `<div class="linkhist">
      <div class="lh-head"><span class="t">Last 7 days</span><span class="p">${esc(summary)}</span></div>
      <div class="lstrip" role="img" aria-label="Link over the last seven days: ${esc(summary)}">${bar}</div>
      <div class="lh-axis"><span>7 days ago</span><span>now</span></div>
      <div class="lh-key"><span><i class="on"></i>online</span><span><i class="off"></i>offline</span><span><i class="none"></i>not heard from</span></div>
      ${signalChart(d.id, hist, d.signal_dbm != null)}
    </div>`;
  }

  /**
   * One datalogger, as fully as its vendor describes it. The part of a system
   * that fails quietly: the inverter keeps producing while the logger stops
   * talking, so everything it says about its own link is here, with its week.
   */
  function loggerCard(d) {
    const lg = parse(d.logger) || {};
    const owner = (state.latest?.inverters ?? []).find(
      (i) => i.provider === d.provider && (!d.plant_id || d.plant_id === plantIdOf(i)));
    const cls = d.status === 'online' ? 'ok' : d.status === 'alarm' ? 'bad' : 'warn';
    const rows = [
      ['Status', `<span class="pill ${cls}"><i></i>${esc(d.status ?? 'unknown')}</span>`],
      lg.link ? ['Connects by', esc(lg.link)] : null,
      ['Signal', esc(signalLabel(d))],
      lg.signalLevel != null ? ['Signal bars', esc(String(lg.signalLevel))] : null,
      d.upload_cycle_s ? ['Uploads every', esc(spanText(d.upload_cycle_s))] : null,
      ['Last contact', esc(d.last_seen ? `${when(d.last_seen)} · ${ago(d.last_seen)}` : '—')],
      lg.uptimeS != null ? ['Running since restart', esc(spanText(lg.uptimeS))] : null,
      lg.workingS != null ? ['Working in total', esc(spanText(lg.workingS))] : null,
      d.model ? ['Model', esc(d.model)] : null,
      d.firmware ? ['Firmware', esc(d.firmware), true] : null,
      d.sn ? ['Serial', esc(d.sn), true] : null,
      lg.manufacturedAt ? ['Made', esc(fmtDate(lg.manufacturedAt))] : null,
      d.commissioned_at ? ['First connected', esc(fmtDate(d.commissioned_at))] : null,
      d.warranty_until ? ['Warranty to', esc(fmtDate(d.warranty_until))] : null,
    ].filter(Boolean);
    const body = rows.map(([k, v, mono]) => `<dt>${esc(k)}</dt><dd class="${mono ? 'mono' : ''}">${v}</dd>`).join('');
    return `<section class="card logger"><h3>Datalogger · ${esc(owner?.name ?? providerName(d.provider))}</h3><div class="body">
      <dl class="kv">${body}</dl>${linkHistory(d)}</div></section>`;
  }

  function renderDevices() {
    if (!state.devices.length) {
      $('view').innerHTML = `<div class="card"><div class="empty">No hardware recorded yet. The relay agent fills this in — run <code>npm run relay:solis</code>.</div></div>`;
      return;
    }
    const row = (d) => {
      const cls = d.status === 'online' ? 'ok' : d.status === 'alarm' ? 'bad' : 'warn';
      const strings = parse(d.strings);
      const owner = (state.latest?.inverters ?? []).find(
        (i) => i.provider === d.provider && (!d.plant_id || d.plant_id === plantIdOf(i)));
      const offline = d.status === 'offline' || !!owner?.offline;
      return `<tr>
        <td><span class="pill ${cls}"><i></i>${esc(d.status ?? 'unknown')}</span></td>
        <td><div class="dev-name">${esc(d.name || d.kind)}</div>
            <div class="dev-meta">${esc(providerName(d.provider))} · ${esc(d.kind)}</div></td>
        <td class="mono">${esc(d.sn ?? '—')}</td>
        <td>${esc(d.model ?? '—')}</td>
        <td class="mono">${esc(d.firmware ?? '—')}</td>
        <td>${d.kind === 'datalogger' ? esc(signalLabel(d)) : (d.rated_power_w ? fmtWs(d.rated_power_w) : '—')}</td>
        <td>${d.last_seen ? esc(ago(d.last_seen)) : '—'}</td>
        <td>${esc(stringsLabel(strings, offline) ?? (d.kind === 'inverter' ? 'none' : '—'))}</td>
        <td>${d.temp_c != null ? `${d.temp_c} °C` : '—'}</td>
      </tr>`;
    };
    loadDeviceHistory();
    const loggers = state.devices.filter((d) => d.kind === 'datalogger');
    const loggerCards = loggers.length ? `<div class="loggers">${loggers.map(loggerCard).join('')}</div>` : '';
    $('view').innerHTML = `${loggerCards}<section class="card"><h2>Hardware</h2><div class="tablewrap" tabindex="0" role="region" aria-label="Table, scrolls sideways">
      <table class="devices">
        <thead><tr><th>Status</th><th>Device</th><th>Serial</th><th>Model</th><th>Firmware</th>
          <th>Rated / signal</th><th>Last contact</th><th>PV strings</th><th>Temp</th></tr></thead>
        <tbody>${state.devices.map(row).join('')}</tbody>
      </table></div></section>${relaysCard()}`;
  }

  /** The SolisCloud relays, each with its login's expiry. Empty when no relay has reported. */
  function relaysCard() {
    const relays = state.health?.relays ?? [];
    if (!relays.length) return '';
    const now = Math.floor(Date.now() / 1000);
    const rows = relays.map((r) => {
      const l = relayLogin(r, now);
      const [cls, text] = l.expired ? ['bad', 'login expired']
        : r.state === 'error' ? ['warn', 'failing']
        : l.soon ? ['warn', 'renew soon']
        : now - r.last_seen > RELAY_QUIET_S ? ['', 'not reporting']
        : ['ok', 'working'];
      const login = l.expired ? 'expired'
        : r.login_expires_at ? `until ${when(r.login_expires_at)} · ${untilText(l.left)}`
        : 'not reported';
      return `<tr>
        <td><span class="pill ${cls}"><i></i>${esc(text)}</span></td>
        <td><div class="dev-name">${esc(r.name)}</div></td>
        <td>${esc(login)}</td>
        <td>${esc(ago(r.last_seen))}</td>
      </tr>`;
    }).join('');
    return `<section class="card relays"><h2>SolisCloud relays</h2><div class="tablewrap" tabindex="0" role="region" aria-label="Table, scrolls sideways">
      <table class="devices">
        <thead><tr><th>Status</th><th>Relay</th><th>SolisCloud login</th><th>Last report</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
      <p class="cardnote" style="margin:12px 20px 18px">A SolisCloud login lasts seven days and cannot renew itself. ${esc(RENEW_HOW)}</p>
    </section>`;
  }

  /**
   * How much the battery holds now, estimated from ordinary days, and whether
   * that is falling.
   *
   * Neither vendor reports a hybrid's state of health, but a day says it: the
   * energy that went in, over how far the charge rose. A day that took the
   * battery from 40% to 100% on 6 kWh says it holds about 10 kWh. Only days
   * with a swing of 30 points or more are read - a small swing divides by too
   * little to trust - and the median of the newest week of them is the
   * estimate, set against the pack's nameplate and against the oldest week in
   * view. It is rough: energy that went in and straight back out on the same
   * day inflates it, which is why only the trend is worth reading.
   */
  function batteryHealth(inv, rows) {
    const est = rows
      .filter((r) => r.batt_charge_kwh != null && r.soc_min != null && r.soc_max != null && r.soc_max - r.soc_min >= 30)
      .map((r) => ({ day: r.day, kwh: r.batt_charge_kwh / ((r.soc_max - r.soc_min) / 100) }));
    if (est.length < 3) return '';
    const median = (xs) => { const v = [...xs].sort((a, b) => a - b); const m = Math.floor(v.length / 2); return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2; };
    const now = median(est.slice(0, 7).map((e) => e.kwh));
    const then = est.length >= 14 ? median(est.slice(-7).map((e) => e.kwh)) : null;
    const pack = parse(devicesFor(inv).find((d) => d.battery)?.battery);
    const rated = pack?.ratedCapacityAh && pack?.nominalVoltageV ? (pack.ratedCapacityAh * pack.nominalVoltageV) / 1000 : null;
    return kvCard('Battery, usable capacity', [
      ['Estimated now', `${now.toFixed(1)} kWh`],
      rated ? ['Against the nameplate', `${Math.round((now / rated) * 100)}% of ${rated.toFixed(1)} kWh`] : null,
      then != null ? [`The oldest days in view (${esc(est[est.length - 1].day)})`, `${then.toFixed(1)} kWh`] : null,
      ['Read from', `${est.length} day${est.length === 1 ? '' : 's'} with a swing of 30 points or more`],
    ], 'Energy charged over how far the charge rose, day by day. Rough: a day that charged and discharged at once reads high. The trend is the part to watch.');
  }

  // ---------- system detail ----------
  function kvCard(title, rows, note) {
    const body = rows.filter(Boolean).map(([k, v, mono]) => `<dt>${esc(k)}</dt><dd class="${mono ? 'mono' : ''}">${v}</dd>`).join('');
    if (!body) return '';
    return `<section class="card"><h3>${esc(title)}</h3><div class="body"><dl class="kv">${body}</dl>` +
      `${note ? `<p class="cardnote">${esc(note)}</p>` : ''}</div></section>`;
  }

  /**
   * The battery's charge across the plant's day, 0 to 100 %.
   *
   * Every sample's state of charge was already stored and served by
   * /api/series; only the live figure was ever drawn, so "did it run flat
   * overnight?" meant opening the vendor app. The axis is fixed at 0-100
   * rather than fitted to the data, because a pack that moved from 94 to 100
   * drawn edge to edge looks like one that went flat and back.
   *
   * A gap of more than half an hour breaks the line instead of joining across
   * it. A straight segment over an outage is a claim about hours nobody
   * measured - the same rule the power curve keeps.
   */
  function socChart(inv, pts, accent) {
    const soc = pts.filter((p) => p.battery_soc != null);
    if (soc.length < 2) return '';
    // Drawn at roughly the width of the card it sits in, so the axis text
    // renders near its real size. The shared chart class assumes a full-width
    // panel: a 1000-unit drawing squeezed into a 300px card set its labels at
    // about five pixels, under a band of empty space the fixed height left.
    const W = 360, H = 130, L = 36, R = 8, T = 8, B = 22;
    const [t0, t1] = dayWindow(inv, soc);
    const x = (t) => L + ((t - t0) / (t1 - t0)) * (W - L - R);
    const y = (v) => T + (1 - Math.max(0, Math.min(100, v)) / 100) * (H - T - B);
    let out = '';
    for (const v of [0, 50, 100]) {
      out += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" vector-effect="non-scaling-stroke"/>`;
      out += `<text class="axis" x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v}%</text>`;
    }
    for (let h = 0; h <= 24; h += 6) {
      out += `<text class="axis" x="${x(t0 + h * 3600)}" y="${H - 6}" text-anchor="${h === 0 ? 'start' : h === 24 ? 'end' : 'middle'}">${String(h).padStart(2, '0')}:00</text>`;
    }
    let d = '';
    soc.forEach((p, i) => {
      const gap = i > 0 && p.ts - soc[i - 1].ts > 1800;
      d += `${i === 0 || gap ? 'M' : 'L'}${x(p.ts).toFixed(1)},${y(p.battery_soc).toFixed(1)}`;
    });
    out += `<path d="${d}" fill="none" stroke="${accent}" stroke-width="2.2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
    const lo = soc.reduce((a, p) => (p.battery_soc < a.battery_soc ? p : a));
    const hi = soc.reduce((a, p) => (p.battery_soc > a.battery_soc ? p : a));
    return `<div class="soc">
      <div class="ovchart-head"><span class="t">Charge today</span>
        <span class="p">low ${Math.round(lo.battery_soc)}% at ${esc(hhmm(lo.ts, lo.tz_offset_sec ?? inv.tz_offset_sec))} · high ${Math.round(hi.battery_soc)}%</span></div>
      <svg class="soc-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Battery charge through today">${out}</svg>
    </div>`;
  }

  /**
   * Today against the weather: how much sun has fallen, what the system should
   * have made of it, and what it did. The ratio is what it makes of a unit of
   * sun per kWp, learned from its own recent sunny days.
   */
  function weatherCard(inv) {
    const e = expectedFor(inv);
    if (!e) return '';
    const share = e.expected_kwh > 0 && inv.today_kwh != null ? Math.round((inv.today_kwh / e.expected_kwh) * 100) : null;
    return kvCard('Against the weather', [
      ['Sunlight so far today', `${e.sun_kwh_m2.toFixed(2)} kWh/m²`],
      ['Expected from it', fmtKwh(e.expected_kwh)],
      ['Made', fmtKwh(inv.today_kwh)],
      share != null ? ['Share of expected', `${share}%`] : null,
      ['Performance ratio', `${e.ratio.toFixed(2)} · ${e.learned ? `learned from ${e.days} sunny days` : 'a typical one, until it has learned this system'}`],
    ], 'Sunlight measured by Open-Meteo at the system\'s position. On the Overview and the Power tab, the dashed line on its day curve is the expected output, hour by hour.');
  }

  // ---------- money and carbon ----------
  /**
   * What the sun has been worth, from the tariff the owner set in Settings
   * (GET /api/settings/tariff, kept in state.tariff).
   *
   * A kWh made and used at home saves one bought, at the import price. A kWh
   * sent to the grid earns the export price - or, with net metering, cancels
   * one bought and is worth the import price as well. Every kWh made avoids
   * the CO2 the grid would have put out for it. No tariff, no money: until the
   * owner fills it in, every figure below is left out rather than guessed.
   *
   * `assumed` marks a figure worked out without knowing the export: the
   * vendors give month and year production but not always what was sold, and
   * such a period counts every kWh at the import price - an upper bound, and
   * said so wherever it is shown. With net metering, or both prices equal, it
   * makes no difference and is not flagged.
   */
  function valueOf(madeKwh, exportKwh, t = state.tariff) {
    if (!t || madeKwh == null || !Number.isFinite(madeKwh)) return null;
    const made = Math.max(0, madeKwh);
    const known = exportKwh != null && Number.isFinite(exportKwh);
    const sold = t.netMetering || !known ? 0 : Math.min(made, Math.max(0, exportKwh));
    return {
      money: (made - sold) * t.importPrice + sold * t.exportPrice,
      co2: made * t.co2KgPerKwh,
      assumed: !known && !t.netMetering && t.exportPrice !== t.importPrice,
    };
  }

  /** Money in the owner's currency, in the reader's own number format. */
  function fmtMoney(v, t = state.tariff) {
    if (v == null || !t) return '—';
    try {
      return new Intl.NumberFormat(undefined, { style: 'currency', currency: t.currency, maximumFractionDigits: Math.abs(v) >= 100 ? 0 : 2 }).format(v);
    } catch {
      return `${v.toFixed(Math.abs(v) >= 100 ? 0 : 2)} ${t.currency}`;
    }
  }

  /** Kilograms of CO2, in tonnes past one. */
  const fmtCo2 = (kg) => kg == null ? '—' : kg >= 1000 ? `${(kg / 1000).toFixed(kg >= 10000 ? 1 : 2)} t CO₂` : `${kg.toFixed(kg >= 100 ? 0 : 1)} kg CO₂`;

  /** The prices in words, for the note under a money figure. */
  function tariffLine(t = state.tariff) {
    if (!t) return '';
    return `At ${fmtMoney(t.importPrice, t)} for a kWh bought and ${t.netMetering ? 'the same for one exported (net metering)' : `${fmtMoney(t.exportPrice, t)} for one sold`}; ${t.co2KgPerKwh} kg of CO₂ for each kWh the grid supplies.`;
  }

  /**
   * A system's page: what it has saved today, this month, this year and in
   * its lifetime, from the vendor's own running totals. Today's export is
   * known wherever the vendor reports it; the longer periods mostly are not.
   */
  function moneyCard(inv) {
    if (!state.tariff) return '';
    const m = parse(inv.metrics) ?? {};
    const periods = [
      ['Today', inv.today_kwh, m.gridExportTodayKwh],
      ['This month', m.genMonthKwh, m.gridExportMonthKwh],
      ['This year', m.genYearKwh, m.gridExportYearKwh],
      ['Lifetime', inv.total_kwh, m.gridExportTotalKwh],
    ].map(([k, made, sold]) => [k, valueOf(made, sold)]).filter(([, v]) => v);
    if (!periods.length) return '';
    const guessed = periods.some(([, v]) => v.assumed);
    return kvCard('Money and carbon', periods.map(([k, v]) =>
      [k, `<strong>${esc(fmtMoney(v.money))}</strong>${v.assumed ? '<sup title="Export not known: every kWh counted at the price of one bought">*</sup>' : ''} · <span class="faint">${esc(fmtCo2(v.co2))} avoided</span>`]),
      `${tariffLine()}${guessed ? ' * The vendor gives no export figure for the periods marked, so they count every kWh as used at home: an upper bound.' : ''} The owner sets these prices under Settings.`);
  }

  /**
   * A plant with more than one inverter: the first one's cards are above, as
   * for any system; each further one gets its own identity, strings and AC
   * output here, so a second inverter's fault is not hidden behind the first.
   */
  function moreInverters(devs, accent, offline) {
    const inverters = devs.filter((d) => d.kind === 'inverter');
    if (inverters.length < 2) return '';
    return inverters.slice(1).map((d, i) => `<h3 class="subhead">Inverter ${i + 2} of ${inverters.length}</h3>
      <div class="blocks">${kvCard('Identity & hardware', [
        ['Status', `<span class="pill ${d.status === 'online' ? 'ok' : d.status === 'alarm' ? 'bad' : 'warn'}"><i></i>${esc(d.status ?? 'unknown')}</span>`],
        d.model ? ['Model', esc(d.model)] : null,
        d.sn ? ['Serial', esc(d.sn), true] : null,
        d.firmware ? ['Firmware', esc(d.firmware), true] : null,
        d.rated_power_w ? ['Rated', fmtWs(d.rated_power_w)] : null,
        d.temp_c != null ? ['Temperature', `${d.temp_c} °C`] : null,
        ['Last contact', esc(d.last_seen ? ago(d.last_seen) : '—')],
      ])}${stringsCard(d, accent, offline)}${acCard(d)}</div>`).join('');
  }

  /** The PV strings card: each MPPT string's power, voltage and current. */
  function stringsCard(invDev, accent, offline) {
    // strings === null means the vendor reports no per-string registers at all;
    // an empty array means it does, but none are producing (night). Only the
    // second case deserves a card.
    if (!invDev || invDev.strings === null || invDev.strings === undefined) return '';
    const strings = parse(invDev.strings);
    const body = !strings || !strings.length
      ? `<p style="margin:0;color:var(--muted);font-size:13.5px">No string is producing in the latest sample.</p>`
      : (() => {
          const max = Math.max(...strings.map((s) => s.powerW), 1);
          return `<div class="bars">${strings.map((s) => {
            // Offline: an empty socket is still an empty socket, but a connected
            // string's wattage is history, and says so.
            const state = stringState(s) === 'no input' ? 'no input' : offline ? 'offline' : stringState(s);
            const detail = [s.voltageV != null ? `${s.voltageV} V` : null, s.currentA != null ? `${s.currentA} A` : null]
              .filter(Boolean).join(' · ');
            return `<div class="bar-row${state === 'no input' ? ' unused' : ''}">
            <span class="lbl">String ${s.index}</span>
            <span class="bar-track"><span class="bar-fill" style="width:${Math.max(2, (s.powerW / max) * 100).toFixed(1)}%;background:${accent}"></span></span>
            <span class="num">${state ? esc(state) : fmtWs(s.powerW)}</span>
            ${detail ? `<span class="sub2">${esc(detail)}</span>` : ''}
            </div>`;
          }).join('')}</div>
          ${offline && invDev.last_seen
            ? `<p class="cardnote">The inverter is offline. Voltage and current are the last reported, ${esc(ago(invDev.last_seen))}, not a reading from now.</p>`
            : ''}
          ${strings.some((x) => stringState(x) === 'no input')
            ? `<p class="cardnote">An MPPT input reading a fraction of a volt with no current has nothing plugged into it - not a string producing zero.</p>`
            : ''}`;
        })();
    return `<section class="card"><h3>PV strings · MPPT</h3><div class="body">${body}</div></section>`;
  }

  /** The AC output card: each phase's voltage and current, frequency, power factor. */
  function acCard(invDev) {
    if (!invDev) return '';
    const phases = parse(invDev.ac_phases);
    const extras = [
      invDev.frequency_hz != null ? ['Frequency', `${invDev.frequency_hz} Hz`] : null,
      invDev.power_factor != null ? ['Power factor', String(invDev.power_factor)] : null,
      invDev.dc_bus_v != null ? ['DC bus', `${invDev.dc_bus_v} V`] : null,
    ].filter(Boolean);
    if ((!phases || !phases.length) && !extras.length) return '';
    const rows = (phases ?? []).map((p) => `<dt>Phase ${p.index}</dt><dd>${
      [p.voltageV != null ? `${p.voltageV} V` : null, p.currentA != null ? `${p.currentA} A` : null].filter(Boolean).join(' · ') || '—'
    }</dd>`).join('');
    const tail = extras.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('');
    return `<section class="card"><h3>AC output · per phase</h3><div class="body">
      <dl class="kv">${rows}${tail}</dl></div></section>`;
  }

  /**
   * Every measurement the vendor sent, as a filterable table, for questions the
   * page does not answer. Read from `telemetry`, the copy of the payload the
   * Worker cleans for publishing (src/public-view.ts, safeTelemetry): numbers,
   * units and status words, with every id, serial, name and place left out.
   */
  function rawCard(inv) {
    const raw = parse(inv.telemetry);
    if (!raw || typeof raw !== 'object') return '';
    const entries = Object.entries(raw).filter(([, v]) => v === null || typeof v !== 'object');
    if (!entries.length) return '';
    const rows = entries.map(([k, v]) => {
      const key = esc(k.toLowerCase());
      return `<div class="rk" data-k="${key}">${esc(k)}</div><div class="rv" data-k="${key}">${esc(v === null ? 'null' : String(v))}</div>`;
    });
    return `<details class="raw card"><summary>Raw telemetry · ${entries.length} fields from ${esc(inv.source ?? inv.provider)}</summary>
      <div class="body">
        <input type="search" class="rawfilter" placeholder="Filter fields…" aria-label="Filter raw telemetry fields">
        <div class="rawgrid">${rows.join('')}</div>
      </div></details>`;
  }

  /**
   * Every card that describes one system, in reading order. Shared verbatim by
   * the system view and the Power page so the two can never drift apart.
   */
  /**
   * An MPPT input with no array on it still appears in the register set,
   * reporting a fraction of a volt and no current. That is not a string
   * producing zero watts at night - it is a socket with nothing in it, and
   * saying so answers "why does string 2 have no value?" once instead of
   * every time someone looks.
   */
  const stringState = (st) =>
    (st.voltageV ?? 0) < 10 && !(st.currentA > 0) && !(st.powerW > 0) ? 'no input'
      : (st.powerW ?? 0) > 0 ? null : 'not producing';

  /**
   * How many strings are producing, out of how many are actually connected -
   * the one answer the overview tile, the Devices table and the system page
   * all give, so they cannot disagree again.
   *
   * Two things it refuses to count. An empty MPPT socket is not a string, so
   * it is not in the total: "1 of 2" for one array on a two-input inverter
   * reads as a fault that does not exist. And an offline inverter's strings
   * are not producing, whatever the device record says. That record holds the
   * last readings the inverter sent before it went quiet - at dusk, typically,
   * a few watts on each input - and it is not updated again until the
   * inverter comes back. Read as current, it said "2 producing" about a system
   * the header correctly called offline.
   *
   * Returns the label to print, or null when there is nothing to say.
   */
  const stringsLabel = (strings, offline) => {
    if (!strings || !strings.length) return null;
    const connected = strings.filter((x) => stringState(x) !== 'no input');
    if (!connected.length) return null;
    if (offline) return 'offline';
    const live = connected.filter((x) => (x.powerW ?? 0) > 0).length;
    return live === connected.length ? `${live} producing` : `${live} of ${connected.length}`;
  };

  /**
   * One system in full, as pieces a view assembles: its header, flow diagram,
   * the cards (energy, grid, battery, strings, AC, device) and raw telemetry.
   * Power shows these under each system; a system's own page shows one set.
   */
  function detailBlocks(inv) {
    const m = parse(inv.metrics) ?? {};
    const st = statusOf(inv);
    const devs = devicesFor(inv);
    const invDev = devs.find((d) => d.kind === 'inverter');
    const logger = devs.find((d) => d.kind === 'datalogger');
    const accent = colorOf(inv);
    const [pv, pu] = fmtW(inv.ac_power_w);
    // Temperature is per-device telemetry, so the station snapshot rarely has it.
    const tempC = inv.temp_c ?? invDev?.temp_c ?? null;

    const identity = kvCard('Identity & hardware', [
      ['System', esc(inv.name)],
      inv.plant_name && inv.plant_name !== inv.name ? ['Plant', esc(inv.plant_name)] : null,
      ['Feed', esc(inv.source ?? providerName(inv.provider))],
      invDev?.model ? ['Model', esc(invDev.model)] : null,
      invDev?.sn ? ['Serial', esc(invDev.sn), true] : null,
      invDev?.firmware ? ['Firmware', esc(invDev.firmware), true] : null,
      ['Rated', invDev?.rated_power_w ? fmtWs(invDev.rated_power_w) : (inv.capacity_w ? fmtWs(inv.capacity_w) : '—')],
      invDev?.commissioned_at ? ['Commissioned', esc(fmtDate(invDev.commissioned_at))] : null,
      invDev?.warranty_until ? ['Warranty to', esc(fmtDate(invDev.warranty_until))] : null,
    ]);

    const link = logger ? kvCard('Datalogger & link', [
      ['Status', `<span class="pill ${logger.status === 'online' ? 'ok' : 'warn'}"><i></i>${esc(logger.status ?? 'unknown')}</span>`],
      logger.sn ? ['Serial', esc(logger.sn), true] : null,
      logger.model ? ['Model', esc(logger.model)] : null,
      logger.firmware ? ['Firmware', esc(logger.firmware), true] : null,
      parse(logger.logger)?.link ? ['Connects by', esc(parse(logger.logger).link)] : null,
      ['Signal', esc(signalLabel(logger))],
      logger.upload_cycle_s ? ['Uploads every', `${logger.upload_cycle_s}s`] : null,
      ['Last contact', esc(logger.last_seen ? ago(logger.last_seen) : '—')],
      parse(logger.logger)?.uptimeS != null ? ['Running since restart', esc(spanText(parse(logger.logger).uptimeS))] : null,
    ], 'Its week online and its signal are on the Devices tab.') : '';

    const live = kvCard('Live power', [
      ['AC output', fmtWs(inv.ac_power_w)],
      inv.dc_power_w != null ? ['DC input', fmtWs(inv.dc_power_w)] : null,
      ['House load', fmtWs(inv.load_power_w)],
      ['Grid', inv.grid_power_w == null ? '—' : (inv.grid_power_w >= 0 ? `↓ ${fmtWs(inv.grid_power_w)} import` : `↑ ${fmtWs(-inv.grid_power_w)} export`)],
      ['Updated', inv.ts ? `${esc(when(inv.ts))} · ${esc(ago(inv.ts))}` : 'never'],
    ]);

    const counters = kvCard('Energy counters', [
      ['Produced today', fmtKwh(inv.today_kwh)],
      m.genMonthKwh != null ? ['Produced this month', fmtKwh(m.genMonthKwh)] : null,
      m.genYearKwh != null ? ['Produced this year', fmtKwh(m.genYearKwh)] : null,
      ['Produced, lifetime', fmtKwh(inv.total_kwh)],
      m.loadTodayKwh != null ? ['Consumed today', fmtKwh(m.loadTodayKwh)] : null,
      m.gridImportTodayKwh != null ? ['Imported today', fmtKwh(m.gridImportTodayKwh)] : null,
      m.gridExportTodayKwh != null ? ['Exported today', fmtKwh(m.gridExportTodayKwh)] : null,
      m.gridImportTotalKwh != null ? ['Imported, lifetime', fmtKwh(m.gridImportTotalKwh)] : null,
      m.gridExportTotalKwh != null ? ['Exported, lifetime', fmtKwh(m.gridExportTotalKwh)] : null,
      m.loadTotalKwh != null ? ['Consumed, lifetime', fmtKwh(m.loadTotalKwh)] : null,
      m.selfUseTodayKwh != null ? ['Self-consumed today', fmtKwh(m.selfUseTodayKwh)] : null,
      // Two different questions, and the pair is why both are worth printing:
      // self-sufficiency is how much of the house ran on its own roof, and
      // self-consumption is how much of the roof's output stayed home. A day
      // can be high on one and low on the other.
      share(m.selfUseTodayKwh, m.loadTodayKwh) != null
        ? ['Self-sufficiency today', `${share(m.selfUseTodayKwh, m.loadTodayKwh)} % of the load`] : null,
      share(m.selfUseTodayKwh, inv.today_kwh) != null
        ? ['Self-consumption today', `${share(m.selfUseTodayKwh, inv.today_kwh)} % of what was generated`] : null,
      m.fullLoadHours != null ? ['Full-load hours', `${m.fullLoadHours} h`] : null,
    ],
    // A row that is simply absent invites the question every time. Say once
    // why: an on-grid plant with no CT clamp reports every grid field as zero,
    // and SolisCloud mirrors generation into household load so its own flow
    // diagram has something to draw. None of that is a measurement, so none of
    // it is shown - but the absence deserves a sentence.
    m.genTotalKwh != null && m.gridImportTotalKwh === null && m.gridExportTotalKwh === null
      ? 'Grid import, export and household consumption are missing because this plant has no grid meter — the vendor returns zeros for all of them, and a zero is not a measurement.'
      : undefined);

    const bat = parse(invDev?.battery);
    const cyc = cycles(m, bat);
    const battery = hasBattery(inv, m) ? `<section class="card"><h3>Battery</h3><div class="body">
      <div class="batt" style="margin-top:0;padding-top:0;border-top:none">
        ${ring(inv.battery_soc ?? 0)}
        <div><div class="k">State of charge</div><div class="v">${battText(inv.battery_power_w)}</div></div>
      </div>
      ${socChart(inv, todayOf(inv, (state.series?.points ?? []).filter((p) => p.inverter_id === inv.id)), accent)}
      <dl class="kv" style="margin-top:16px">
        ${m.batteryStatus || bat?.status ? `<dt>Status</dt><dd>${esc(String(m.batteryStatus || bat.status).toLowerCase())}</dd>` : ''}
        ${inv.battery_soc != null ? `<dt>State of charge</dt><dd>${Math.round(inv.battery_soc)} %</dd>` : ''}
        ${inv.battery_power_w != null ? `<dt>Charge / discharge</dt><dd>${battText(inv.battery_power_w)}</dd>` : ''}
        ${bat?.tempC != null ? `<dt>Pack temperature</dt><dd>${bat.tempC} °C</dd>` : ''}
        ${bat?.voltageV != null ? `<dt>Pack voltage</dt><dd>${bat.voltageV} V</dd>` : ''}
        ${bat?.currentA != null ? `<dt>Pack current</dt><dd>${bat.currentA} A</dd>` : ''}
        ${m.battChargeTodayKwh != null ? `<dt>Charged today</dt><dd>${fmtKwh(m.battChargeTodayKwh)}</dd>` : ''}
        ${m.battDischargeTodayKwh != null ? `<dt>Discharged today</dt><dd>${fmtKwh(m.battDischargeTodayKwh)}</dd>` : ''}
        ${m.battChargeTotalKwh != null ? `<dt>Charged, lifetime</dt><dd>${fmtKwh(m.battChargeTotalKwh)}</dd>` : ''}
        ${m.battDischargeTotalKwh != null ? `<dt>Discharged, lifetime</dt><dd>${fmtKwh(m.battDischargeTotalKwh)}</dd>` : ''}
        ${bat?.bmsTempC != null ? `<dt>BMS temperature</dt><dd>${bat.bmsTempC} °C</dd>` : ''}
        ${bat?.bmsVoltageV != null ? `<dt>BMS voltage</dt><dd>${bat.bmsVoltageV} V</dd>` : ''}
        ${bat?.chargeLimitA != null ? `<dt>Charge limit</dt><dd>${bat.chargeLimitA} A</dd>` : ''}
        ${bat?.dischargeLimitA != null ? `<dt>Discharge limit</dt><dd>${bat.dischargeLimitA} A</dd>` : ''}
        ${bat?.bmsSocPct != null ? `<dt>BMS state of charge</dt><dd>${Math.round(bat.bmsSocPct)} %</dd>` : ''}
        ${bat?.bmsChargeVoltageV != null ? `<dt>BMS charge voltage</dt><dd>${bat.bmsChargeVoltageV} V</dd>` : ''}
        ${bat?.bmsDischargeVoltageV != null ? `<dt>BMS discharge voltage</dt><dd>${bat.bmsDischargeVoltageV} V</dd>` : ''}
        ${bat?.chemistry ? `<dt>Chemistry</dt><dd>${esc(bat.chemistry)}</dd>` : ''}
        ${bat?.ratedCapacityAh != null ? `<dt>Rated capacity</dt><dd>${bat.ratedCapacityAh} Ah${bat.nominalVoltageV ? ` @ ${bat.nominalVoltageV} V · ${packKwh(bat).toFixed(2)} kWh` : ''}</dd>` : ''}
        ${cyc != null ? `<dt title="Derived: lifetime energy charged divided by the pack's usable capacity. Neither cloud reports a counter.">Equivalent full cycles</dt><dd>${cyc.toFixed(0)} <span class="derived">derived</span></dd>` : ''}
      </dl></div></section>` : '';

    const diagnostics = kvCard('Status & diagnostics', [
