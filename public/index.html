      if (n.key === 'batt') return `M${CX},${n.y - NR - 12} L${CX},${CY + HR + 14}`;
      const side = n.x < CX ? -1 : 1;
      return `M${n.x - side * (NR + 12)},${CY} H${CX + side * (HR + 14)}`;
    };

    // Marker ids are document-wide, and the overview draws one diagram per
    // system: two <marker id="a-on"> elements in one page mean url(#a-on)
    // resolves to whichever came first, so the second diagram borrows the
    // first one's accent. Each diagram therefore names its own.
    const uid = 'f' + String(inv.id ?? 'x').replace(/[^a-zA-Z0-9]/g, '');
    const onId = `a-on-${uid}`, offId = `a-off-${uid}`;
    let out = `<defs>
      <marker id="${offId}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/></marker>
      <marker id="${onId}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="${accent}"/></marker>
    </defs>`;

    // Wires first, so a node always sits on top of the line entering it.
    for (const n of nodes) {
      const live = flowing(n);
      const d = pathFor(n);
      const rev = !n.into;
      out += `<path class="wire${live ? ' live' : ' dead'}" d="${d}" stroke-width="${gauge(n.value).toFixed(1)}"
        marker-${rev ? 'start' : 'end'}="url(#${live ? onId : offId})"/>`;
      if (live) {
        out += `<circle class="pip" r="${(2.6 + gauge(n.value) * 0.5).toFixed(1)}"><animateMotion dur="2.6s" repeatCount="indefinite"
          keyPoints="${rev ? '1;0' : '0;1'}" keyTimes="0;1" calcMode="linear" path="${d}"/></circle>`;
      }
    }

    for (const n of nodes) {
      const live = flowing(n);
      if (live) out += `<circle class="halo" cx="${n.x}" cy="${n.y}" r="${NR + 9}"/>`;
      out += `<circle class="nodebg${live ? ' live' : ''}" cx="${n.x}" cy="${n.y}" r="${NR}"/>`;
      out += `<text class="glyph${live ? '' : ' dim'}" x="${n.x}" y="${n.y + 10}" text-anchor="middle">${n.glyph}</text>`;

      // Centred underneath, every node the same: nothing to clip against the
      // edge of the box, and nothing to collide with the house.
      const ty = n.y + NR + 34;
      out += `<text class="lbl" x="${n.x}" y="${ty}" text-anchor="middle">${esc(n.label)}</text>`;
      out += `<text class="val${live ? '' : ' idle'}" x="${n.x}" y="${ty + 38}" text-anchor="middle">${n.value == null ? '—' : fmtWs(Math.abs(n.value))}</text>`;
      if (n.sub) out += `<text class="sub" x="${n.x}" y="${ty + 64}" text-anchor="middle">${esc(n.sub)}</text>`;
    }

    // The house is the hub and the load at the same time.
    const load = inv.load_power_w;
    out += `<circle class="house" cx="${CX}" cy="${CY}" r="${HR}"/>`;
    out += `<text class="lbl" x="${CX}" y="${CY - HR - 22}" text-anchor="middle">House load</text>`;
    out += `<text class="glyph big" x="${CX}" y="${CY - 6}" text-anchor="middle">🏡</text>`;
    out += `<text class="val${load ? '' : ' idle'}" x="${CX}" y="${CY + 42}" text-anchor="middle">${load == null ? '—' : fmtWs(load)}</text>`;

    const svg = `<svg class="flow" viewBox="0 0 ${W} ${H}" style="--accent:${accent}" role="img"
      aria-label="Energy flow for ${esc(inv.name)}">${out}</svg>`;

    // How much of what the house used came from the house's own kit rather than
    // the meter. It is the question the diagram is really answering, and it is
    // only honest when both figures are present.
    if (load == null || load <= 0 || g == null) return svg;
    const selfPct = Math.max(0, Math.min(100, ((load - Math.max(0, g)) / load) * 100));
    return `${svg}<div class="flowbar" title="Share of the house's current draw that is coming from solar or the battery rather than the grid">
      <div class="flowbar-t"><span>Self-powered right now</span><b>${Math.round(selfPct)}%</b></div>
      <div class="bar-track"><div class="bar-fill" style="width:${selfPct.toFixed(1)}%;background:${accent}"></div></div>
    </div>`;
  }

  /** One system's own day curve, drawn at chart size rather than sparkline size. */
  /**
   * A day curve with both axes labelled.
   *
   * The height argument is a viewBox height, not a pixel size: the SVG scales
   * to whatever box CSS gives it, and the aspect ratio decides how much of that
   * box it fills. Drawn 1000x230 inside a half-width column, the curve comes
   * out short and floating in empty space, so the overview asks for a taller
   * ratio than the full-width Power tab needs.
   */
  function systemChart(inv, pts, id, viewH = 230, opts = {}) {
    // `bare` moves the reading's name and the day's peak out of the drawing and
    // into HTML above it, where they are set in the page's own type instead of
    // being scaled with the picture.
    const bare = !!(opts && opts.bare);
    const W = 1000, H = viewH, L = 62, R = 16, T = bare ? 12 : 26, B = 30;
    const [t0, t1] = dayWindow(inv, pts);
    const c = colorFor(inv.provider);
    if (pts.length < 2) return `<svg class="combined" viewBox="0 0 ${W} ${H}"><text class="axis" x="${W / 2}" y="${H / 2}" text-anchor="middle">${
      pts.length === 1 ? 'One sample so far today - a curve needs two' : 'No samples yet today'}</text></svg>`;
    const max = Math.max(200, ...pts.map((p) => p.ac_power_w || 0));
    const x = (t) => L + ((t - t0) / (t1 - t0)) * (W - L - R);
    const y = (v) => T + (1 - (v || 0) / max) * (H - T - B);
    const d = pts.map((p, i) => `${i ? 'L' : 'M'}${x(p.ts).toFixed(1)},${y(p.ac_power_w).toFixed(1)}`).join(' ');
    const last = pts[pts.length - 1];
    let out = `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${c}" stop-opacity=".30"/><stop offset="100%" stop-color="${c}" stop-opacity="0"/></linearGradient></defs>`;
    for (let i = 0; i <= 4; i++) {
      const v = (max / 4) * i, yy = y(v);
      out += `<line class="grid" x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" vector-effect="non-scaling-stroke"/>`;
      out += `<text class="axis" x="${L - 8}" y="${yy + 4}" text-anchor="end">${v >= 1000 ? (v / 1000).toFixed(1) + 'k' : Math.round(v)}</text>`;
    }
    // Ticks read off the clock at each one, so a day with a switch inside it is
    // labelled by what the clock there said, not by hours counted from midnight.
    for (let t = t0; t <= t1; t += 3 * 3600) {
      const end = t + 3 * 3600 > t1;
      const label = end ? '24' : String(plantHour(t, offsetNear(pts, t, inv.tz_offset_sec))).padStart(2, '0');
      out += `<text class="axis" x="${x(end ? t1 : t)}" y="${H - 8}" text-anchor="${t === t0 ? 'start' : end ? 'end' : 'middle'}">${label}</text>`;
    }
    out += `<path d="${d} L${x(last.ts).toFixed(1)},${y(0)} L${x(pts[0].ts).toFixed(1)},${y(0)} Z" fill="url(#${id})"/>`;
    out += `<path d="${d}" fill="none" stroke="${c}" stroke-width="2.6" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
    // Mark the day's peak: on a solar curve it is the one number worth reading.
    const peak = pts.reduce((a, p) => ((p.ac_power_w ?? 0) > (a.ac_power_w ?? 0) ? p : a), pts[0]);
    if ((peak.ac_power_w ?? 0) > 0) {
      const px = x(peak.ts), py = y(peak.ac_power_w);
      out += `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="4" fill="${c}"/>`;
      const flip = px > W * 0.75;
      if (!bare) out += `<text class="peaklab" x="${(px + (flip ? -10 : 10)).toFixed(1)}" y="${Math.max(T + 12, py - 10).toFixed(1)}" text-anchor="${flip ? 'end' : 'start'}">peak ${fmtWs(peak.ac_power_w)} · ${esc(hhmm(peak.ts, peak.tz_offset_sec ?? inv.tz_offset_sec))}</text>`;
    }
    out += `<circle cx="${x(last.ts).toFixed(1)}" cy="${y(last.ac_power_w).toFixed(1)}" r="3.5" fill="${c}" opacity=".55"/>`;

    // What makes a curve invisible is not how few points it has but how little
    // of the axis it covers: three samples twenty minutes apart are a smudge,
    // while thirteen spread across the daylight hours draw perfectly well.
    // Mark the samples only in the first case, where dots are the whole shape.
    if (last.ts - pts[0].ts < 3 * 3600 || pts.length <= 6) {
      for (const p of pts) {
        out += `<circle cx="${x(p.ts).toFixed(1)}" cy="${y(p.ac_power_w).toFixed(1)}" r="3" fill="${c}" opacity=".85"/>`;
      }
    }

    // A curve that starts at noon is not a system that produced nothing all
    // morning - it is a record that begins at noon. But a curve that starts at
    // six is just sunrise, and warning about that every morning would be
    // noise. The gap worth naming is missed *daylight*, so this only speaks up
    // when the vendor told us when the sun came up and the record began well
    // after it. No sunrise, no claim.
    const sunUp = sunriseTs(inv, t0);
    if (sunUp !== null && pts[0].ts - sunUp > 3600) {
      out += `<text class="axis gap" x="${W - R}" y="${T - 10}" text-anchor="end">recorded from ${esc(hhmm(pts[0].ts, pts[0].tz_offset_sec ?? inv.tz_offset_sec))}</text>`;
      // Shade the stretch nobody has a reading for, so the empty part of the
      // axis reads as "no data" rather than as a flat zero it really produced.
      out += `<rect class="nodata" x="${L}" y="${T}" width="${(x(pts[0].ts) - L).toFixed(1)}" height="${H - T - B}"/>`;
    }

    if (!bare) out += `<text class="axis unit" x="6" y="${T - 10}">watts</text>`;
    return `<svg class="combined" viewBox="0 0 ${W} ${H}">${out}</svg>`;
  }

  // ---------- power ----------
  /**
   * The Power tab: the shared chart of every system, then each system in full,
   * one collapsible section each (see detailBlocks).
   */
  function renderPower() {
    const invs = state.latest?.inverters ?? [];
    const byInv = {};
    for (const p of state.series?.points ?? []) (byInv[p.inverter_id] ||= []).push(p);
    // Collapsible per system: with two full detail sets on one page, the
    // second is otherwise a long scroll away.
    // One section per system: its day chart, then its detail blocks and raw
    // telemetry, all built by detailBlocks.
    const per = invs.map((inv, i) => {
      const b = detailBlocks(inv);
      const st = statusOf(inv);
      const [v, u] = fmtW(inv.ac_power_w);
      return `<details class="syssec" open>
        <summary>
          <span class="vendor" style="color:${inkFor(inv.provider)}">${esc(providerName(inv.provider))}</span>
          <span class="sname">${esc(inv.name)}</span>
          <span class="snow">${v}<small> ${u}</small></span>
          <span class="pill ${st.cls}"${st.stale && st.lastWord ? ` title="Last word from the vendor: ${esc(st.lastWord)}"` : ''}><i></i>${esc(st.text)}</span>
        </summary>
        <div class="secbody">
          <section class="card"><div class="body">${systemChart(inv, todayOf(inv, byInv[inv.id]), 'pg' + i)}</div></section>
          ${b.blocks}
          ${b.raw}
        </div>
      </details>`;
    }).join('');

    $('view').innerHTML = `<details class="syssec" open>
        <summary><span class="sname">Today · AC output · all systems</span>
          <span class="snote">click a name in the legend to show or hide that line</span></summary>
        <div class="secbody"><section class="card"><div class="body">
          <div class="legend" id="legend"></div>
          <svg class="combined" id="combined" viewBox="0 0 1000 230" preserveAspectRatio="none"></svg>
        </div></section></div>
      </details>${per}`;
    bindLegend($('combined'), byInv, invs);
    bindRawFilters();
  }

  // ---------- overview ----------

  /**
   * Two curves that sit almost on top of each other are two curves you cannot
   * read. The legend is therefore a set of switches: click a name to drop that
   * system out of the picture, and the axis rescales to whatever is left.
   */
  function combinedChart(svg, byInv, invs) {
    const W = 1000, H = 230, L = 46, R = 12, T = 14, B = 26;
    // Systems in different zones do not share a midnight. Opening at the
    // earliest of them keeps the earlier system's morning on the axis instead
    // of clipping it off the left edge.
    const t0 = Math.min(...invs.map((i) => dayWindow(i, todayOf(i, byInv[i.id]))[0]), startOfToday());
    const t1 = Math.max(...invs.map((i) => dayWindow(i, todayOf(i, byInv[i.id]))[1]), t0 + 86400);
    // Every system gets a switch, including one with nothing to draw today -
    // otherwise it silently disappears from the page rather than reading as
    // "this system has no samples". So does the fleet sum, always, or turning
    // everything off would take its own switch away with it.
    const legend = () => {
      const l = invs.map((i) => legendItem(i.id, colorFor(i.provider), i.name,
        todayOf(i, byInv[i.id]).length === 0 ? 'no samples today'
          : todayOf(i, byInv[i.id]).length === 1 ? 'one sample so far' : null));
      if (invs.length > 1) l.push(legendItem(TOTAL_KEY, 'var(--total)', 'Fleet total'));
      return l;
    };

    const shown = invs.filter((i) => !state.hidden.has(i.id));
    const all = shown.flatMap((i) => todayOf(i, byInv[i.id]));
    if (!all.length) {
      svg.innerHTML = `<text class="axis" x="${W / 2}" y="${H / 2}" text-anchor="middle">${
        invs.length && shown.length === 0 ? 'Every system is switched off in the legend' : 'No samples yet today'}</text>`;
      return legend();
    }
    const bucket = 300, totals = new Map();
    for (const [id, pts] of Object.entries(byInv)) if (!state.hidden.has(id)) for (const p of pts) {
      const b = Math.floor(p.ts / bucket) * bucket;
      const mm = totals.get(b) || {}; mm[id] = p.ac_power_w || 0; totals.set(b, mm);
    }
    const totalPts = [...totals.entries()].sort((a, b) => a[0] - b[0])
      .map(([ts, mm]) => ({ ts, ac_power_w: Object.values(mm).reduce((a, v) => a + v, 0) }));
    const max = Math.max(500, ...all.map((p) => p.ac_power_w || 0), ...totalPts.map((p) => p.ac_power_w));
    const x = (t) => L + ((t - t0) / (t1 - t0)) * (W - L - R);
    const y = (v) => T + (1 - (v || 0) / max) * (H - T - B);
    const line = (pts) => pts.map((p, i) => `${i ? 'L' : 'M'}${x(p.ts).toFixed(1)},${y(p.ac_power_w).toFixed(1)}`).join(' ');
    let out = '';
    for (let i = 0; i <= 4; i++) {
      const v = (max / 4) * i, yy = y(v);
      out += `<line class="grid" x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" vector-effect="non-scaling-stroke"/>`;
      out += `<text class="axis" x="${L - 8}" y="${yy + 4}" text-anchor="end">${v >= 1000 ? (v / 1000).toFixed(1) + 'k' : Math.round(v)}</text>`;
    }
    for (let h = 0; h <= 24; h += 6) {
      const xx = x(t0 + h * 3600);
      out += `<text class="axis" x="${xx}" y="${H - 6}" text-anchor="${h === 0 ? 'start' : h === 24 ? 'end' : 'middle'}">${String(h).padStart(2, '0')}:00</text>`;
    }
    for (const inv of invs) {
      const pts = todayOf(inv, byInv[inv.id]);
      if (state.hidden.has(inv.id) || pts.length < 2) continue;
      out += `<path d="${line(pts)}" fill="none" stroke="${colorFor(inv.provider)}" stroke-width="2.2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
    }
    if (invs.length > 1 && !state.hidden.has(TOTAL_KEY) && totalPts.length > 1) {
      out += `<path d="${line(totalPts)}" fill="none" stroke="var(--total)" stroke-width="1.6" stroke-dasharray="5 4" opacity="0.75" vector-effect="non-scaling-stroke"/>`;
    }
    svg.innerHTML = out;
    return legend();
  }

  /** The dashed sum line is a series like any other, so it needs a key too. */
  const TOTAL_KEY = '__total__';

  function legendItem(id, colour, name, note) {
    const off = state.hidden.has(id);
    return `<button type="button" class="legitem${off ? ' off' : ''}" data-series="${esc(id)}"
      aria-pressed="${off ? 'false' : 'true'}" title="${off ? 'Show' : 'Hide'} ${esc(name)}">
      <i style="background:${colour}"></i>${esc(name)}${note ? ` <em>${esc(note)}</em>` : ''}</button>`;
  }

  /** Clicking a switch redraws the chart in place rather than the whole page. */
  function bindLegend(svg, byInv, invs) {
    const box = $('legend');
    if (!box) return;
    box.innerHTML = combinedChart(svg, byInv, invs).join('');
    for (const b of box.querySelectorAll('.legitem')) {
      b.onclick = () => {
        const id = b.dataset.series;
        if (state.hidden.has(id)) state.hidden.delete(id); else state.hidden.add(id);
        try { localStorage.setItem('sl-hidden', JSON.stringify([...state.hidden])); } catch { /* private window */ }
        bindLegend(svg, byInv, invs);
      };
    }
  }

  /**
   * The figures under a system's flow diagram on the overview.
   *
   * Deliberately not everything the system knows. Producing now, house load,
   * grid direction and battery charge are all drawn in the diagram directly
   * above, and repeating them as figures is what made the old figures band
   * taller than the window. Model and datalogger signal are gone too: they
   * never change, and the Devices tab is where hardware belongs.
   *
   * The count is trimmed to a multiple of four so the grid never ends in a
   * ragged row. A hybrid has five battery figures and so keeps twelve; an
   * on-grid inverter has none and keeps eight. What gets cut when a system
   * carries more than twelve is the tail of the shared list, which is ordered
   * with the most-looked-at first.
   */
  function overviewTiles(inv, pts) {
    const m = parse(inv.metrics) ?? {};
    const devs = devicesFor(inv);
    const invDev = devs.find((d) => d.kind === 'inverter');
    const tempC = inv.temp_c ?? invDev?.temp_c ?? null;
    const strings = parse(invDev?.strings);
    const bat = parse(invDev?.battery);
    // The unit is set smaller and quieter than the figure, so a column of
    // tiles reads as numbers rather than as a wall of text.
    // The space is inside the tag on purpose: it keeps the text "0.6 kWh"
    // when the tile is read out, copied, or asserted on in a test.
    const num = (v, unit) => `${v}<small> ${esc(unit)}</small>`;
    const tile = (k, v, cls) => `<div><div class="k">${esc(k)}</div><div class="v ${cls ?? ''}">${v}</div></div>`;

    // kWh past four digits is unreadable at a glance; 49.1 MWh is not.
    const energy = (k) => k === null || k === undefined ? '—'
      : k >= 1000 ? num((k / 1000).toFixed(k >= 10000 ? 1 : 2), 'MWh')
      : num(k >= 100 ? k.toFixed(0) : k.toFixed(1), 'kWh');
    const power = (w) => { const [v, u] = fmtW(w); return num(v, u); };

    const peak = pts.reduce((best, p) => (p.ac_power_w ?? 0) > (best?.ac_power_w ?? -1) ? p : best, null);

    // A hybrid has five battery figures to add, and four rows would not fit,
    // so it gives up the least-consulted of the three long-run totals. Dropping
    // from the tail instead would have cost it the inverter temperature.
    const battery = hasBattery(inv, m);

    const core = [
      tile('Produced today', energy(inv.today_kwh)),
      m.genMonthKwh != null ? tile('This month', energy(m.genMonthKwh)) : '',
      !battery && m.genYearKwh != null ? tile('This year', energy(m.genYearKwh)) : '',
      inv.total_kwh != null ? tile('Lifetime', energy(inv.total_kwh)) : '',
      peak && peak.ac_power_w ? tile('Peak today', `<span title="at ${esc(when(peak.ts))}">${power(peak.ac_power_w)}</span>`) : '',
      // Yield divided by rated power: the one figure that compares a 12 kW
      // array with a 3.5 kW one fairly, which is the whole point of this page.
      m.fullLoadHours != null ? tile('Full-load hours', num(Number(m.fullLoadHours).toFixed(2), 'h')) : '',
      (() => {
        const label = stringsLabel(strings, inv.offline);
        return label ? tile('PV strings', esc(label), 'sm') : '';
      })(),
      tempC != null ? tile('Inverter temp', num(tempC.toFixed(1), '°C')) : '',
    ].filter(Boolean);

    const batt = !battery ? [] : [
      m.selfUseTodayKwh != null ? tile('Self-use today', energy(m.selfUseTodayKwh)) : '',
      // "23 W out" rather than "−23 W": a minus sign makes the reader work out
      // which way the power is going.
      inv.battery_power_w != null ? tile('Battery power', Math.abs(inv.battery_power_w) < 50 ? 'idle'
        : `${power(Math.abs(inv.battery_power_w))}<small> ${inv.battery_power_w > 0 ? 'in' : 'out'}</small>`) : '',
      bat?.tempC != null ? tile('Battery temp', num(bat.tempC, '°C')) : '',
      m.battChargeTodayKwh != null ? tile('Charged today', energy(m.battChargeTodayKwh)) : '',
      m.battDischargeTodayKwh != null ? tile('Discharged today', energy(m.battDischargeTodayKwh)) : '',
    ].filter(Boolean);

    // Show everything there is, and let the last tile stretch across whatever
    // is left of its row.
    //
    // This used to trim the count to a multiple of four so the grid could not
    // end raggedly, which was the wrong trade: with seven figures available it
    // showed four and silently hid three. And seven is not hypothetical - it is
    // what a system reports before dawn, when peak, full-load hours, string
    // count and inverter temperature have no value yet.
    //
    // Twelve is still the ceiling: a fourth row would take the height the day
    // curve needs.
    const cells = [...core, ...batt].slice(0, 12);
    if (!cells.length) return '';
    const short = cells.length % 4;
    const last = short ? ` style="grid-column: span ${4 - short + 1}"` : '';
    return `<div class="ovtiles">${cells
      .map((c, i) => (i === cells.length - 1 && short ? c.replace('<div>', `<div${last}>`) : c))
      .join('')}</div>`;
  }

  /** The biggest sample of the day, or null before there are any. */
  function peakOf(pts) {
    return pts.reduce((best, p) => (p.ac_power_w ?? 0) > (best?.ac_power_w ?? -1) ? p : best, null);
  }

  /**
   * The overview's energy flow: solar, the house, the battery if there is one,
   * and the grid, left to right, with an arrow between each pair that lights
   * only where power is actually moving.
   *
   * Not the detail page's plan view, which puts the house at the centre and
   * hangs the other three arms off it. That drawing is the truer picture of how
   * the system is wired and it needs the width to say so - squeezed into half a
   * column it shrinks until its own labels cannot be read, and one system's
   * picture ends up half the size of the other's. This row keeps every figure
   * at full size and gives up only the arrangement, which is one click away.
   *
   * An offline system reads zero everywhere, so every arrow goes dark: the
   * picture agrees with the figures instead of animating power that stopped
   * moving an hour ago.
   */
  function overviewFlow(inv, m) {
    const off = statusOf(inv).offline;
    const val = (v) => (v === null || v === undefined) ? null : (off ? 0 : v);
    const solar = val(inv.ac_power_w) ?? 0;
    const load = val(inv.load_power_w);
    const grid = val(inv.grid_power_w);
    const batt = val(inv.battery_power_w);
    const soc = inv.battery_soc;
    // Tens of watts either way is meter drift, not a flow worth drawing.
    const moving = (v) => v !== null && Math.abs(v) >= 50;

    const pct = inv.capacity_w ? Math.round((solar / inv.capacity_w) * 100) : null;

    // One circle of the diagram - icon, label, figure - and the arrow between two.
    const node = (icon, lab, value, opts) => {
      const o = opts || {};
      return '<div class="ovnode' + (o.live ? ' live' : '') + '">' +
        '<div class="ovring">' + icon + '</div>' +
        '<span class="ovlab">' + esc(lab) + '</span>' +
        '<span class="ovval' + (o.cls ? ' ' + o.cls : '') + '">' + value + '</span>' +
        (o.sub ? '<span class="ovsub">' + esc(o.sub) + '</span>' : '') +
        '</div>';
    };
    const arrow = (live, back) =>
      '<div class="ovarrow' + (live ? ' live' : '') + (back ? ' back' : '') + '"></div>';

    const parts = [
      node('&#9728;&#65039;', pct === null ? 'Solar' : 'Solar · ' + pct + '%', fmtWs(solar), {
        live: solar > 0,
      }),
      arrow(solar > 0),
      node('&#127968;', 'House load', load === null ? '—' : fmtWs(load), {
        live: moving(load), cls: load === null ? 'dim' : '',
      }),
    ];

    if (hasBattery(inv, m)) {
      const state = !moving(batt) ? 'idle' : batt > 0 ? 'charging' : 'discharging';
      // A pack that is discharging is feeding the house, so the arrow turns back.
      parts.push(arrow(moving(batt), batt !== null && batt < 0));
      parts.push(node('&#128267;', 'Battery · ' + state,
        (soc === null || soc === undefined) ? '—' : Math.round(soc) + '%', {
          live: moving(batt),
          cls: (soc !== null && soc !== undefined) ? 'good' : 'dim',
        }));
    }

    // On the wire + is import, so a positive reading points back at the house.
    const dir = !moving(grid) ? 'idle' : grid > 0 ? 'importing' : 'exporting';
    parts.push(arrow(moving(grid), grid !== null && grid > 0));
    parts.push(node('&#9889;', 'Grid · ' + dir,
      grid === null ? '—' : fmtWs(Math.abs(grid)), {
        live: moving(grid), cls: grid === null ? 'dim' : '',
      }));

    return '<div class="ovnodes">' + parts.join('') + '</div>';
  }

  /**
   * The Overview tab: one column per system - its flow diagram, today's
   * figures and its curve - sized to fit a laptop screen without scrolling.
   */
  function renderOverview() {
    const invs = state.latest?.inverters ?? [];
    const byInv = {};
    for (const p of state.series?.points ?? []) (byInv[p.inverter_id] ||= []).push(p);
    if (!invs.length) {
      $('view').innerHTML = `<div class="card"><div class="empty">No inverters yet. Trigger a poll with <code>POST /api/poll</code> or wait for the next cron run.</div></div>`;
      return;
    }

    const cols = invs.map((inv, i) => {
      const st = statusOf(inv);
      const pts = todayOf(inv, byInv[inv.id]);
      const m = parse(inv.metrics) ?? {};
      const peak = peakOf(pts);
      // Everything above the chart is one link to this system's detail page,
      // the way the whole card was before: a reader who wants more about a
      // figure clicks the figure, not a title bar above it. The chart is the
      // exception and goes to Power, where it is drawn full width.
      return `<section class="ovsys" style="--accent:${colorFor(inv.provider)};--accent-ink:${inkFor(inv.provider)}">
        <a class="ovmain" href="#/system/${encodeURIComponent(inv.id)}" title="Open ${esc(inv.name)}">
          <div class="ovhead">
            <span class="ovname">${esc(inv.name)}</span>
            <span class="ovchip">${inv.capacity_w ? `${esc(fmtWs(inv.capacity_w))} · ` : ''}${esc(providerName(inv.provider))}</span>
            <span class="ovwhen">
              <span class="pill ${st.cls}"${st.stale && st.lastWord ? ` title="Last word from the vendor: ${esc(st.lastWord)}"` : ''}><i></i>${esc(st.text)}</span>
              ${inv.ts ? `<span${` title="${esc(when(inv.ts))}"`}>${esc(ago(inv.ts))}</span>` : ''}
            </span>
          </div>
          ${st.offline ? `<div class="flowstale">⚠ offline · last update ${esc(inv.ts ? `${when(inv.ts)} (${ago(inv.ts)})` : 'never')}</div>` : ''}
          <div class="ovflow">${overviewFlow(inv, m)}</div>
          ${overviewTiles(inv, pts)}
        </a>
        <a class="ovchart" href="#/power" title="Open the Power tab">
          <div class="ovchart-head">
            <span class="t">Today · watts</span>
            ${peak ? `<span class="p">peak ${fmtWs(peak.ac_power_w)} at ${esc(hhmm(peak.ts, peak.tz_offset_sec ?? inv.tz_offset_sec))}</span>` : ''}
          </div>
          ${systemChart(inv, pts, 'ov' + i, 300, { bare: true })}
        </a>
      </section>`;
    }).join('');

    $('view').innerHTML = `<div class="ovgrid">${cols}</div>`;
  }

  // ---------- alerts ----------
  /**
   * Everything either cloud says is wrong, gathered in one place.
   *
   * Nothing here is invented: each row names the field it came from, so a
   * quiet page means "both vendors report normal", not "we did not look". The
   * clouds disagree about how to say it - SolisCloud counts alarms and sets a
   * level, SolarMan carries a handful of NORMAL/ABNORMAL flags - so both
   * vocabularies are read and mapped onto the same three severities.
   */
  /**
   * "5 min ago" answers "is this current?"; a clock time answers "was this the
   * one at breakfast?". An alert needs both, so the absolute stamp leads and
   * the relative one follows it.
   */
  /**
   * Today's sunrise as an epoch, from whatever the vendor put in the metrics
   * ("05:45", local to the site). Null when nobody told us - in which case no
   * claim is made about a gap, because there is nothing to measure it against.
   */
  function sunriseTs(inv, t0) {
    const sr = parse(inv.metrics)?.sunrise;
    const m = typeof sr === 'string' ? sr.match(/^\s*(\d{1,2}):(\d{2})/) : null;
    if (!m) return null;
    return t0 + Number(m[1]) * 3600 + Number(m[2]) * 60;
  }

  /**
   * Just the clock, for an axis label where the date is already implied, in the
   * plant's own zone when it reported one. A peak time is a fact about the sun
   * over the array, not about where the page happens to be open.
   */
  const hhmm = (ts, offsetSec) => {
    if (offsetSec == null) {
      return new Date(ts * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
    }
    const mins = Math.floor(((ts + offsetSec) % 86400) / 60);
    return `${String(Math.floor(mins / 60)).padStart(2, '0')}:${String(mins % 60).padStart(2, '0')}`;
  };

  function when(ts) {
    if (!ts) return 'unknown';
    const d = new Date(ts * 1000);
    if (Number.isNaN(d.getTime())) return 'unknown';
    try {
      return new Intl.DateTimeFormat(undefined, {
        day: 'numeric', month: 'short', year: 'numeric',
        hour: '2-digit', minute: '2-digit', hour12: false,
      }).format(d);
    } catch {
      return d.toISOString().slice(0, 16).replace('T', ' ');
    }
  }
  const stamp = (ts) => ts ? `${when(ts)} · ${ago(ts)}` : 'time not reported';

  // SolarMan's warning flags, as the Worker names them (src/public-view.ts,
  // vendorSignals). Each reads NORMAL until something is wrong.
  const WARN_FLAGS = [
    ['warning_status', 'Inverter warning'],
    ['business_warning_status', 'Service warning'],
    ['consumer_warning_status', 'Load warning'],
  ];

  /**
   * SolisCloud relays and their logins.
   *
   * A SolisCloud login lasts exactly seven days, and use does not extend it.
   * Each relay reports its login's expiry after every cycle, so the page can
   * warn two days ahead - early enough to renew without losing a reading - and
   * say plainly once a login has run out. A relay not heard from for a week is
   * a computer that is off, and its login is nobody's concern until it is on.
   */
  const RELAY_WARN_S = 2 * 86400;
  const RELAY_QUIET_S = 7 * 86400;
  const RENEW_HOW = 'On that computer, double-click renew-solis-login.cmd in the SolarLens folder and log in.';

  /** A relay's SolisCloud login: expired, how long it has left, and whether that is soon. */
  function relayLogin(r, now = Math.floor(Date.now() / 1000)) {
    const expired = r.state === 'login-expired' || (r.login_expires_at != null && r.login_expires_at <= now);
    const left = r.login_expires_at != null ? r.login_expires_at - now : null;
    return { expired, left, soon: !expired && left != null && left <= RELAY_WARN_S };
  }

  const untilText = (s) => s < 3600 ? 'within the hour'
    : s < 48 * 3600 ? `in ${Math.round(s / 3600)} hours`
    : `in ${Math.round(s / 86400)} days`;

  /** Alert rows for relay logins, shown under the SolisCloud system. */
  function relayAlerts() {
    const now = Math.floor(Date.now() / 1000);
    const relays = (state.health?.relays ?? []).filter((r) => now - r.last_seen <= RELAY_QUIET_S);
    // Another relay with a working login still delivers the readings, so one
    // expired login is then something to fix, not an outage.
    const covered = (r) => relays.some((o) => o !== r && o.state === 'ok' && !relayLogin(o, now).expired && now - o.last_seen <= 3600);
    const out = [];
    for (const r of relays) {
      const l = relayLogin(r, now);
      if (l.expired) {
        out.push({
          level: covered(r) ? 'warn' : 'bad',
          title: `SolisCloud login expired on ${r.name}`,
          detail: `${r.name} cannot send SolisCloud readings until someone logs in on it again.`
            + (covered(r) ? ' Readings still arrive through another relay.' : '') + ` ${RENEW_HOW}`,
          ts: r.last_seen,
        });
      } else if (l.soon) {
        out.push({
          level: 'warn',
          title: `SolisCloud login on ${r.name} expires ${untilText(l.left)}`,
          detail: `Renew it before then and no readings are lost. A login lasts seven days. ${RENEW_HOW}`,
          ts: r.last_seen,
        });
      }
    }
    return out;
  }

  /**
   * Everything wrong with one system right now, as rows of level, title,
   * detail and source: the feed gone quiet, vendor alarms and flags, hardware,
   * relay logins and failed polls. The Alerts tab, its badge and the
   * notification switch all read from this one list.
   */
  function alertsFor(inv) {
    const out = [];
    const st = statusOf(inv);
    // Every row carries the moment it is describing: the sample it was read
    // from, the device's last contact, or the poll that failed.
    const add = (level, title, detail, source, ts = inv.ts) => out.push({ level, title, detail, source, ts });

    // --- the feed itself, which is ours to judge rather than the vendor's ---
    if (!inv.ts) {
      add('warn', 'No data yet', 'This system has never delivered a sample.', 'SolarLens');
    } else if (st.offline) {
      // A relay-fed system has a second way to go quiet that has nothing to do
      // with the plant: the agent is not running. Worth saying, because the
      // fix is on this side rather than on the roof.
      const relay = String(inv.source || '').endsWith('-relay')
        ? ' This system is fed by the local relay agent, so check that it is still running before suspecting the hardware.'
        : '';
      add('bad', 'System offline',
        inv.status === 'offline'
          ? `The vendor reports the plant offline. Last update ${ago(inv.ts)}.${relay}`
          : `Nothing has arrived for ${ago(inv.ts)}; the cutoff is 15 minutes.${relay}`,
        inv.status === 'offline' ? providerName(inv.provider) : 'SolarLens');
    }

    // --- SolisCloud: an alarm counter and a severity level -----------------
    // null means the vendor did not say, which is not the same as zero.
    const alarms = inv.alarm_count == null ? NaN : Number(inv.alarm_count);
    if (Number.isFinite(alarms) && alarms > 0) {
      add('bad', `${alarms} active alarm${alarms === 1 ? '' : 's'}`,
        'Open the SolisCloud alarm list for the fault codes; SolarLens only sees the count.', 'SolisCloud');
    }
    const level = inv.alarm_level == null ? NaN : Number(inv.alarm_level);
    if (Number.isFinite(level) && level > 0) {
      add(level > 1 ? 'bad' : 'warn', `Alarm level ${level}`, 'Raised by the plant itself.', 'SolisCloud');
    }

    // --- SolarMan: flags that read NORMAL until they do not -----------------
    for (const [key, label] of WARN_FLAGS) {
      const v = inv[key];
      if (v && String(v).toUpperCase() !== 'NORMAL') {
        add('warn', label, `Reported as "${String(v).toLowerCase()}".`, 'SolarMan');
      }
    }
    const net = inv.network_status;
    if (net && String(net).toUpperCase() !== 'NORMAL') {
      add('warn', 'Datalogger link', `Reported as "${String(net).toLowerCase()}".`, 'SolarMan');
    }

    // --- the hardware behind the readings ----------------------------------
    for (const d of devicesFor(inv)) {
      const what = `${d.kind === 'datalogger' ? 'Datalogger' : d.kind === 'inverter' ? 'Inverter' : d.kind} ${d.sn ?? ''}`.trim();
      // A device's own clock is its last contact, not the plant's newest sample.
      const dts = d.last_seen ?? d.updated_at ?? inv.ts;
      if (d.status === 'alarm') add('bad', `${what} in alarm`, 'The device itself is raising a fault.', providerName(d.provider), dts);
      else if (d.status === 'offline') {
        add('warn', `${what} offline`,
          d.last_seen ? `Last contact ${ago(d.last_seen)}.` : 'No contact recorded.', providerName(d.provider), dts);
      }
      const dAlert = d.alert_status == null ? NaN : Number(d.alert_status);
      // SolarMan uses -1 for "nothing to report", so only a positive count is news.
      if (Number.isFinite(dAlert) && dAlert > 0) {
        add('bad', `${what}: ${dAlert} alert${dAlert === 1 ? '' : 's'}`, 'Raised on the device record.', 'SolarMan', dts);
      }
      // A datalogger that cannot hear the radio is the usual cause of a silent
      // outage, and it is worth saying before the data goes stale.
      if (d.kind === 'datalogger' && d.signal_pct != null && d.signal_pct < 25) {
        add('warn', `${what}: weak signal`, `${Math.round(d.signal_pct)}% link quality.`, 'SolarMan', dts);
      }
      if (d.kind === 'datalogger' && d.signal_dbm != null && d.signal_dbm < -85) {
        add('warn', `${what}: weak signal`, `${d.signal_dbm} dBm.`, 'SolisCloud', dts);
      }
    }

    // --- the relays that carry SolisCloud, which live on somebody's laptop ---
    if (inv.provider === 'soliscloud') {
      for (const a of relayAlerts()) add(a.level, a.title, a.detail, 'SolarLens', a.ts);
    }

    // --- our own polling, which can fail without the vendor being at fault --
    const poll = (state.health?.polls ?? []).find((p) => p.provider === inv.provider);
    if (poll && !poll.ok) {
      // Escaped once, by the renderer. Escaping here as well turned an "&"
      // in a vendor's error string into "&amp;amp;" on the page.
      add('bad', 'Last poll failed', poll.detail || 'No detail given.', 'SolarLens', poll.ts);
    }

    // Faults first, then whatever happened most recently: the two questions a
    // reader actually has, in that order.
    const rank = { bad: 0, warn: 1, info: 2 };
    return out.sort((a, b) => (rank[a.level] - rank[b.level]) || ((b.ts ?? 0) - (a.ts ?? 0)));
  }

  /** What was looked at, so an empty list reads as "clear", not "not checked". */
  function checksFor(inv) {
    const list = ['feed freshness', 'vendor plant status'];
    if (inv.provider === 'soliscloud') list.push('alarm count', 'alarm level', 'relay logins');
    else list.push('inverter, service and load warning flags', 'datalogger link status');
    if (devicesFor(inv).length) list.push('device status', 'datalogger signal');
    list.push('last poll result');
    return list;
  }

  // The number on the Alerts tab.
  function alertCount() {
    return (state.latest?.inverters ?? []).reduce((a, i) => a + alertsFor(i).length, 0);
  }

  /** Fault history is read when the Alerts tab is opened, and again once it is ten minutes old. */
  const ALARMS_STALE_MS = 10 * 60_000;
  async function loadAlarms() {
    state.alarms = { loading: true, at: Date.now() };
    try {
      state.alarms = { ...(await api('/api/alarms?days=3650')), at: Date.now() };
    } catch (e) {
      state.alarms = { error: e.message, at: Date.now() };
    }
    if (location.hash === '#/alerts') renderAlerts();
  }

  /** "under a minute", "40 min", "2 h 5 min", "3 d 4 h". */
  function lasted(a) {
    if (a.end_ts == null) return a.state === 'active' ? 'ongoing' : 'not recorded';
    const s = Math.max(0, a.end_ts - a.begin_ts);
    if (s < 60) return 'under a minute';
    if (s < 3600) return `${Math.round(s / 60)} min`;
    if (s < 86400) return `${Math.floor(s / 3600)} h ${Math.round((s % 3600) / 60)} min`;
    return `${Math.floor(s / 86400)} d ${Math.round((s % 86400) / 3600)} h`;
  }

  /**
   * A system's fault history: every alarm its vendor has on record, newest first.
   *
   * What the vendor says is what is printed. SolisCloud gives advice with each
   * alarm, and SolarMan has advice for some faults and none for most, so the
   * column appears only where there is something in it. SolarMan's end times
   * come from its timeline, which can leave one unknown - a fault running into
   * midnight - and then the page says "not recorded" rather than implying the
   * fault is still going on.
   */
  const FAULTS_SHOWN = 50;
  function faultHistory(inv) {
    const s = state.alarms;
    const head = `<h3 class="fh-title">Fault history</h3>`;
    if (!s || s.loading) return `${head}<div class="ac-sub">Loading…</div>`;
    if (s.error) return `${head}<div class="ac-sub">Could not load fault history: ${esc(s.error)}</div>`;
    const rows = (s.alarms ?? []).filter((a) => a.inverter_id === inv.id);
    if (!rows.length) {
      return `${head}<div class="ac-sub">${esc(providerName(inv.provider))} has no alarms on record for this system.</div>`;
    }
    // A one-line summary above the table: how many, since when, and the fault
    // that happens most - usually the one worth asking about.
    const oldest = rows[rows.length - 1].begin_ts;
    const counts = new Map();
    for (const a of rows) {
      const k = a.message || a.code;
      counts.set(k, (counts.get(k) ?? 0) + 1);
    }
    const [common, commonN] = [...counts.entries()].sort((x, y) => y[1] - x[1])[0];
    // The advice column appears only if some alarm has advice to show.
    const anyAdvice = rows.some((a) => a.advice);
    const sev = (a) => `<span class="pill ${a.severity === 'fault' ? 'bad' : a.severity === 'warning' ? 'warn' : ''}"><i></i>${esc(a.severity ?? 'level ' + (a.vendor_level ?? '?'))}</span>`;
    // The newest FAULTS_SHOWN alarms, as table rows.
    const body = rows.slice(0, FAULTS_SHOWN).map((a) => `<tr>
        <td class="mono">${esc(when(a.begin_ts))}</td>
        <td>${sev(a)}</td>
        <td class="mono">${esc(a.code)}</td>
        <td>${esc(a.message ?? '—')}</td>
        <td>${esc(lasted(a))}</td>
        ${anyAdvice ? `<td class="faint">${esc(a.advice ?? '—')}</td>` : ''}
      </tr>`).join('');
    return `${head}
      <div class="ac-sub fh-sum"><b>${rows.length}</b> alarm${rows.length === 1 ? '' : 's'} since
        ${esc(new Date(oldest * 1000).toLocaleDateString(undefined, { month: 'short', year: 'numeric' }))}.
        Most often: ${esc(common)}, ${commonN} time${commonN === 1 ? '' : 's'}.</div>
      <div class="tablewrap" tabindex="0" role="region" aria-label="Table, scrolls sideways"><table class="devices faults">
        <thead><tr><th>Started</th><th>Severity</th><th>Code</th><th>What</th><th>Lasted</th>${anyAdvice ? '<th>Vendor advice</th>' : ''}</tr></thead>
        <tbody>${body}</tbody>
      </table></div>
      ${rows.length > FAULTS_SHOWN ? `<div class="ac-sub">Showing the newest ${FAULTS_SHOWN} of ${rows.length}.</div>` : ''}`;
  }

  /** The Alerts tab: each system's current alerts, the notification switches, and fault history. */
  function renderAlerts() {
    const invs = state.latest?.inverters ?? [];
    if (!state.alarms || (!state.alarms.loading && Date.now() - state.alarms.at > ALARMS_STALE_MS)) loadAlarms();
    if (!invs.length) {
      $('view').innerHTML = `<div class="card"><div class="empty">No systems yet, so nothing to report on.</div></div>`;
      return;
    }
    const dot = (l) => `<span class="pill ${l === 'bad' ? 'bad' : l === 'warn' ? 'warn' : ''}"><i></i>${l === 'bad' ? 'fault' : l === 'warn' ? 'warning' : 'note'}</span>`;

    // Told once, when something changes - on whichever device has the
    // dashboard open. See the note above notifyOfAlerts for what that is and
    // is not.
    const notifyRow = !notifySupported()
      ? ''
      : `<section class="card"><div class="body notifyrow">
          <label class="notifylabel"><input type="checkbox" id="notify" ${notifyOn() ? 'checked' : ''}>
            <span>Tell me when something changes</span></label>
          <small class="faint" id="notifynote">${notifyOn()
            ? 'This browser will raise a notification when a new alert appears, while the dashboard is open.'
            : 'Raises a notification on this device when a new alert appears, while the dashboard is open here.'}</small>
          <div class="pushrow" id="pushrow" aria-live="polite"></div>
        </div></section>`;

    // One collapsible section per system: its alerts as a list, or "nothing
    // reported" with what was checked, then its fault history below.
    const sections = invs.map((inv) => {
      const rows = alertsFor(inv);
      const st = statusOf(inv);
      const worst = rows.some((r) => r.level === 'bad') ? 'bad' : rows.length ? 'warn' : 'ok';
      const body = rows.length
        ? `<ul class="alerts">${rows.map((r) => `<li class="${r.level}">
             <div class="a-head">${dot(r.level)}<span class="a-title">${esc(r.title)}</span>
               <span class="a-src">${esc(r.source)}</span></div>
             <div class="a-detail">${esc(r.detail)}</div>
             <div class="a-when"><time${r.ts ? ` datetime="${new Date(r.ts * 1000).toISOString()}"` : ''}>${esc(stamp(r.ts))}</time></div>
           </li>`).join('')}</ul>`
        : `<div class="allclear">
             <div class="ac-head">✓ Nothing reported</div>
             <div class="ac-sub">Checked: ${esc(checksFor(inv).join(', '))}.</div>
             <div class="a-when">Against the update of <time${inv.ts ? ` datetime="${new Date(inv.ts * 1000).toISOString()}"` : ''}>${esc(stamp(inv.ts))}</time></div>
           </div>`;
      return `<details class="syssec" open>
        <summary>
          <span class="vendor" style="color:${inkFor(inv.provider)}">${esc(providerName(inv.provider))}</span>
          <span class="sname">${esc(inv.name)}</span>
          <span class="snow"><small>${rows.length ? `${rows.length} to look at` : 'clear'}</small></span>
          <span class="pill ${worst === 'bad' ? 'bad' : worst === 'warn' ? 'warn' : 'ok'}"><i></i>${esc(st.text)}</span>
        </summary>
        <div class="secbody">${body}<div class="faulthist">${faultHistory(inv)}</div></div>
      </details>`;
    }).join('');

    // The headline: how many things to look at across every system.
    const total = invs.reduce((a, i) => a + alertsFor(i).length, 0);
    $('view').innerHTML = `<section class="card"><h2>Alerts</h2><div class="body">
        <div class="alertsum">${total
          ? `<b>${total}</b> thing${total === 1 ? '' : 's'} to look at across ${invs.length} system${invs.length === 1 ? '' : 's'}.`
          : `Nothing to look at. Both clouds report normal, and both feeds are current.`}
        </div>
        <div class="ac-sub">SolarLens reports what the vendors report, plus what it can see about its own polling. It does not raise alerts of its own beyond a feed going quiet.</div>
      </div></section>${notifyRow}${sections}`;

    // Wire the while-open switch, then draw the closed-browser half below it.
    const box = $('notify');
    if (box) {
      box.onchange = async () => {
        const wanted = box.checked;
        const ok = await toggleNotify(wanted);
        box.checked = wanted && ok;
        $('notifynote').textContent = box.checked
          ? 'This browser will raise a notification when a new alert appears, while the dashboard is open.'
          : wanted
            ? 'This browser refused permission to notify. Allow notifications for this site and try again.'
            : 'Raises a notification on this device when a new alert appears, while the dashboard is open here.';
      };
    }
    fillPushRow();
  }

  // ---------- historical data ----------
  /**
   * Day by day, per system.
   *
   * Every "today" figure the vendors publish is a counter that climbs through
   * the day and resets at local midnight, so a day's total is the largest
   * value seen inside it. The Worker does that grouping; this draws it.
   *
   * The record starts when SolarLens started collecting, which is worth saying
   * plainly - the vendors' own lifetime totals are shown beside it so the two
   * are never mistaken for each other.
   */
  const HISTORY_RANGES = [7, 30, 90];
  // Month and year views need the longest window the API gives: 400 days is
  // thirteen months, enough for this month to sit beside the same one last year.
  const ROLLUP_DAYS = 400;
  const GROUPS = [['day', 'By day'], ['month', 'By month'], ['year', 'By year']];

  // Which system the Historical Data tab shows: every system, one after the
  // other, or one on its own. Remembered per browser - someone who looks after
  // one of the systems wants to land on it - and 'all' when the remembered one
  // is not a system any more.
  const HISTORY_SYSTEM_KEY = 'solarlens-history-system';
  function historySystem(invs) {
    let wanted = state.historySystem;
    if (wanted === undefined) {
      try { wanted = localStorage.getItem(HISTORY_SYSTEM_KEY) || 'all'; } catch { wanted = 'all'; }
      state.historySystem = wanted;
    }
    return invs.some((i) => i.id === wanted) ? wanted : 'all';
  }

  /**
   * Daily rows folded into months or years.
   *
   * Energy sums; peak is the highest peak; samples add up. What a rollup must
   * never do is pass a partial period off as a whole one - the record starts
   * the day SolarLens began collecting, so its first month is only the days
   * after that. Each period therefore carries how many days were recorded and
   * how many the period has, and the page prints both.
   */
  /** How many days a period has: 2026-02 has 28, 2024 has 366. */
  function periodSpan(k, group) {
    const y = Number(k.slice(0, 4));
    if (group === 'year') return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0 ? 366 : 365;
    return new Date(Date.UTC(y, Number(k.slice(5, 7)), 0)).getUTCDate();
  }

  /** Daily rows folded into months or years, summing energy and keeping the day's peak. */
  function rollup(rows, group) {
    const key = (d) => (group === 'month' ? d.slice(0, 7) : d.slice(0, 4));
    const span = (k) => periodSpan(k, group);
    const add = (a, b) => (a == null && b == null ? null : (a ?? 0) + (b ?? 0));
    const out = new Map();
    for (const r of rows) {
      const k = key(r.day);
      const p = out.get(k) ?? {
        day: k, yield_kwh: null, load_kwh: null, import_kwh: null, export_kwh: null,
        batt_charge_kwh: null, batt_discharge_kwh: null, peak_w: null, samples: 0, days: 0, span: span(k),
      };
      p.yield_kwh = add(p.yield_kwh, r.yield_kwh);
      p.load_kwh = add(p.load_kwh, r.load_kwh);
      p.import_kwh = add(p.import_kwh, r.import_kwh);
      p.export_kwh = add(p.export_kwh, r.export_kwh);
      p.batt_charge_kwh = add(p.batt_charge_kwh, r.batt_charge_kwh);
      p.batt_discharge_kwh = add(p.batt_discharge_kwh, r.batt_discharge_kwh);
      p.peak_w = r.peak_w == null ? p.peak_w : Math.max(p.peak_w ?? 0, r.peak_w);
      p.samples += r.samples ?? 0;
      p.days += 1;
      out.set(k, p);
    }
    // Newest first, like the daily rows.
    return [...out.values()].sort((a, b) => (a.day < b.day ? 1 : -1));
  }

  /**
   * A system's months or years, with the vendor's own totals wherever it has one.
   *
   * SolarLens's record starts on the day it first polled, so on its own the
   * first month is a fraction of a month and every earlier year is missing. The
   * vendors counted all of it. Where a vendor total exists it is the figure for
   * that period, and SolarLens's own record supplies only what the vendor does
   * not report - the peak, and how many of the period's days it saw itself.
   * A period the vendor never reported stays exactly as recorded.
   */
  function withVendor(own, vendorRows, group) {
    const byKey = new Map(own.map((r) => [r.day, r]));
    const keys = new Set([...byKey.keys(), ...vendorRows.map((v) => v.key)]);
    const out = [];
    for (const k of keys) {
      const r = byKey.get(k);
      const v = vendorRows.find((x) => x.key === k);
      out.push(v ? {
        day: k,
        yield_kwh: v.yield_kwh, load_kwh: v.load_kwh, import_kwh: v.import_kwh, export_kwh: v.export_kwh,
        batt_charge_kwh: v.charge_kwh, batt_discharge_kwh: v.discharge_kwh,
        peak_w: r?.peak_w ?? null, samples: r?.samples ?? 0, days: r?.days ?? 0, span: periodSpan(k, group),
        recorded_kwh: r?.yield_kwh ?? null, source: 'vendor',
      } : { ...r, recorded_kwh: r.yield_kwh, source: 'recorded' });
    }
    return out.sort((a, b) => (a.day < b.day ? 1 : -1));
  }

  // The vendors' own month and year totals, fetched once they are first needed.
  async function loadPeriods() {
    state.periods = { loading: true };
    try {
      state.periods = await api('/api/periods');
    } catch (e) {
      state.periods = { error: e.message };
    }
    if (location.hash === '#/history') renderHistory();
  }

  // One row per system per day for the last `days` days.
  async function loadHistory(days) {
    state.historyDays = days;
    try {
      state.history = await api(`/api/history?days=${days}&tz=${new Date().getTimezoneOffset()}`);
    } catch (e) {
      state.history = { error: e.message };
    }
    if (location.hash === '#/history') renderHistory();
  }

  /**
   * The Historical Data tab: the system switch, the grouping and range
   * buttons, Download CSV, then each chosen system's bars, table and totals.
   */
  function renderHistory() {
    const invs = state.latest?.inverters ?? [];
    if (!state.history) { loadHistory(state.historyDays ?? 30); }

    const days = state.historyDays ?? 30;
    const group = state.historyGroup ?? 'day';
    // Vendor totals matter only once days are folded into months or years.
    if (group !== 'day' && !state.periods) loadPeriods();
    // The day ranges mean nothing once rows are folded into months, so the
    // month and year views show only the grouping switch.
    const system = historySystem(invs);
    const systemPick = invs.length > 1
      ? `<div class="rangepick syspick" role="group" aria-label="Which system">${[['all', 'All systems'], ...invs.map((i) => [i.id, i.name])]
          .map(([id, label]) => `<button type="button" class="sysbtn${id === system ? ' on' : ''}" data-system="${esc(id)}"
            aria-pressed="${id === system}">${esc(label)}</button>`).join('')}</div>`
      : '';
    const picker = `${systemPick}<div class="rangepick">${GROUPS.map(([g, label]) =>
      `<button type="button" class="groupbtn${g === group ? ' on' : ''}" data-group="${g}">${label}</button>`).join('')}
      ${group === 'day' ? `<span class="rangesep"></span>${HISTORY_RANGES.map((d) =>
      `<button type="button" class="rangebtn${d === days ? ' on' : ''}" data-days="${d}">${d} days</button>`).join('')}` : ''}</div>`;

    if (state.history?.error) {
      $('view').innerHTML = `<div class="card"><div class="empty">Could not load history: ${esc(state.history.error)}</div></div>`;
      return;
    }
    if (!state.history) {
      $('view').innerHTML = `<section class="card"><h2>Historical Data</h2><div class="body">${picker}
        <div class="empty">Loading…</div></div></section>`;
      bindRange();
      return;
    }

    const rows = state.history.rows ?? [];
    const byInv = {};
    for (const r of rows) (byInv[r.inverter_id] ||= []).push(r);
    if (group !== 'day') {
      const vendor = (state.periods?.periods ?? []).filter((p) => p.period === group);
      for (const inv of invs) {
        byInv[inv.id] = withVendor(rollup(byInv[inv.id] ?? [], group), vendor.filter((p) => p.inverter_id === inv.id), group);
      }
    }
    // One system on its own, or all of them: everything below - the charts,
    // the tables, the row count and the CSV - follows the switch.
    const shown = system === 'all' ? invs : invs.filter((i) => i.id === system);
    const shownById = Object.fromEntries(shown.map((i) => [i.id, byInv[i.id] ?? []]));
    // What the table is about to show, kept for the CSV button: the export
    // says "as shown", and this is what shown means.
    state.historyView = { group, byInv: shownById, system: system === 'all' ? null : shown[0]?.name ?? null };
    const shownCount = Object.values(shownById).reduce((n, list) => n + list.length, 0);
    const periodWord = group === 'month' ? 'Month' : group === 'year' ? 'Year' : 'Day';

    const sections = shown.map((inv, i) => {
      const mine = byInv[inv.id] ?? [];
      const m = parse(inv.metrics) ?? {};
      if (!mine.length) {
        return `<details class="syssec" open><summary>
            <span class="vendor" style="color:${inkFor(inv.provider)}">${esc(providerName(inv.provider))}</span>
            <span class="sname">${esc(inv.name)}</span></summary>
          <div class="secbody"><div class="empty">No days recorded yet for this system.</div></div></details>`;
      }
      const totals = mine.reduce((a, r) => ({
        yield: a.yield + (r.yield_kwh ?? 0),
        load: a.load + (r.load_kwh ?? 0),
        imp: a.imp + (r.import_kwh ?? 0),
        exp: a.exp + (r.export_kwh ?? 0),
      }), { yield: 0, load: 0, imp: 0, exp: 0 });

      const anyLoad = mine.some((r) => r.load_kwh != null);
      const anyGrid = mine.some((r) => r.import_kwh != null || r.export_kwh != null);
      const anyBatt = mine.some((r) => r.batt_charge_kwh != null || r.batt_discharge_kwh != null);

      const head = [periodWord, 'Produced', anyLoad ? 'Consumed' : null, anyGrid ? 'Imported' : null,
        anyGrid ? 'Exported' : null, anyBatt ? 'Charged' : null, anyBatt ? 'Discharged' : null,
        'Peak', group === 'day' ? null : 'Days recorded', 'Samples', group === 'day' ? null : 'Source'].filter(Boolean);

      const body = mine.map((r) => `<tr>
        <td class="mono">${esc(r.day)}</td>
        <td>${fmtKwh(r.yield_kwh)}</td>
        ${anyLoad ? `<td>${fmtKwh(r.load_kwh)}</td>` : ''}
        ${anyGrid ? `<td>${fmtKwh(r.import_kwh)}</td><td>${fmtKwh(r.export_kwh)}</td>` : ''}
        ${anyBatt ? `<td>${fmtKwh(r.batt_charge_kwh)}</td><td>${fmtKwh(r.batt_discharge_kwh)}</td>` : ''}
        <td>${fmtWs(r.peak_w)}</td>
        ${group === 'day' ? '' : `<td class="${r.days < r.span ? 'partial' : ''}">${r.days} of ${r.span}</td>`}
        <td class="faint">${r.samples}</td>
        ${group === 'day' ? '' : `<td class="faint">${r.source === 'vendor' ? esc(providerName(inv.provider)) : 'SolarLens'}</td>`}
      </tr>`).join('');
      const usesVendor = mine.some((r) => r.source === 'vendor');

      // The one comparison that says how much of a period the record is
      // missing: the vendor counted the whole of this month and year, even the
      // part before SolarLens was collecting.
      const nowKey = group === 'month' ? mine[0]?.day : group === 'year' ? mine[0]?.day : null;
      const vendorNow = group === 'month' ? m.genMonthKwh : group === 'year' ? m.genYearKwh : null;
      const shortfall = !usesVendor && nowKey && vendorNow != null && mine[0].yield_kwh != null && vendorNow - mine[0].yield_kwh > 0.5
        ? `<p class="cardnote" style="margin:0 20px 4px">${esc(providerName(inv.provider))} counts ${fmtKwh(vendorNow)} for ${esc(nowKey)};
           SolarLens recorded ${fmtKwh(mine[0].yield_kwh)} across ${mine[0].days} of its ${mine[0].span} days.
           The difference is the part of the ${group} before collecting began, or days a feed was down.</p>`
        : '';

      return `<details class="syssec" open>
        <summary>
          <span class="vendor" style="color:${inkFor(inv.provider)}">${esc(providerName(inv.provider))}</span>
          <span class="sname">${esc(inv.name)}</span>
          <span class="snow">${fmtKwh(totals.yield)}<small> in ${group === 'day'
            ? `${mine.length} day${mine.length === 1 ? '' : 's'}`
            : `${mine.length} ${group}${mine.length === 1 ? '' : 's'}`}</small></span>
        </summary>
        <div class="secbody">
          <section class="card"><div class="body">${dailyBars(mine, colorFor(inv.provider), 'hb' + i, group)}</div></section>
          ${shortfall}
          ${usesVendor ? `<p class="cardnote" style="margin:0 20px 4px">Figures are ${esc(providerName(inv.provider))}'s own
            ${group} totals, which cover the whole ${group} including any part before SolarLens began collecting.
            "Days recorded" is how much of it SolarLens saw itself, and the peak comes from those days.</p>` : ''}
          <div class="tablewrap" tabindex="0" role="region" aria-label="Table, scrolls sideways"><table class="devices">
            <thead><tr>${head.map((h) => `<th>${esc(h)}</th>`).join('')}</tr></thead>
            <tbody>${body}</tbody>
          </table></div>
          <dl class="kv" style="padding:16px 20px 20px">
            <dt>Recorded here</dt><dd>${fmtKwh(group === 'day' ? totals.yield : mine.reduce((a, r) => a + (r.recorded_kwh ?? 0), 0))} over ${group === 'day' ? mine.length : mine.reduce((a, r) => a + r.days, 0)} day${(group === 'day' ? mine.length : mine.reduce((a, r) => a + r.days, 0)) === 1 ? '' : 's'}</dd>
            ${m.genMonthKwh != null ? `<dt>Vendor · this month</dt><dd>${fmtKwh(m.genMonthKwh)}</dd>` : ''}
            ${m.genYearKwh != null ? `<dt>Vendor · this year</dt><dd>${fmtKwh(m.genYearKwh)}</dd>` : ''}
            ${m.genTotalKwh != null ? `<dt>Vendor · lifetime</dt><dd>${fmtKwh(m.genTotalKwh)}</dd>` : ''}
          </dl>
        </div>
      </details>`;
    }).join('');

    $('view').innerHTML = `<section class="card"><h2>Historical Data</h2><div class="body">
        ${picker}
        <div class="exportrow"><button type="button" class="rangebtn" id="csv"
          title="Download these rows as a CSV file">Download CSV</button>
          <small class="faint">${shownCount} row${shownCount === 1 ? '' : 's'}, as shown</small></div>
        <p class="cardnote" style="margin-top:14px">Built from the samples SolarLens has stored, so the record begins when it
        started collecting — not when the array was installed. Each vendor's own running totals are shown at the
        foot of its section for comparison.</p>
      </div></section>${sections}`;
    bindRange();
    const csvBtn = $('csv');
    if (csvBtn) {
      csvBtn.onclick = () => {
        const { header, body, name } = historyCsv();
        downloadCsv(name, toCsv(header, body));
      };
    }
  }

  // Wire the Historical Data buttons: which system, which grouping, which range.
  function bindRange() {
    for (const b of document.querySelectorAll('.sysbtn')) {
      b.onclick = () => {
        state.historySystem = b.dataset.system;
        try { localStorage.setItem(HISTORY_SYSTEM_KEY, b.dataset.system); } catch { /* remembered for this visit only */ }
        renderHistory();
      };
    }
    for (const b of document.querySelectorAll('.rangebtn[data-days]')) {
      b.onclick = () => { state.history = null; loadHistory(Number(b.dataset.days)); renderHistory(); };
    }
    for (const b of document.querySelectorAll('.groupbtn')) {
      b.onclick = () => {
        const g = b.dataset.group;
        if (g === (state.historyGroup ?? 'day')) return;
        state.historyGroup = g;
        // Months and years need the whole window; going back to days restores
        // the default range rather than leaving a 400-day table on screen.
        const want = g === 'day' ? 30 : ROLLUP_DAYS;
        if (state.historyDays !== want) { state.history = null; loadHistory(want); }
        renderHistory();
      };
    }
  }

  /** Daily yield as bars: the shape of a month reads faster than 30 numbers. */
  function dailyBars(rows, colour, id, group = 'day') {
    // T leaves the unit label its own line: at 18 it sat on top of the highest
    // axis value, and "kWh per year" and "18.4k" printed over each other.
    const W = 1000, H = 210, L = 54, R = 12, T = 34, B = 34;
    const days = [...rows].reverse(); // oldest first, left to right
    const max = Math.max(1, ...days.map((r) => r.yield_kwh ?? 0));
    const bw = (W - L - R) / days.length;
    let out = '';
    for (let i = 0; i <= 4; i++) {
      const v = (max / 4) * i, y = T + (1 - v / max) * (H - T - B);
      out += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" vector-effect="non-scaling-stroke"/>`;
      out += `<text class="axis" x="${L - 8}" y="${y + 4}" text-anchor="end">${v >= 1000 ? (v / 1000).toFixed(1) + 'k' : Math.round(v)}</text>`;
    }
    days.forEach((r, i) => {
      const v = r.yield_kwh ?? 0;
      const h = (v / max) * (H - T - B);
      const x = L + i * bw + bw * 0.15;
      out += `<rect class="daybar" x="${x.toFixed(1)}" y="${(H - B - h).toFixed(1)}" width="${(bw * 0.7).toFixed(1)}" height="${Math.max(1, h).toFixed(1)}" fill="${colour}"><title>${esc(r.day)}: ${esc(fmtKwh(v))}</title></rect>`;
      // A label per day is unreadable past a week, so thin them out.
      const step = Math.ceil(days.length / 10);
      if (i % step === 0 || i === days.length - 1) {
        const label = group === 'year' ? r.day
          : group === 'month' ? new Date(`${r.day}-01T00:00:00Z`).toLocaleDateString(undefined, { month: 'short', year: '2-digit', timeZone: 'UTC' })
          : r.day.slice(5);
        out += `<text class="axis" x="${(x + bw * 0.35).toFixed(1)}" y="${H - 12}" text-anchor="middle">${esc(label)}</text>`;
      }
    });
    out += `<text class="axis unit" x="6" y="14">kWh per ${group}</text>`;
    return `<svg class="combined" id="${id}" viewBox="0 0 ${W} ${H}">${out}</svg>`;
  }

  // ---------- devices ----------
  /**
   * Each device's link over the last week, from /api/devices/history.
   *
   * Fetched only when a view that draws it opens, and at most every five
   * minutes: the rows only move when a logger changes state, and the Devices
   * tab is not somewhere anyone sits for long. The view is drawn once without
   * it and again when it lands, rather than waiting for it.
   */
  const DEVICE_HISTORY_STALE_MS = 5 * 60 * 1000;
  async function loadDeviceHistory() {
    const h = state.deviceHistory;
    if (h && (h.loading || Date.now() - h.at < DEVICE_HISTORY_STALE_MS)) return;
    state.deviceHistory = { loading: true, at: Date.now() };
    try {
      state.deviceHistory = { ...(await api('/api/devices/history?days=7')), at: Date.now() };
    } catch (e) {
      state.deviceHistory = { error: e.message, at: Date.now() };
    }
    if (location.hash === '#/devices') renderDevices();
  }

  /**
   * How long a device can stay silent before its state is no longer known.
   * A device's history gains a row at least hourly while it is being heard from
   * (see recordDeviceSample in src/db.ts), so past an hour and a quarter
   * without one, nobody was listening - the relay off, the poll failing - and
   * the strip says "not heard from" rather than carrying the last state on.
   */
  const LINK_QUIET_S = 3600 + 900;

  /**
   * One device's week as spans of one state each: 'on', 'off', 'alarm',
   * 'unknown' (heard from, status not given) and 'none' (not heard from).
   * Each row's state holds until the next row, or until the quiet limit runs
   * out, whichever comes first.
   */
  function linkSpans(deviceId, hist) {
    const rows = (hist.samples || []).filter((r) => r.device_id === deviceId);
    const from = hist.from, to = hist.now;
    const kind = (st) => (st === 'online' ? 'on' : st === 'offline' ? 'off' : st === 'alarm' ? 'alarm' : 'unknown');
    const spans = [];
    const push = (a, b, k) => {
      if (b <= a) return;
      const last = spans[spans.length - 1];
      if (last && last.k === k && last.b === a) last.b = b; else spans.push({ a, b, k });
    };
    if (!rows.length || rows[0].ts > from) push(from, rows.length ? rows[0].ts : to, 'none');
    rows.forEach((r, i) => {
      const a = Math.max(from, r.ts);
      const end = i + 1 < rows.length ? rows[i + 1].ts : to;
      const heard = Math.min(end, Math.max(a, r.ts + LINK_QUIET_S));
      push(a, heard, kind(r.status));
      push(heard, end, 'none');
    });
    return spans;
  }

  /** "under a minute", "40 min", "2 h 5 min", "3 d 4 h", for a length in seconds. */
  function spanText(sec) {
    const s = Math.max(0, Math.round(sec));
    if (s < 60) return 'under a minute';
    if (s < 3600) return `${Math.round(s / 60)} min`;
    if (s < 86400) return `${Math.floor(s / 3600)} h ${Math.round((s % 3600) / 60)} min`;
    return `${Math.floor(s / 86400)} d ${Math.round((s % 86400) / 3600)} h`;
  }

  /** The week in one line: share of time online, how often and how long it dropped, and silence. */
  function linkSummary(spans, total) {
    const sum = (k) => spans.filter((x) => x.k === k).reduce((a, x) => a + (x.b - x.a), 0);
    const off = spans.filter((x) => x.k === 'off');
    const parts = [`online ${Math.round((sum('on') / total) * 100)}% of the time`];
    if (off.length) {
      const longest = Math.max(...off.map((x) => x.b - x.a));
      parts.push(`offline ${off.length === 1 ? 'once' : `${off.length} times`}, longest ${spanText(longest)}`);
    } else parts.push('never reported offline');
    const none = sum('none');
    if (none > 0) parts.push(`not heard from for ${spanText(none)}`);
    return parts.join(' · ');
  }

  /**
   * The signal across the week: dBm for SolisCloud, on a fixed -100 to -40
   * scale, and SolarMan's percentage on 0 to 100. Fixed rather than fitted,
   * for the reason the charge chart gives: a signal that moved three dBm,
   * drawn edge to edge, looks like one that collapsed. A silence longer than
   * the quiet limit breaks the line.
   */
  function signalChart(deviceId, hist, isDbm) {
    const key = isDbm ? 'signal_dbm' : 'signal_pct';
    const pts = (hist.samples || []).filter((r) => r.device_id === deviceId && r[key] != null);
    if (pts.length < 2) return '';
    const [lo, hi, unit] = isDbm ? [-100, -40, ' dBm'] : [0, 100, '%'];
    const W = 420, H = 96, L = 54, R = 8, T = 6, B = 18;
    const from = hist.from, to = hist.now;
    const x = (t) => L + ((Math.max(from, t) - from) / (to - from)) * (W - L - R);
    const y = (v) => T + (1 - (Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo)) * (H - T - B);
    let out = '';
    for (const v of [lo, (lo + hi) / 2, hi]) {
      out += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/>`;
      out += `<text class="axis" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}${unit}</text>`;
    }
    out += `<text class="axis" x="${L}" y="${H - 3}">7 days ago</text><text class="axis" x="${W - R}" y="${H - 3}" text-anchor="end">now</text>`;
    // Each value holds until the next row, so the line steps rather than
    // slanting between two readings an hour apart.
    let d = '';
    pts.forEach((p, i) => {
      const gap = i > 0 && p.ts - pts[i - 1].ts > LINK_QUIET_S;
      if (i > 0 && !gap) d += `L${x(p.ts).toFixed(1)},${y(pts[i - 1][key]).toFixed(1)}`;
      d += `${i === 0 || gap ? 'M' : 'L'}${x(p.ts).toFixed(1)},${y(p[key]).toFixed(1)}`;
    });
    const last = pts[pts.length - 1];
    if (to - last.ts <= LINK_QUIET_S) d += `L${x(to).toFixed(1)},${y(last[key]).toFixed(1)}`;
    out += `<path d="${d}" fill="none" stroke="var(--solarman)" stroke-width="2" stroke-linejoin="round"/>`;
    const vals = pts.map((p) => p[key]);
    return `<div class="lh-head"><span class="t">Signal</span><span class="p">weakest ${Math.min(...vals)}${unit} · strongest ${Math.max(...vals)}${unit}</span></div>
      <svg class="sig-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Signal strength over the last seven days">${out}</svg>`;
  }

  /** The week's strip, its key, its summary and the signal line, for one device. */
  function linkHistory(d) {
    const hist = state.deviceHistory;
    if (!hist || hist.loading) return '<div class="linkhist"><div class="lh-head"><span class="p">Loading the last seven days…</span></div></div>';
    if (hist.error || !hist.from) return '<div class="linkhist"><div class="lh-head"><span class="p">The link history could not be loaded.</span></div></div>';
    const total = hist.now - hist.from;
    const spans = linkSpans(d.id, hist);
    const label = { on: 'online', off: 'offline', alarm: 'in alarm', unknown: 'status not given', none: 'not heard from' };
    const bar = spans.map((x) => `<i class="${x.k}" style="width:${(((x.b - x.a) / total) * 100).toFixed(3)}%" title="${esc(label[x.k])}: ${esc(when(x.a))} to ${esc(when(x.b))}"></i>`).join('');
    const summary = linkSummary(spans, total);
    return `<div class="linkhist">
      <div class="lh-head"><span class="t">Last 7 days</span><span class="p">${esc(summary)}</span></div>
      <div class="lstrip" role="img" aria-label="Link over the last seven days: ${esc(summary)}">${bar}</div>
      <div class="lh-axis"><span>7 days ago</span><span>now</span></div>
      <div class="lh-key"><span><i class="on"></i>online</span><span><i class="off"></i>offline</span><span><i class="none"></i>not heard from</span></div>
      ${signalChart(d.id, hist, d.signal_dbm != null)}
    </div>`;
  }

  /**
   * One datalogger, as fully as its vendor describes it. The part of a system
   * that fails quietly: the inverter keeps producing while the logger stops
   * talking, so everything it says about its own link is here, with its week.
   */
  function loggerCard(d) {
    const lg = parse(d.logger) || {};
    const owner = (state.latest?.inverters ?? []).find(
      (i) => i.provider === d.provider && (!d.plant_id || d.plant_id === plantIdOf(i)));
    const cls = d.status === 'online' ? 'ok' : d.status === 'alarm' ? 'bad' : 'warn';
    const rows = [
      ['Status', `<span class="pill ${cls}"><i></i>${esc(d.status ?? 'unknown')}</span>`],
      lg.link ? ['Connects by', esc(lg.link)] : null,
      ['Signal', esc(signalLabel(d))],
      lg.signalLevel != null ? ['Signal bars', esc(String(lg.signalLevel))] : null,
      d.upload_cycle_s ? ['Uploads every', esc(spanText(d.upload_cycle_s))] : null,
      ['Last contact', esc(d.last_seen ? `${when(d.last_seen)} · ${ago(d.last_seen)}` : '—')],
      lg.uptimeS != null ? ['Running since restart', esc(spanText(lg.uptimeS))] : null,
      lg.workingS != null ? ['Working in total', esc(spanText(lg.workingS))] : null,
      d.model ? ['Model', esc(d.model)] : null,
      d.firmware ? ['Firmware', esc(d.firmware), true] : null,
      d.sn ? ['Serial', esc(d.sn), true] : null,
      lg.manufacturedAt ? ['Made', esc(fmtDate(lg.manufacturedAt))] : null,
      d.commissioned_at ? ['First connected', esc(fmtDate(d.commissioned_at))] : null,
      d.warranty_until ? ['Warranty to', esc(fmtDate(d.warranty_until))] : null,
    ].filter(Boolean);
    const body = rows.map(([k, v, mono]) => `<dt>${esc(k)}</dt><dd class="${mono ? 'mono' : ''}">${v}</dd>`).join('');
    return `<section class="card logger"><h3>Datalogger · ${esc(owner?.name ?? providerName(d.provider))}</h3><div class="body">
      <dl class="kv">${body}</dl>${linkHistory(d)}</div></section>`;
  }

  function renderDevices() {
    if (!state.devices.length) {
      $('view').innerHTML = `<div class="card"><div class="empty">No hardware recorded yet. The relay agent fills this in — run <code>npm run relay:solis</code>.</div></div>`;
      return;
    }
    const row = (d) => {
      const cls = d.status === 'online' ? 'ok' : d.status === 'alarm' ? 'bad' : 'warn';
      const strings = parse(d.strings);
      const owner = (state.latest?.inverters ?? []).find(
        (i) => i.provider === d.provider && (!d.plant_id || d.plant_id === plantIdOf(i)));
      const offline = d.status === 'offline' || !!owner?.offline;
      return `<tr>
        <td><span class="pill ${cls}"><i></i>${esc(d.status ?? 'unknown')}</span></td>
        <td><div class="dev-name">${esc(d.name || d.kind)}</div>
            <div class="dev-meta">${esc(providerName(d.provider))} · ${esc(d.kind)}</div></td>
        <td class="mono">${esc(d.sn ?? '—')}</td>
        <td>${esc(d.model ?? '—')}</td>
        <td class="mono">${esc(d.firmware ?? '—')}</td>
        <td>${d.kind === 'datalogger' ? esc(signalLabel(d)) : (d.rated_power_w ? fmtWs(d.rated_power_w) : '—')}</td>
        <td>${d.last_seen ? esc(ago(d.last_seen)) : '—'}</td>
        <td>${esc(stringsLabel(strings, offline) ?? (d.kind === 'inverter' ? 'none' : '—'))}</td>
        <td>${d.temp_c != null ? `${d.temp_c} °C` : '—'}</td>
      </tr>`;
    };
    loadDeviceHistory();
    const loggers = state.devices.filter((d) => d.kind === 'datalogger');
    const loggerCards = loggers.length ? `<div class="loggers">${loggers.map(loggerCard).join('')}</div>` : '';
    $('view').innerHTML = `${loggerCards}<section class="card"><h2>Hardware</h2><div class="tablewrap" tabindex="0" role="region" aria-label="Table, scrolls sideways">
      <table class="devices">
        <thead><tr><th>Status</th><th>Device</th><th>Serial</th><th>Model</th><th>Firmware</th>
          <th>Rated / signal</th><th>Last contact</th><th>PV strings</th><th>Temp</th></tr></thead>
        <tbody>${state.devices.map(row).join('')}</tbody>
      </table></div></section>${relaysCard()}`;
  }

  /** The SolisCloud relays, each with its login's expiry. Empty when no relay has reported. */
  function relaysCard() {
    const relays = state.health?.relays ?? [];
    if (!relays.length) return '';
    const now = Math.floor(Date.now() / 1000);
    const rows = relays.map((r) => {
      const l = relayLogin(r, now);
      const [cls, text] = l.expired ? ['bad', 'login expired']
        : r.state === 'error' ? ['warn', 'failing']
        : l.soon ? ['warn', 'renew soon']
        : now - r.last_seen > RELAY_QUIET_S ? ['', 'not reporting']
        : ['ok', 'working'];
      const login = l.expired ? 'expired'
        : r.login_expires_at ? `until ${when(r.login_expires_at)} · ${untilText(l.left)}`
        : 'not reported';
      return `<tr>
        <td><span class="pill ${cls}"><i></i>${esc(text)}</span></td>
        <td><div class="dev-name">${esc(r.name)}</div></td>
        <td>${esc(login)}</td>
        <td>${esc(ago(r.last_seen))}</td>
      </tr>`;
    }).join('');
    return `<section class="card relays"><h2>SolisCloud relays</h2><div class="tablewrap" tabindex="0" role="region" aria-label="Table, scrolls sideways">
      <table class="devices">
        <thead><tr><th>Status</th><th>Relay</th><th>SolisCloud login</th><th>Last report</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
      <p class="cardnote" style="margin:12px 20px 18px">A SolisCloud login lasts seven days and cannot renew itself. ${esc(RENEW_HOW)}</p>
    </section>`;
  }

  // ---------- system detail ----------
  function kvCard(title, rows, note) {
    const body = rows.filter(Boolean).map(([k, v, mono]) => `<dt>${esc(k)}</dt><dd class="${mono ? 'mono' : ''}">${v}</dd>`).join('');
    if (!body) return '';
    return `<section class="card"><h3>${esc(title)}</h3><div class="body"><dl class="kv">${body}</dl>` +
      `${note ? `<p class="cardnote">${esc(note)}</p>` : ''}</div></section>`;
  }

  /**
   * The battery's charge across the plant's day, 0 to 100 %.
   *
   * Every sample's state of charge was already stored and served by
   * /api/series; only the live figure was ever drawn, so "did it run flat
   * overnight?" meant opening the vendor app. The axis is fixed at 0-100
   * rather than fitted to the data, because a pack that moved from 94 to 100
   * drawn edge to edge looks like one that went flat and back.
   *
   * A gap of more than half an hour breaks the line instead of joining across
   * it. A straight segment over an outage is a claim about hours nobody
   * measured - the same rule the power curve keeps.
   */
  function socChart(inv, pts, accent) {
    const soc = pts.filter((p) => p.battery_soc != null);
    if (soc.length < 2) return '';
    // Drawn at roughly the width of the card it sits in, so the axis text
    // renders near its real size. The shared chart class assumes a full-width
    // panel: a 1000-unit drawing squeezed into a 300px card set its labels at
    // about five pixels, under a band of empty space the fixed height left.
    const W = 360, H = 130, L = 36, R = 8, T = 8, B = 22;
    const [t0, t1] = dayWindow(inv, soc);
    const x = (t) => L + ((t - t0) / (t1 - t0)) * (W - L - R);
