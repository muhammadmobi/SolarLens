      tempC != null ? ['Temperature', `${tempC.toFixed(1)} °C`] : null,
      m.gridStatus ? ['Grid', esc(String(m.gridStatus).toLowerCase())] : null,
      m.weatherText ? ['Weather', `${esc(m.weatherText)}${m.tempMinC != null && m.tempMaxC != null ? ` · ${Math.round(m.tempMinC)}–${Math.round(m.tempMaxC)} °C` : ''}`] : null,
      m.sunrise && m.sunset ? ['Sun', `${esc(m.sunrise)} – ${esc(m.sunset)}`] : null,
      ['Updated', inv.ts ? `${esc(when(inv.ts))} · ${esc(ago(inv.ts))}` : 'never'],
    ]);

    return {
      header: `<div class="sys-head" style="margin-bottom:18px">
        <div>
          <div class="vendor" style="color:${inkOf(inv)}">${esc(providerName(inv.provider))}</div>
          <div class="sys-name" style="font-size:26px">${esc(inv.name)}</div>
        </div>
        <div style="text-align:right">
          <div class="herolabel">Producing now</div>
          <div class="hero" style="margin:0"><span class="val" style="font-size:40px">${pv}</span><span class="unit">${pu}</span></div>
          ${inv.capacity_w ? `<div class="cap" style="margin:0">of ${fmtWs(inv.capacity_w)} rated</div>` : ''}
        </div>
      </div>`,
      flow: `<section class="card" style="margin-bottom:16px"><div class="body">${flowSvg(inv, m)}</div></section>`,
      blocks: `<div class="blocks">${identity}${link}${live}${counters}${weatherCard(inv)}${moneyCard(inv)}${stringsCard(invDev, accent, st.offline)}${acCard(invDev)}${battery}${diagnostics}</div>${moreInverters(devs, accent, st.offline)}`,
      raw: rawCard(inv),
    };
  }

  /** Wire up the raw-telemetry filters that detailBlocks() just rendered. */
  function bindRawFilters() {
    for (const box of document.querySelectorAll('.rawfilter')) {
      const grid = box.closest('details').querySelector('.rawgrid');
      box.addEventListener('input', () => {
        const q = box.value.trim().toLowerCase();
        for (const el of grid.children) el.hidden = !!q && !el.dataset.k.includes(q);
      });
    }
  }

  /** A system's own page (#/system/<id>), opened by tapping it on the Overview. */
  function renderSystem(id) {
    const inv = (state.latest?.inverters ?? []).find((i) => i.id === id);
    if (!inv) { $('view').innerHTML = `<a class="back" href="#/">← Overview</a><div class="card"><div class="empty">Unknown system.</div></div>`; return; }
    const b = detailBlocks(inv);
    const fav = isFavourite(inv);
    $('view').innerHTML = `<div class="sysbar"><a class="back" href="#/">← Overview</a>
      <button type="button" class="favbtn${fav ? ' on' : ''}" id="favbtn" aria-pressed="${fav}"
        title="Favourites come first on the Overview, in this browser">${fav ? '★ A favourite' : '☆ Add to favourites'}</button></div>${b.header}${b.flow}${b.blocks}${b.raw}`;
    $('favbtn').onclick = () => { toggleFavourite(inv); renderSystem(id); };
    bindRawFilters();
  }

  // ---------- signing in and settings ----------
  /**
   * Signing in, and the owner's Settings.
   *
   * The page itself holds no data, so it is served to anyone; when the Worker
   * answers a read with {error: 'signin'}, the owner has made the dashboard
   * private, and this is what shows instead. Once signed in, a browser stays
   * signed in: the Worker renews its cookies on the way through (see
   * src/auth/sessions.ts), so nothing here ever has to ask again.
   *
   * Every request here is a POST with a JSON body to /auth/*, and every answer
   * is JSON with an `error` to show when it goes wrong.
   */
  async function authPost(path, body = {}) {
    const res = await fetch(path, {
      method: 'POST', credentials: 'same-origin',
      headers: { 'content-type': 'application/json' }, body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      const wait = data.until ? ` Try again after ${when(data.until)}.` : '';
      throw new Error((data.error || `The server said ${res.status}.`) + (res.status === 429 ? wait : ''));
    }
    return data;
  }
  /** A write under /api/ with a JSON body - the owner's cookie is what lets it through. */
  async function apiSend(method, path, body) {
    const res = await fetch(path, {
      method, credentials: 'same-origin',
      headers: body === undefined ? {} : { 'content-type': 'application/json' },
      body: body === undefined ? undefined : JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `The server said ${res.status}.`);
    return data;
  }
  const authGet = async (path) => {
    const res = await fetch(path, { credentials: 'same-origin' });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || `The server said ${res.status}.`);
    return res.json();
  };

  // Passkeys trade in raw bytes; the Worker speaks base64url.
  const b64uBytes = (s) => pushBytes(s);
  const bytesB64u = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const passkeysSupported = () => window.isSecureContext && !!window.PublicKeyCredential && !!navigator.credentials;

  /** Make a passkey on this device for the signed-in owner, and keep it on the server. */
  async function addPasskey(name) {
    const o = await authPost('/auth/passkey/options', { purpose: 'register' });
    const cred = await navigator.credentials.create({ publicKey: {
      ...o,
      challenge: b64uBytes(o.challenge),
      user: { ...o.user, id: b64uBytes(o.user.id) },
      excludeCredentials: (o.excludeCredentials || []).map((c) => ({ ...c, id: b64uBytes(c.id) })),
    } });
    await authPost('/auth/passkey/register', {
      name,
      response: { clientDataJSON: bytesB64u(cred.response.clientDataJSON), attestationObject: bytesB64u(cred.response.attestationObject) },
    });
  }

  /** Sign in with a passkey this device already holds. */
  async function signInWithPasskey() {
    const o = await authPost('/auth/passkey/options', { purpose: 'login' });
    const cred = await navigator.credentials.get({ publicKey: { ...o, challenge: b64uBytes(o.challenge) } });
    await authPost('/auth/passkey/login', {
      id: cred.id,
      response: {
        clientDataJSON: bytesB64u(cred.response.clientDataJSON),
        authenticatorData: bytesB64u(cred.response.authenticatorData),
        signature: bytesB64u(cred.response.signature),
      },
    });
  }

  /** A passkey prompt the person closed is not an error worth a paragraph. */
  const passkeyError = (e) => (e && e.name === 'NotAllowedError' ? 'The passkey prompt was closed or timed out.' : e.message);

  /**
   * Where an app's approval page (/oauth/authorize) sent a signed-out owner
   * to sign in from, to go back to once they have: only ever that page, on this
   * site - never another address a link might carry.
   */
  const approvalNext = () => {
    const next = new URLSearchParams(location.search).get('next');
    return next && next.startsWith('/oauth/authorize?') ? next : null;
  };

  /** Signed in: forget the refusal and draw whatever was asked for - or go back to an app's approval. */
  function signedIn() {
    state.error = null;
    const next = approvalNext();
    if (next) { location.assign(next); return; }
    if (location.hash === '#/signin') location.hash = '#/';
    refresh();
  }

  /**
   * The sign-in form, drawn into `box`: a passkey button where the browser has
   * passkeys, the password, and - folded away - first-time setup or a
   * forgotten password, which both take the setup code.
   */
  function signInForm(box, st) {
    const expired = new URLSearchParams(location.search).get('link') === 'expired';
    box.innerHTML = `
      ${expired ? '<p class="authnote">That share link has run out or was taken back. Ask for a new one, or sign in.</p>' : ''}
      ${st.passkeys && passkeysSupported() ? '<button type="button" class="authbtn primary" id="pk-in">Sign in with a passkey</button>' : ''}
      ${st.password ? `<form class="authform" id="pw-form">
        <label>Password<input type="password" id="pw" autocomplete="current-password" required></label>
        <button type="submit" class="authbtn">Sign in</button>
      </form>` : ''}
      <details class="authmore" ${!st.password && !st.passkeys ? 'open' : ''}>
        <summary>${st.password || st.passkeys ? 'Forgot your password?' : 'Set up sign-in'}</summary>
        <form class="authform" id="setup-form">
          <p class="cardnote">The setup code is the API token this dashboard was deployed with (<code>API_TOKEN</code>, in its secrets).
            ${st.password || st.passkeys ? 'Setting a new password signs every other device out.' : 'You can add a passkey once you are in, and skip the password.'}</p>
          <label>Setup code<input type="password" id="setup-code" autocomplete="off" required></label>
          <label>New password <small>at least 12 characters${st.password || st.passkeys ? '' : ', or leave empty to use passkeys only'}</small>
            <input type="password" id="setup-pw" autocomplete="new-password" minlength="12"></label>
          <button type="submit" class="authbtn">${st.password || st.passkeys ? 'Set a new password' : 'Set up'}</button>
        </form>
      </details>
      <p class="autherr" id="auth-err" role="alert"></p>`;
    const err = (m) => { $('auth-err').textContent = m; };
    if ($('pk-in')) $('pk-in').onclick = async () => {
      try { await signInWithPasskey(); signedIn(); } catch (e) { err(passkeyError(e)); }
    };
    if ($('pw-form')) $('pw-form').onsubmit = async (ev) => {
      ev.preventDefault();
      try { await authPost('/auth/login', { password: $('pw').value }); signedIn(); } catch (e) { err(e.message); }
    };
    $('setup-form').onsubmit = async (ev) => {
      ev.preventDefault();
      const pw = $('setup-pw').value;
      try {
        await authPost('/auth/setup', { code: $('setup-code').value, password: pw ? pw : null });
        location.hash = '#/settings';
        signedIn();
      } catch (e) { err(e.message); }
    };
  }

  /** The whole page, when the dashboard is private and this browser is not signed in. */
  async function renderSignIn() {
    $('view').innerHTML = `<section class="card authcard"><h2>Sign in</h2><div class="body">
      <p>This dashboard is private. Sign in once on this device and it stays signed in.</p>
      <div id="signin-box"><p class="cardnote">Loading…</p></div></div></section>`;
    try {
      const st = await authGet('/auth/status');
      if ($('signin-box')) signInForm($('signin-box'), st);
    } catch (e) {
      if ($('signin-box')) $('signin-box').innerHTML = `<p class="autherr">${esc(e.message)}</p>`;
    }
  }

  const SHARE_DAYS = [['1', 'a day'], ['7', 'a week'], ['30', 'a month'], ['', 'until I take it back']];

  /**
   * Settings: for the owner, the switch that makes the dashboard private, the
   * passkeys, the password, every signed-in device and every share link. For
   * someone else, what they need: how to sign in, or that the dashboard was
   * shared with them.
   */
  async function renderSettings(note = '') {
    const view = $('view');
    view.innerHTML = '<section class="card"><h2>Settings</h2><div class="body"><p class="cardnote">Loading…</p></div></section>';
    let st;
    try { st = await authGet('/auth/status'); } catch (e) {
      view.innerHTML = `<section class="card"><h2>Settings</h2><div class="body"><p class="autherr">${esc(e.message)}</p></div></section>`;
      return;
    }
    if (location.hash !== '#/settings') return;
    if (!st.configured) {
      view.innerHTML = `<section class="card"><h2>Settings</h2><div class="body"><p>Sign-in is not available on this server: it has no <code>API_TOKEN</code>. The README says how to set one.</p></div></section>`;
      return;
    }
    if (st.role === 'viewer') {
      view.innerHTML = `<section class="card authcard"><h2>Settings</h2><div class="body">
        <p>This dashboard was shared with you to view. Its owner can take the link back at any time.</p>
        <button type="button" class="authbtn" id="signout">Sign out of this device</button></div></section>`;
      $('signout').onclick = async () => { await authPost('/auth/logout').catch(() => {}); location.reload(); };
      return;
    }
    if (st.role !== 'owner') {
      view.innerHTML = `<section class="card authcard"><h2>Sign in</h2><div class="body">
        <p>Settings are for the owner. ${st.password || st.passkeys ? 'Sign in to change them.' : 'Nobody has set up sign-in yet: the setup code starts it.'}</p>
        <div id="signin-box"></div></div></section>`;
      signInForm($('signin-box'), st);
      return;
    }

    let s;
    try { s = await authGet('/auth/settings'); } catch (e) {
      view.innerHTML = `<section class="card"><h2>Settings</h2><div class="body"><p class="autherr">${esc(e.message)}</p></div></section>`;
      return;
    }
    // The places alerts are posted to: the owner's alone, like this page.
    const chans = await authGet('/api/settings/channels').catch(() => null);
    // The AI apps connected to the MCP server, and its address.
    const apps = await authGet('/api/settings/apps').catch(() => null);
    if (location.hash !== '#/settings') return;
    const canLock = s.password || s.passkeys.length;
    const devices = s.devices.map((d) => `<tr>
        <td><div class="dev-name">${esc(d.label || 'A browser')}${d.this ? ' <span class="pill ok"><i></i>this device</span>' : ''}</div>
            <div class="dev-meta">${d.role === 'owner' ? 'you' : 'shared, view only'}</div></td>
        <td>${esc(ago(d.last_seen_at))}</td>
        <td>${esc(fmtDate(d.created_at))}</td>
        <td>${d.this ? '' : `<button type="button" class="rangebtn" data-revoke="${esc(d.id)}">Sign out</button>`}</td>
      </tr>`).join('');
    const passkeys = s.passkeys.length ? s.passkeys.map((k) => `<li><span><strong>${esc(k.name || 'Passkey')}</strong>
        <small class="faint">added ${esc(fmtDate(k.created_at))}${k.last_used_at ? ` · last used ${esc(ago(k.last_used_at))}` : ' · not used yet'}</small></span>
        <button type="button" class="rangebtn" data-unkey="${esc(k.id)}">Remove</button></li>`).join('')
      : '<li><span class="faint">None yet.</span></li>';
    const shares = s.shares.length ? s.shares.map((x) => `<li><span><strong>${esc(x.name || 'Unnamed link')}</strong>
        <small class="faint">made ${esc(fmtDate(x.created_at))} · ${x.expires_at ? `runs out ${esc(fmtDate(x.expires_at))}` : 'until taken back'} · ${x.devices} ${x.devices === 1 ? 'device' : 'devices'} using it</small></span>
        <button type="button" class="rangebtn" data-unshare="${esc(x.id)}">Take back</button></li>`).join('')
      : '<li><span class="faint">No links out.</span></li>';

    view.innerHTML = `<div class="stack settings">
      ${note ? `<p class="authnote" role="status">${esc(note)}</p>` : ''}
      ${approvalNext() ? `<p class="authnote">You are signed in. <a href="${esc(approvalNext())}">Go back to connecting the app</a>.</p>` : ''}
      <section class="card"><h2>Who can see this dashboard</h2><div class="body">
        <label class="switchrow"><input type="checkbox" id="req" ${s.required ? 'checked' : ''} ${canLock || s.required ? '' : 'disabled'}>
          <span><strong>Require sign-in to view</strong>
          <small class="faint">${s.required ? 'On: only you, and anyone you share a link with, can see the readings.'
            : canLock ? 'Off: anyone with the address can see the readings, as before 3.0. Nothing identifying is shown either way.'
              : 'Add a passkey or set a password first, so you cannot lock yourself out.'}</small></span></label>
        <p class="cardnote">The relays, phone notifications and the status check keep working either way.</p>
      </div></section>

      <section class="card"><h2>Tariff</h2><div class="body">
        <p class="cardnote">What electricity costs you, so the dashboard can say what the sun has saved and the CO₂ it has avoided. Everyone who can see the dashboard sees the savings.</p>
        <form class="authform" id="tariff-form">
          <label>Currency <small>a three-letter code, such as PKR, EUR or GBP</small>
            <input id="t-cur" required maxlength="3" autocapitalize="characters" pattern="[A-Za-z]{3}" value="${esc(state.tariff?.currency ?? '')}"></label>
          <label>A kWh bought from the grid costs
            <input id="t-imp" type="number" inputmode="decimal" step="any" min="0" max="1000" required value="${esc(state.tariff?.importPrice ?? '')}"></label>
          <label class="switchrow"><input type="checkbox" id="t-net" ${state.tariff?.netMetering ? 'checked' : ''}>
            <span><strong>Net metering</strong><small class="faint">Each kWh sent to the grid cancels one bought, so it is worth the same.</small></span></label>
          <label id="t-exp-row" ${state.tariff?.netMetering ? 'hidden' : ''}>A kWh sold to the grid earns
            <input id="t-exp" type="number" inputmode="decimal" step="any" min="0" max="1000" value="${esc(state.tariff?.exportPrice ?? 0)}"></label>
          <label>CO₂ per kWh from the grid <small>kg; about 0.4 is a typical mix, lower where the grid is mostly hydro, nuclear or wind</small>
            <input id="t-co2" type="number" inputmode="decimal" step="any" min="0" max="2" required value="${esc(state.tariff?.co2KgPerKwh ?? 0.4)}"></label>
          <div class="formrow"><button type="submit" class="authbtn">Save the tariff</button>
            ${state.tariff ? '<button type="button" class="rangebtn" id="t-clear">Clear it, and show no money</button>' : ''}</div>
        </form>
      </div></section>

      <section class="card"><h2>Groups</h2><div class="body">
        <p class="cardnote">Sort the systems into groups - "Home", "Farm" - and the Overview shows each group under its own heading, with its own total. Everyone who can see the dashboard sees them. Leave a name blank for a system in no group.</p>
        <form class="authform" id="groups-form">
          ${(state.latest?.inverters ?? []).map((inv) => `<label>${esc(inv.name)}
            <input data-group-of="${esc(inv.id)}" list="group-names" maxlength="40" value="${esc(groupOf(inv) ?? '')}" placeholder="No group"></label>`).join('') || '<p class="cardnote">No systems yet.</p>'}
          <datalist id="group-names">${groupNames().map((g) => `<option value="${esc(g)}"></option>`).join('')}</datalist>
          ${state.latest?.inverters?.length ? '<div class="formrow"><button type="submit" class="authbtn">Save the groups</button></div>' : ''}
        </form>
      </div></section>

      ${channelsCard(chans)}
      ${homeAssistantCard(s)}
      ${appsCard(apps)}

      <section class="card"><h2>Passkeys</h2><div class="body">
        <p class="cardnote">Sign in with a fingerprint, a face or the device PIN. Nothing that could sign you in is stored on the server.</p>
        <ul class="authlist">${passkeys}</ul>
        ${passkeysSupported() ? `<form class="authform inline" id="pk-add"><label>Name<input id="pk-name" placeholder="${esc(navigator.userAgent.includes('Android') ? 'My phone' : 'This computer')}" maxlength="60"></label>
          <button type="submit" class="authbtn">Add a passkey on this device</button></form>`
          : '<p class="cardnote">This browser cannot make passkeys.</p>'}
      </div></section>

      <section class="card"><h2>Password</h2><div class="body">
        <form class="authform" id="pw-change">
          ${s.password ? '<label>Current password<input type="password" id="pw-cur" autocomplete="current-password" required></label>' : '<p class="cardnote">No password is set: you sign in with passkeys.</p>'}
          <label>${s.password ? 'New password' : 'Set a password'} <small>at least 12 characters</small><input type="password" id="pw-new" autocomplete="new-password" minlength="12" required></label>
          <button type="submit" class="authbtn">${s.password ? 'Change password' : 'Set password'}</button>
        </form>
        ${s.password && s.passkeys.length ? '<button type="button" class="rangebtn" id="pw-remove">Remove the password, and use passkeys only</button>' : ''}
      </div></section>

      <section class="card"><h2>Signed-in devices</h2><div class="tablewrap" tabindex="0" role="region" aria-label="Signed-in devices, scrolls sideways">
        <table class="devices"><thead><tr><th>Device</th><th>Last used</th><th>Signed in</th><th></th></tr></thead><tbody>${devices}</tbody></table></div>
        <div class="body"><button type="button" class="rangebtn" id="revoke-others" ${s.devices.length > 1 ? '' : 'disabled'}>Sign out every other device</button>
          <button type="button" class="rangebtn" id="signout">Sign out of this device</button></div>
      </section>

      <section class="card"><h2>Share to view</h2><div class="body">
        <p class="cardnote">A link that lets someone see the dashboard, and change nothing. Taking it back signs out everyone who used it.</p>
        <ul class="authlist">${shares}</ul>
        <form class="authform inline" id="share-add">
          <label>For<input id="share-name" placeholder="Family" maxlength="60"></label>
          <label>Good for<select id="share-days">${SHARE_DAYS.map(([v, t]) => `<option value="${v}">${t}</option>`).join('')}</select></label>
          <button type="submit" class="authbtn">Make a link</button>
        </form>
        <div id="share-new"></div>
      </div></section>
      <p class="autherr" id="auth-err" role="alert"></p>
    </div>`;

    const err = (m) => { $('auth-err').textContent = m; };
    const redo = (msg) => renderSettings(msg);
    const act = (fn) => async (ev) => { ev?.preventDefault?.(); try { await fn(ev); } catch (e) { err(passkeyError(e)); } };

    $('req').onchange = act(async () => redo((await authPost('/auth/settings/required', { on: $('req').checked })).required
      ? 'The dashboard is private now.' : 'The dashboard is open to anyone with its address again.'));
    $('groups-form').onsubmit = act(async () => {
      const groups = Object.fromEntries([...view.querySelectorAll('[data-group-of]')].map((i) => [i.dataset.groupOf, i.value.trim()]));
      state.groups = (await apiSend('PUT', '/api/settings/groups', { groups })).groups;
      redo('Groups saved. The Overview shows each under its own heading.');
    });
    // Alerts elsewhere: which fields show follows the kind chosen.
    if ($('chan-kind')) $('chan-kind').onchange = () => {
      const k = $('chan-kind').value;
      for (const el of view.querySelectorAll('[data-kind]')) el.hidden = el.dataset.kind !== k;
      for (const el of view.querySelectorAll('[data-kind-note]')) el.hidden = el.dataset.kindNote !== k;
    };
    if ($('chan-add')) $('chan-add').onsubmit = act(async () => {
      const kind = $('chan-kind').value;
      const v = (id) => $(id).value.trim();
      const made = await apiSend('POST', '/api/settings/channels', {
        kind, name: v('chan-name'), alerts: $('chan-alerts').checked, weekly: $('chan-weekly').checked,
        ...(kind === 'ntfy' ? { server: v('ntfy-server'), topic: v('ntfy-topic'), token: v('ntfy-token') }
          : kind === 'telegram' ? { token: v('tg-token'), chat: v('tg-chat') }
            : { url: v(kind === 'discord' ? 'dc-url' : 'wh-url') }),
      });
      redo(made.test && made.test.ok === false ? `Added, but the test did not arrive: ${made.test.error}.` : 'Added, and a test is on its way: check it arrived.');
    });
    for (const b of view.querySelectorAll('[data-chan]')) b.onchange = act(async () => {
      try {
        await apiSend('PATCH', `/api/settings/channels/${encodeURIComponent(b.dataset.chan)}`, { [b.dataset.what]: b.checked });
      } catch (e) { b.checked = !b.checked; throw e; }
      redo('Saved.');
    });
    for (const b of view.querySelectorAll('[data-chan-test]')) b.onclick = act(async () => {
      const r = await apiSend('POST', `/api/settings/channels/${encodeURIComponent(b.dataset.chanTest)}/test`);
      redo(r.ok === false ? `The test did not arrive: ${r.error}.` : 'Test sent: check it arrived.');
    });
    for (const b of view.querySelectorAll('[data-chan-remove]')) b.onclick = act(async () => {
      await apiSend('DELETE', `/api/settings/channels/${encodeURIComponent(b.dataset.chanRemove)}`);
      redo('Removed.');
    });
    if ($('summary-now')) $('summary-now').onclick = act(async () => {
      const r = await apiSend('POST', '/api/settings/summary');
      redo(`Last week's summary sent to ${r.sent} of ${r.of} ${r.of === 1 ? 'place' : 'places'}.`);
    });
    // Home Assistant: a read-only token is a share link, made here and shown once.
    if ($('ha-token')) $('ha-token').onclick = act(async () => {
      const made = await authPost('/auth/settings/shares', { name: 'Home Assistant', days: null });
      const token = made.url.slice(made.url.lastIndexOf('/s/') + 3);
      await renderSettings('Token made. It is in the configuration below, and shown only this once: copy it now.');
      if ($('ha-yaml')) $('ha-yaml').textContent = haYaml(token);
    });
    // Connected apps: copy the address; disconnect one.
    if ($('mcp-copy')) $('mcp-copy').onclick = async () => {
      try { await navigator.clipboard.writeText($('mcp-url').value); $('mcp-copy').textContent = 'Copied'; } catch { $('mcp-url').select(); }
    };
    for (const b of view.querySelectorAll('[data-unapp]')) b.onclick = act(async () => {
      await apiSend('DELETE', `/api/settings/apps/${encodeURIComponent(b.dataset.unapp)}`);
      redo('Disconnected. It can no longer read anything here.');
    });
    $('ha-copy').onclick = async () => {
      try { await navigator.clipboard.writeText($('ha-yaml').textContent); $('ha-copy').textContent = 'Copied'; } catch {
        // No clipboard: select it, for the keyboard.
        const range = document.createRange();
        range.selectNodeContents($('ha-yaml'));
        getSelection().removeAllRanges();
        getSelection().addRange(range);
      }
    };
    $('t-net').onchange = () => { $('t-exp-row').hidden = $('t-net').checked; };
    $('tariff-form').onsubmit = act(async () => {
      const net = $('t-net').checked;
      const imp = Number($('t-imp').value);
      state.tariff = (await apiSend('PUT', '/api/settings/tariff', {
        currency: $('t-cur').value.trim().toUpperCase(), importPrice: imp,
        exportPrice: net ? imp : Number($('t-exp').value || 0), netMetering: net, co2KgPerKwh: Number($('t-co2').value),
      })).tariff;
      redo('Tariff saved. Savings show on each system\'s page and under Historical Data.');
    });
    if ($('t-clear')) $('t-clear').onclick = act(async () => {
      state.tariff = (await apiSend('DELETE', '/api/settings/tariff')).tariff;
      redo('Tariff cleared. No money is shown until it is set again.');
    });
    if ($('pk-add')) $('pk-add').onsubmit = act(async () => { await addPasskey($('pk-name').value.trim()); redo('Passkey added.'); });
    $('pw-change').onsubmit = act(async () => {
      await authPost('/auth/settings/password', { current: $('pw-cur') ? $('pw-cur').value : undefined, next: $('pw-new').value });
      redo('Password saved.');
    });
    if ($('pw-remove')) $('pw-remove').onclick = act(async () => {
      const current = $('pw-cur').value;
      if (!current) { err('Type your current password above first.'); return; }
      await authPost('/auth/settings/password', { current, next: null });
      redo('Password removed. Sign in with a passkey from now on.');
    });
    $('revoke-others').onclick = act(async () => {
      const n = (await authPost('/auth/settings/devices/revoke', { others: true })).signedOut;
      redo(`Signed out ${n} ${n === 1 ? 'device' : 'devices'}.`);
    });
    $('signout').onclick = act(async () => { await authPost('/auth/logout'); location.hash = '#/'; location.reload(); });
    for (const b of view.querySelectorAll('[data-revoke]')) b.onclick = act(async () => { await authPost('/auth/settings/devices/revoke', { id: b.dataset.revoke }); redo('Signed out.'); });
    for (const b of view.querySelectorAll('[data-unkey]')) b.onclick = act(async () => { await authPost('/auth/settings/passkeys/remove', { id: b.dataset.unkey }); redo('Passkey removed.'); });
    for (const b of view.querySelectorAll('[data-unshare]')) b.onclick = act(async () => { await authPost('/auth/settings/shares/revoke', { id: b.dataset.unshare }); redo('Link taken back.'); });
    $('share-add').onsubmit = act(async () => {
      const days = $('share-days').value;
      const made = await authPost('/auth/settings/shares', { name: $('share-name').value.trim(), days: days ? Number(days) : null });
      await renderSettings('Link made. It is shown once - copy it now.');
      const box = $('share-new');
      if (!box) return;
      box.innerHTML = `<div class="sharelink"><input readonly id="share-url" value="${esc(made.url)}" aria-label="The new share link">
        <button type="button" class="authbtn" id="share-copy">Copy</button></div>`;
      $('share-copy').onclick = async () => {
        try { await navigator.clipboard.writeText(made.url); $('share-copy').textContent = 'Copied'; } catch { $('share-url').select(); }
      };
    });
  }

  // ---------- alerts elsewhere and Home Assistant ----------
  /**
   * Two of Settings' cards. "Alerts elsewhere" lists the places the Worker
   * posts alerts and the weekly summary to - ntfy, Telegram, Discord, any
   * webhook (src/channels.ts) - and adds one, posting a test to it at once. What
   * posting takes is typed once and never shown again: the Worker keeps it
   * encrypted and sends back only a hint of where it goes.
   *
   * "Home Assistant" writes the configuration that reads /api/sensors into
   * sensors, with this dashboard's address and systems filled in. When the
   * dashboard is private it also makes Home Assistant a token: a share link
   * that can only read, sent as a bearer token and taken back like any other.
   */
  const CHANNEL_KINDS = [
    ['ntfy', 'ntfy', 'A notification on a phone or a computer, through ntfy.sh or a server of your own: install the ntfy app and subscribe to the topic you choose here.'],
    ['telegram', 'Telegram', 'A message from a bot of your own, to you or to a group. @BotFather makes the bot and gives you its token.'],
    ['discord', 'Discord', "A post in a channel, through a webhook made in that channel's settings, under Integrations."],
    ['webhook', 'Webhook', "JSON posted to any address: a Home Assistant automation's webhook trigger, for one."],
  ];
  const kindName = (k) => (CHANNEL_KINDS.find(([id]) => id === k) ?? [k, k])[1];

  /** How a channel's last post went, in a few words. */
  function channelState(ch) {
    if (ch.failures && ch.last_error) {
      return `<span class="chanbad">failing${ch.failures > 1 ? ` ${ch.failures} times in a row` : ''}: ${esc(ch.last_error)}</span>`;
    }
    return ch.last_ok_at ? `delivered ${esc(ago(ch.last_ok_at))}` : 'nothing sent yet';
  }

  function channelsCard(chans) {
    if (!chans) return '';
    const list = chans.channels ?? [];
    const full = list.length >= (chans.max ?? 5);
    const items = list.map((ch) => `<li class="chan">
        <span><strong>${esc(ch.name || kindName(ch.kind))}</strong>
          <small class="faint">${esc(kindName(ch.kind))} · ${esc(ch.label)} · ${channelState(ch)}</small></span>
        <span class="chanopts">
          <label><input type="checkbox" data-chan="${esc(ch.id)}" data-what="alerts" ${ch.alerts ? 'checked' : ''}> Alerts</label>
          <label><input type="checkbox" data-chan="${esc(ch.id)}" data-what="weekly" ${ch.weekly ? 'checked' : ''}> Weekly summary</label>
          <button type="button" class="rangebtn" data-chan-test="${esc(ch.id)}">Send a test</button>
          <button type="button" class="rangebtn" data-chan-remove="${esc(ch.id)}">Remove</button>
        </span></li>`).join('');
    // Typed once and never shown again, so no password manager is invited to keep them.
    const field = (id, label, hint, attrs = '') => `<label>${label}${hint ? ` <small>${hint}</small>` : ''}<input id="${id}" autocomplete="off" spellcheck="false" ${attrs}></label>`;
    return `<section class="card"><h2>Alerts elsewhere</h2><div class="body">
      <p class="cardnote">The same alerts a phone gets - a system that stops, a fault, a SolisCloud login running out - and a summary every Monday morning, posted where you already look. No email.</p>
      ${chans.ready ? '' : '<p class="autherr">This server has no API_TOKEN, which these need: what posting takes is kept encrypted with a key derived from it.</p>'}
      <ul class="authlist">${items || '<li><span class="faint">Nowhere yet.</span></li>'}</ul>
      ${list.some((c) => c.weekly) ? '<button type="button" class="rangebtn" id="summary-now">Send last week\'s summary now</button>' : ''}
      ${full ? `<p class="cardnote">That is the most there can be (${chans.max}): remove one to add another.</p>` : `
      <details class="authmore" ${list.length ? '' : 'open'}><summary>Add a place</summary>
      <form class="authform" id="chan-add">
        <label>Where<select id="chan-kind">${CHANNEL_KINDS.map(([id, name]) => `<option value="${id}">${name}</option>`).join('')}</select></label>
        ${CHANNEL_KINDS.map(([id, , note]) => `<p class="cardnote" data-kind-note="${id}" ${id === 'ntfy' ? '' : 'hidden'}>${esc(note)}</p>`).join('')}
        <fieldset class="kindfields" data-kind="ntfy">
          ${field('ntfy-server', 'Server', 'ntfy.sh, or your own', 'value="https://ntfy.sh" inputmode="url"')}
          ${field('ntfy-topic', 'Topic', 'on ntfy.sh anyone who knows a topic can read it, so make it long and hard to guess', 'maxlength="64"')}
          ${field('ntfy-token', 'Access token', 'only for a topic that needs one')}
        </fieldset>
        <fieldset class="kindfields" data-kind="telegram" hidden>
          ${field('tg-token', 'Bot token', 'from @BotFather')}
          ${field('tg-chat', 'Chat id', "a number - a group's starts with a minus - or a @channel name")}
        </fieldset>
        <fieldset class="kindfields" data-kind="discord" hidden>${field('dc-url', 'Webhook address', 'https://discord.com/api/webhooks/…', 'inputmode="url"')}</fieldset>
        <fieldset class="kindfields" data-kind="webhook" hidden>${field('wh-url', 'Address', "https only; Home Assistant's looks like https://…/api/webhook/…", 'inputmode="url"')}</fieldset>
        ${field('chan-name', 'Name', 'optional', 'maxlength="40" placeholder="My phone"')}
        <label class="switchrow"><input type="checkbox" id="chan-alerts" checked><span><strong>Alerts</strong><small class="faint">Each told once, when it happens.</small></span></label>
        <label class="switchrow"><input type="checkbox" id="chan-weekly" checked><span><strong>Weekly summary</strong><small class="faint">Mondays at 08:00: last week's energy against the week before, the savings and the faults.</small></span></label>
        <div class="formrow"><button type="submit" class="authbtn">Add, and send a test</button></div>
      </form></details>`}
      <p class="cardnote">A token or an address is kept encrypted and never shown again: each place above shows only a hint of where it posts. The messages name your systems and their faults.</p>
    </div></section>`;
  }

  /** A name inside a YAML double-quoted string. */
  const yamlText = (t) => String(t ?? '').replace(/[\\"]/g, (c) => `\\${c}`);

  /**
   * Home Assistant's configuration for this dashboard: the fleet's power and
   * energy, and each system's power, energy today and battery. `token` is
   * the bearer token to fill in, null for a placeholder when the dashboard is
   * private and none has been made, or undefined when none is needed.
   */
  function haYaml(token) {
    const sensor = (name, id, path, unit, cls, stateClass) => [
      `      - name: "${yamlText(name)}"`,
      `        unique_id: ${id}`,
      `        value_template: "{{ value_json.${path} }}"`,
      `        unit_of_measurement: "${unit}"`,
      `        device_class: ${cls}`,
      `        state_class: ${stateClass}`,
    ];
    const lines = [
      '# configuration.yaml: SolarLens, read every five minutes',
      'rest:',
      `  - resource: ${location.origin}/api/sensors`,
      '    scan_interval: 300',
      ...(token === undefined ? [] : ['    headers:', `      Authorization: "Bearer ${token ?? '<make a token with the button above>'}"`]),
      '    sensor:',
      ...sensor('SolarLens power', 'solarlens_power', 'power_w', 'W', 'power', 'measurement'),
      ...sensor('SolarLens energy today', 'solarlens_today', 'today_kwh', 'kWh', 'energy', 'total_increasing'),
      ...sensor('SolarLens energy', 'solarlens_total', 'total_kwh', 'kWh', 'energy', 'total_increasing'),
    ];
    for (const inv of state.latest?.inverters ?? []) {
      lines.push(...sensor(`${inv.name} power`, `solarlens_${inv.id}_power`, `systems.${inv.id}.power_w`, 'W', 'power', 'measurement'));
      lines.push(...sensor(`${inv.name} energy today`, `solarlens_${inv.id}_today`, `systems.${inv.id}.today_kwh`, 'kWh', 'energy', 'total_increasing'));
      if (inv.battery_soc != null) lines.push(...sensor(`${inv.name} battery`, `solarlens_${inv.id}_battery`, `systems.${inv.id}.battery_soc`, '%', 'battery', 'measurement'));
    }
    return lines.join('\n');
  }

  function homeAssistantCard(s) {
    return `<section class="card"><h2>Home Assistant</h2><div class="body">
      <p class="cardnote">Home Assistant can show every figure here as a sensor - power, energy, battery - and use them in its Energy dashboard. Paste this into its configuration.yaml and restart it; docs/home-assistant.md in the repository says more.</p>
      ${s.required ? `<p class="cardnote">The dashboard is private, so Home Assistant needs a token of its own: a share link that can only read. It is listed under Share to view, where taking it back stops it.</p>
        <button type="button" class="authbtn" id="ha-token">Make a token for Home Assistant</button>` : ''}
      <pre class="yaml" id="ha-yaml" tabindex="0" aria-label="Home Assistant configuration">${esc(haYaml(s.required ? null : undefined))}</pre>
      <div class="formrow"><button type="button" class="rangebtn" id="ha-copy" aria-label="Copy the Home Assistant configuration">Copy</button></div>
      <p class="cardnote">For alerts in Home Assistant as well, add a Webhook under Alerts elsewhere, with the address of an automation's webhook trigger.</p>
    </div></section>`;
  }

  /**
   * Connected apps: the AI apps - Claude, an IDE, anything that speaks MCP -
   * the owner has let read SolarLens through its MCP server (src/mcp.ts), and
   * the address to give a new one. An app asks to be connected on its own, and
   * the owner approves it once, on SolarLens's own page (src/oauth.ts).
   */
  function appsCard(apps) {
    if (!apps) return '';
    const items = (apps.apps ?? []).map((a) => `<li><span><strong>${esc(a.name)}</strong>
        <small class="faint">${a.redirect_to ? `answers to ${esc(a.redirect_to)} · ` : ''}connected ${esc(fmtDate(a.connected_at))} · last used ${esc(ago(a.last_used_at))}</small></span>
        <button type="button" class="rangebtn" data-unapp="${esc(a.id)}">Disconnect</button></li>`).join('');
    return `<section class="card"><h2>Connected apps</h2><div class="body">
      <p class="cardnote">AI apps - Claude, an IDE, anything that speaks MCP - can ask SolarLens the same read-only questions as the Ask tab. Give the app this address; it sends you to a page here to approve it, once, and stays connected until you disconnect it.</p>
      <div class="sharelink"><input readonly id="mcp-url" value="${esc(apps.mcp)}" aria-label="The MCP server's address"><button type="button" class="authbtn" id="mcp-copy" aria-label="Copy the MCP address">Copy</button></div>
      <ul class="authlist">${items || '<li><span class="faint">No app connected.</span></li>'}</ul>
      <p class="cardnote">An app can read and nothing more. docs/mcp.md in the repository says how to add SolarLens to Claude and to other apps.</p>
    </div></section>`;
  }

  // ---------- the guide ----------
  //
  // What SolarLens is, what is on each tab, and where to find things - opened
  // from the Guide button (an open book) in the header. A guide is reference, read now and then, so it
  // sits behind an icon rather than taking a tab from the pages used every day.
  // RELEASE is kept equal to package.json's version by a unit test, so the
  // guide never describes a release other than the one it ships with.
  const RELEASE = '2.11.0';

  function renderGuide() {
    const systems = (state.latest?.inverters ?? []).map((inv) => {
      const size = inv.capacity_w ? ` · ${(inv.capacity_w / 1000).toFixed(inv.capacity_w % 1000 ? 1 : 0)} kW` : '';
      // The same test every other page uses, so a battery whose charge figure
      // is missing for the moment is still a battery here too.
      const batt = hasBattery(inv, parse(inv.metrics)) ? ' · with a battery' : '';
      return `<span><strong>${esc(inv.name)}</strong> · ${esc(providerName(inv.provider))}${size}${batt}</span>`;
    }).join('');
    const tab = (href, name) => `<a href="${href}">${name}</a>`;
    const rows = [
      ['See what each system is producing right now', tab('#/', 'Overview')],
      ['Where each system is, on a map (the owner only)', `${tab('#/map', 'Map')}, once you are signed in`],
      ['Whether a system is making what the weather allowed', `the system's page - Against the weather; and the dashed line on its day curve, on ${tab('#/', 'Overview')} and ${tab('#/power', 'Power')}`],
      ['What the sun has saved, and the CO₂ it has avoided', `each system's page - Money and carbon; and ${tab('#/history', 'Historical Data')}, by day, month or year. The owner sets the prices under ${tab('#/settings', 'Settings')}`],
      ['Which system is doing best, for its size', `${tab('#/compare', 'Compare')} - kWh per kWp, today and this month (with two systems or more)`],
      ['Ask anything in words, with follow-ups - statistics, a report, how to do something', `${tab('#/ask', 'Ask')} - every answer shows the figures it came from, and Download keeps it as a page`],
      ['Why was a day low?', `${tab('#/history', 'Historical Data')} - "Why?" next to a low day; or ask on ${tab('#/ask', 'Ask')}`],
      ['Whether a system is slowly making less', `${tab('#/ask', 'Ask')} - Health, checked every Monday`],
      ['A day hour by hour: made against used, and the peaks', `${tab('#/analysis', 'Analysis')} - any of the last seven days, one system or all`],
      ['Put the systems you watch first, or sort them into groups', `the star on a system's page (this browser only); groups are set by the owner under ${tab('#/settings', 'Settings')}`],
      ['Get alerts on ntfy, Telegram or Discord, and a summary every Monday', `${tab('#/settings', 'Settings')} - Alerts elsewhere`],
      ['Ask SolarLens from Claude or another AI app', `${tab('#/settings', 'Settings')} - Connected apps: the MCP address, and each app you have connected`],
      ['Show SolarLens in Home Assistant', `${tab('#/settings', 'Settings')} - Home Assistant`],
      ['See every system on one chart, or hide one', `${tab('#/power', 'Power')} - tap a name in the legend to hide or show it`],

      ["One system's history on its own",`${tab('#/history', 'Historical Data')} - pick the system at the top; All systems shows both`],
      ['Take the figures into a spreadsheet', `${tab('#/history', 'Historical Data')} - Download CSV`],
      ['Know what is wrong right now', `${tab('#/alerts', 'Alerts')} - the number on the tab counts it`],
      ['See past faults, and how long each lasted', `${tab('#/alerts', 'Alerts')} - Fault history, under each system`],
      ['Be told on your phone when something goes wrong', `${tab('#/alerts', 'Alerts')} - Also when this browser is closed`],
      ['Battery charge through the day', `${tab('#/power', 'Power')}, under the hybrid system - Charge today`],
      ['PV strings, voltages, currents, temperature', `${tab('#/power', 'Power')}, under each system`],
      ['Inverter model, firmware, datalogger signal', tab('#/devices', 'Devices')],
      ['Make the dashboard private, and stay signed in', `${tab('#/settings', 'Settings')} (the gear) - Require sign-in to view`],

      ['When each laptop\'s SolisCloud login runs out', `${tab('#/devices', 'Devices')} - SolisCloud relays`],
      ['Every measurement the vendor sent', `${tab('#/power', 'Power')}, under each system - Raw telemetry, with a filter`],
      ['Show it on a wall screen', `📺 at the top - ${tab('#/tv', 'TV mode')}; Esc to leave`],
      ['Light or dark', '🖥️ at the top - follows your device, or pick one'],
      ['Put it on a phone\'s home screen', 'Your browser\'s menu - Add to Home Screen (on an iPhone, the Share button)'],
    ].map(([want, where]) => `<tr><td>${want}</td><td>${where}</td></tr>`).join('');

    $('view').innerHTML = `<div class="guide">
      <section class="card"><h2>Guide<span class="ver">SolarLens ${RELEASE}</span></h2><div class="body">
        <p class="lead">SolarLens puts your solar systems on one page. Each system is watched by a different vendor's cloud,
          SolisCloud or SolarMan; SolarLens reads both every five minutes, keeps every reading in its own database,
          and shows them side by side - in the same units, on the same clock, in each system's own time.</p>
        <p>Nothing here can change an inverter: SolarLens only reads. Anyone with the link can view it, and the vendors'
          account and serial numbers are removed before anything leaves the server.</p>
        ${systems ? `<div class="systems" aria-label="Your systems">${systems}</div>` : ''}
      </div></section>

      <section class="card"><h2>What is new in ${RELEASE}</h2><div class="body"><ul>
        <li><strong>SolisCloud readings arrive again.</strong> SolisCloud moved its plant page in October, and the relay
          now finds the new one. A relay that stops is started again within ten minutes, and the monthly and yearly

      <p class="cardnote">In 2.10: notifications on your phone even with the dashboard closed, SolarMan faults that

      </div></section>

      <section class="card"><h2>The tabs</h2><div class="body"><dl class="tabs">
        <dt>${tab('#/', 'Overview')}</dt>
        <dd>Every system at a glance: what it is producing now, what it has made today, where the power is going -
          the house, the grid, the battery - and today's curve with its peak. Tap a system to open it on its own.</dd>
        <dt>${tab('#/power', 'Power')}</dt>
        <dd>Every system on one chart, plus each system in full, one below the other: energy today, this month, this

      </dl></div></section>

      <section class="card"><h2>Where to find it</h2><div class="tablewrap" tabindex="0" role="region" aria-label="Where to find it, scrolls sideways">
        <table class="find"><thead><tr><th scope="col">I want to</th><th scope="col">Go to</th></tr></thead>
        <tbody>${rows}</tbody></table>
      </div></section>

      <section class="card"><h2>Along the top</h2><div class="body"><ul>
        <li><strong>Producing now, Produced today, Consumed today</strong> - every system added together. A system that
          has gone quiet counts as zero and is named underneath.</li>
        <li><strong>The green dot</strong> says when the page last heard from the server. Amber means it has not for a while.</li>
        <li><strong>Guide</strong> (the open book) this page · <strong>📺</strong> TV mode · <strong>🖥️</strong> light or dark.</li>
      </ul></div></section>

      <section class="card"><h2>Good to know</h2><div class="body"><ul>
        <li><strong>An on-grid system reads offline every night.</strong> Its inverter switches off when the sun goes
          down and SolisCloud reports it offline until morning. That is normal, and it is not announced to your phone.</li>
        <li><strong>SolisCloud's figures come through a relay</strong> - a small program on a laptop, because SolisCloud
          cannot be read from the server directly. If any one relay laptop is on, the figures keep coming; with two on,
          each reading is still stored once.</li>
        <li><strong>A SolisCloud login lasts seven days</strong> and cannot renew itself. The Alerts tab warns two days
          ahead; renew it by double-clicking <code>renew-solis-login.cmd</code> on that laptop.</li>
        <li><strong>Times are each system's own.</strong> A peak "at 12:40" is 12:40 where the panels are, wherever you
          are reading from.</li>
        <li><strong>A figure the vendor did not report is shown as a dash, not a zero,</strong> so a blank never passes
          for "nothing happened".</li>
      </ul></div></section>
    </div>`;
  }

  // ---------- routing ----------
  function route() {
    const hash = location.hash || '#/';
    for (const a of $('nav').children) a.classList.toggle('on', a.getAttribute('href') === hash);
    $('guidebtn').classList.toggle('on', hash === '#/guide');
    $('settingsbtn').classList.toggle('on', hash === '#/settings');
    document.body.classList.remove('ovfit');
    const tv = hash === '#/tv';
    if (document.body.classList.contains('tv') !== tv) {
      document.body.classList.toggle('tv', tv);
      holdScreen(tv);
      schedule();
    }
    // The guide needs no data, so it waits for none and is stopped by no data
    // error: it is the page to read while the rest is still loading, when the
    // feeds are down, or when the server has refused a request.
    if (hash === '#/guide') return renderGuide();
    // Settings works signed out too: it is where the owner signs in and sets up.
    if (hash === '#/settings') return renderSettings();
    if (state.error === 'signin') return renderSignIn();
    if (state.error === 'unauthorized') {
      // Reads are public, so this should not happen. It is kept because a
      // deployment mid-rollout can still answer 401, and a blank page would
      // say nothing about why.
      $('view').innerHTML = `<div class="card"><div class="empty">The server refused this request. If it persists, redeploy.</div></div>`;
      return;
    }
    if (!state.latest) return; // first paint waits for data
    // Compare means nothing with one system, so its tab appears with the second.
    $('comparetab').hidden = (state.latest.inverters?.length ?? 0) < 2;
    // The map is the owner's, and needs a position to show.
    $('maptab').hidden = !(state.locations?.length);
    const sys = hash.match(/^#\/system\/(.+)$/);
    if (sys) return renderSystem(decodeURIComponent(sys[1]));
    if (tv) return renderTv();
    if (hash === '#/devices') return renderDevices();
    if (hash === '#/alerts') return renderAlerts();
    if (hash === '#/history') return renderHistory();
    // The Flow tab is gone: its diagrams live on the overview now, but an
    // old bookmark should still land somewhere sensible.
    if (hash === '#/flow') { location.replace('#/'); return overviewRoute(); }
    if (hash === '#/power') return renderPower();
    if (hash === '#/analysis') return renderAnalysis();
    if (hash === '#/ask') return renderAsk();
    if (hash === '#/compare') return renderCompare();
    if (hash === '#/map') return renderMap();
    overviewRoute();
  }

  /**
   * TV mode: the dashboard for a screen on a wall.
   *
   * One panel per system with the only figures readable from across a room -
   * what it is producing now, what it has made today, the battery where there
   * is one, and the day's curve - plus the fleet total and a clock. The clock
   * is not decoration: on a display nobody touches, it is the only way to tell
   * a live page from a frozen one at a glance.
   */
  /**
   * How many systems TV mode shows at once, and how long each screenful stays.
   * Three is what a wall display across a room can still be read at; past
   * that, the screens take turns rather than the figures shrinking.
   */
  const TV_PER_SCREEN = 3;
  const TV_TURN_MS = 20_000;
  const tvScreen = (n) => (n > TV_PER_SCREEN ? Math.floor(Date.now() / TV_TURN_MS) % Math.ceil(n / TV_PER_SCREEN) : 0);
  let tvShown = 0;

  function renderTv() {
    const all = (state.latest?.inverters ?? []).filter((i) => i.ts);
    const screens = Math.ceil(all.length / TV_PER_SCREEN);
    tvShown = tvScreen(all.length);
    // The total is the whole fleet's, whichever screenful is showing.
    const invs = all.length > TV_PER_SCREEN ? all.slice(tvShown * TV_PER_SCREEN, (tvShown + 1) * TV_PER_SCREEN) : all;
    const byInv = {};
    for (const p of state.series?.points ?? []) (byInv[p.inverter_id] ||= []).push(p);
    const [tw, tu] = fmtW(all.reduce((a, i) => a + (i.ac_power_w || 0), 0));
    const panels = invs.map((inv, i) => {
      const m = parse(inv.metrics) ?? {};
      const st = statusOf(inv);
      const [pw, pu] = fmtW(inv.ac_power_w);
      const figs = [
        ['Today', fmtKwh(inv.today_kwh)],
        hasBattery(inv, m) && inv.battery_soc != null ? ['Battery', `${Math.round(inv.battery_soc)} % · ${battText(inv.battery_power_w)}`] : null,
        inv.load_power_w != null && !st.offline ? ['House', fmtWs(inv.load_power_w)] : null,
        inv.grid_power_w != null && !st.offline ? ['Grid', gridText(inv.grid_power_w)] : null,
      ].filter(Boolean);
      return `<section class="tvsys" style="--accent:${colorOf(inv)};--accent-ink:${inkOf(inv)}">
        <div class="tvname"><span>${esc(inv.name)}</span><span class="pill ${st.cls}"><i></i>${esc(st.text)}</span></div>
        <div class="tvnow${st.offline ? ' off' : ''}">${pw}<small>${pu}</small></div>
        <div class="tvfigs">${figs.map(([k, v]) => `<div><span class="k">${esc(k)}</span>${esc(v)}</div>`).join('')}</div>
        <div class="tvcurve">${systemChart(inv, todayOf(inv, byInv[inv.id]), 'tv' + i, 300, { bare: true })}</div>
      </section>`;
    }).join('');
    $('view').innerHTML = `<div class="tvwrap">
      <div class="tvhead">
        <div><div class="k">Producing now, ${all.length === 2 ? 'both systems' : all.length > 2 ? `all ${all.length} systems` : 'the system'}</div><div class="tvtotal">${tw}<small>${tu}</small></div></div>
        <div class="tvclock"><div class="t" id="tvclock"></div><div class="k" id="tvago"></div></div>
      </div>
      <div class="tvgrid">${panels || '<div class="empty">No system has reported yet.</div>'}</div>
      ${screens > 1 ? `<div class="tvpages" aria-label="Screen ${tvShown + 1} of ${screens}">${Array.from({ length: screens }, (_, i) => `<i class="${i === tvShown ? 'on' : ''}"></i>`).join('')}</div>` : ''}
    </div>`;
    tvTick();
  }

  /** The clock and the data's age, once a second, without refetching. */
  function tvTick() {
    if (!document.body.classList.contains('tv')) return;
    // Time for the next screenful: draw it, which ticks again itself.
    const n = (state.latest?.inverters ?? []).filter((i) => i.ts).length;
    if (tvScreen(n) !== tvShown) { renderTv(); return; }
    const c = $('tvclock'), a = $('tvago');
    if (c) c.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
    const newest = Math.max(0, ...(state.latest?.inverters ?? []).map((i) => i.ts || 0));
    if (a) a.textContent = newest ? `updated ${ago(newest)}` : '';
  }

  /**
   * Keep the screen on. A wall display that dims after ten minutes is a black
   * rectangle on a wall. The browser drops the lock whenever the page is
   * hidden, so it is taken again on return; where the API does not exist, or
   * the page is not on HTTPS, the display simply follows its own power
   * settings and nothing else changes.
   */
  let wakeLock = null;
  async function holdScreen(on) {
    try {
      if (on && !wakeLock && 'wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      } else if (!on && wakeLock) {
        await wakeLock.release();
        wakeLock = null;
      }
    } catch { wakeLock = null; }
  }

  /**
   * Only the overview claims the whole window. Every other tab is a list that
   * can legitimately be longer than the screen, so the class goes on for this
   * route and comes off for the rest - a body locked to 100vh on the Devices
   * tab would simply hide rows.
   */
  /**
   * The Overview, fitted to one screenful where that works: one or two systems
   * side by side on a large window. Three or more cannot share one screen at a
   * readable size, so the page scrolls instead, under a strip that lists them
   * all.
   */
  function overviewRoute() {
    const n = state.latest?.inverters?.length ?? 0;
    // Group headings and filters need the page to scroll like any other.
    document.body.classList.toggle('ovfit', n <= 2 && !groupNames().length);
    renderOverview();
  }

  // ---------- loading data ----------
  /**
   * Fetch what the page shows and draw it again: the newest readings, today's
   * samples, the hardware and the poll log, all four at once. Skipped while
   * the tab is hidden unless forced; runs on a timer (see schedule).
   */
  async function refresh(force = false) {
    // Nobody is reading a hidden tab. visibilitychange refreshes on return.
    if (document.hidden && !force) return;
    try {
      const now = Math.floor(Date.now() / 1000);
      const [lat, ser, devs, health, expected, locs, tariff, groups] = await Promise.all([
        api('/api/latest'),
        api(`/api/series?to=${now}&tz=${new Date().getTimezoneOffset()}`),
        api('/api/devices').catch(() => ({ devices: [] })),
        api('/api/health').catch(() => null),
        // What the sun allowed today; missing until a system has a position and weather.
        api('/api/expected').catch(() => null),
        // Where each system is: the owner's alone, refused to anyone else.
        api('/api/locations').catch(() => null),
        // The owner's prices, for money saved; null until they are set.
        api('/api/settings/tariff').catch(() => null),
        // The owner's groups, which lay the Overview out; none until they are set.
        api('/api/settings/groups').catch(() => null),
      ]);
      // An offline inverter is not still producing whatever it managed just
      // before it dropped - nothing is flowing that anyone can see - so its
      // instantaneous figures read zero everywhere at once, from this one
      // place. The cumulative ones (today, lifetime) are left alone: those
      // kilowatt-hours were genuinely generated and are still true - but only
      // on the day they were read. A system silent since an earlier day, its
      // relay off since then, still carries that day's counters; today they
      // are not reported, rather than that day's passed off as today's.
      for (const i of lat.inverters) {
        if (i.ts && plantDay(i.ts, i.tz_offset_sec) !== plantDay(now, i.tz_offset_sec)) {
          i.today_kwh = null;
          const m = parse(i.metrics);
          if (m) i.metrics = JSON.stringify(Object.fromEntries(Object.entries(m).filter(([k]) => !/Today/.test(k))));
        }
        i.offline = statusOf(i).offline;
        if (!i.offline) continue;
        i.ac_power_w = i.dc_power_w = 0;
        i.grid_power_w = i.load_power_w = 0;
        if (i.battery_power_w != null) i.battery_power_w = 0;
      }
      state.latest = lat; state.series = ser; state.devices = devs.devices ?? []; state.health = health; state.expected = expected; state.locations = locs?.locations ?? []; state.tariff = tariff?.tariff ?? null; state.groups = groups?.groups ?? {}; state.error = null;

      const withData = lat.inverters.filter((i) => i.ts);
      // Offline systems now contribute a real zero rather than a last-known
      // figure, so the total is just a total. What it cannot show is *why* it
      // is low, hence the line naming anything that is down.
      const down = withData.filter((i) => i.offline);
      const [fv, fu] = fmtW(withData.reduce((a, i) => a + (i.ac_power_w || 0), 0));
      $('fleet-power').innerHTML = withData.length ? `${fv}<span class="unit"> ${fu}</span>` : '—';
      $('fleet-quiet').hidden = !down.length;
      $('fleet-quiet').textContent = down.length ? `${down.map((i) => i.name).join(', ')} offline` : '';
      $('fleet-today').textContent = withData.length ? fmtKwh(withData.reduce((a, i) => a + (i.today_kwh || 0), 0)) : '—';

      const used = withData.reduce((a, i) => a + (parse(i.metrics)?.loadTodayKwh ?? 0), 0);
      $('fleet-used').textContent = used > 0 ? fmtKwh(used) : '—';

      // Only SolisCloud ships the forecast with its snapshot, so take the first
      // system that has one rather than assuming which vendor it came from.
      const wx = withData.map((i) => parse(i.metrics)).find((m) => m?.weatherText);
      const hasWx = !!wx;
      $('wx-item').hidden = !hasWx;
      $('wx-sep').hidden = !hasWx;
      if (hasWx) {
        $('fleet-wx').textContent =
          `${wx.weatherText}${wx.tempMinC != null && wx.tempMaxC != null ? ` (${Math.round(wx.tempMinC)}–${Math.round(wx.tempMaxC)}°)` : ''}`;
      }
      // The tab carries the count, so a fault is visible from any page.
      const n = alertCount();
      // Same moment the badge is counted: one pass over the alerts, and the
      // switch on the Alerts tab decides whether anything is said out loud.
      notifyOfAlerts();
      $('alertbadge').hidden = !n;
      $('alertbadge').textContent = String(n);
      $('alertbadge').className = 'navbadge' + ((state.latest?.inverters ?? []).some((i) => alertsFor(i).some((r) => r.level === 'bad')) ? ' bad' : '');

      const newest = Math.max(0, ...withData.map((i) => i.ts));
      const stale = !newest || (now - newest) > STALE_AFTER_S;
      $('updated').className = 'livedot' + (stale ? ' stale' : '');
      $('updated').innerHTML = `<i></i>${newest ? ago(newest) : 'no samples yet'}`;

      // One line per feed. Showing only the newest row meant the busier feed
      // wrote over the quieter one, and the footer read as though a whole
      // system were untracked - "plants=1 inverters=1" for the only provider
      // that logs on a cron, with nothing at all about the relay.
      // An open dashboard is worth interrupting for: it is not a state anyone
      // chooses on a deployment that is reachable from the internet.

      const feeds = health?.feeds?.length ? health.feeds : (health?.polls?.length ? [health.polls[0]] : []);
      if (feeds.length) {
        $('poll-status').innerHTML = feeds.map((p) =>
          `<span class="feed ${p.ok ? '' : 'bad'}">${esc(providerName(p.provider))} ${p.ok ? 'ok' : 'FAILED'} ${esc(ago(p.ts))}` +
          `<em title="${esc(p.detail || '')}"> — ${esc(p.detail || '')}</em></span>`).join('');
      }
      route();
    } catch (e) {
      state.error = e.message;
      if (e.message === 'signin') { $('updated').innerHTML = '<i></i>sign in'; route(); }
      else if (e.message === 'unauthorized') { $('updated').innerHTML = '<i></i>unauthorized'; route(); }
      else $('updated').innerHTML = `<i></i>error: ${esc(e.message)}`;
    }
  }

  // ---------- theme ----------
  // Three states rather than two: "auto" is the default and follows the OS, so
  // a viewer who never touches this still gets the right one at night.
  const THEMES = ['auto', 'light', 'dark'];
  const THEME_ICON = { auto: '🖥️', light: '☀️', dark: '🌙' };
  let theme = 'auto';
  try { const t = localStorage.getItem('sl-theme'); if (THEMES.includes(t)) theme = t; } catch { /* private mode */ }
  // Put the chosen theme on the page, and show which one on the button.
  function applyTheme() {
    if (theme === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', theme);
    const btn = $('theme');
    btn.textContent = THEME_ICON[theme];
    btn.title = `Theme: ${theme}`;
    btn.setAttribute('aria-label', `Theme: ${theme}. Click to change.`);
  }
  $('theme').addEventListener('click', () => {
    theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
    try { localStorage.setItem('sl-theme', theme); } catch { /* private mode */ }
    applyTheme();
  });
  applyTheme();

  window.addEventListener('hashchange', route);
  route();
  refresh(true);
  // Self-scheduling rather than setInterval, so that entering or leaving TV
  // mode can change the cadence immediately instead of after the old timer.
  function schedule() {
    clearTimeout(timer);
    timer = setTimeout(async () => { await refresh(); schedule(); },
      document.body.classList.contains('tv') ? TV_REFRESH_MS : REFRESH_MS);
  }
  schedule();
  setInterval(tvTick, 1000);

  // Leaving: Escape, or the exit link, which appears when the mouse moves and
  // hides again when it stops - a cursor parked on a wall display should not
  // leave a button hanging over the numbers.
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && document.body.classList.contains('tv')) location.hash = '#/';
  });
  let still = null;
  document.addEventListener('mousemove', () => {
    if (!document.body.classList.contains('tv')) return;
    document.body.classList.add('moving');
    clearTimeout(still);
    still = setTimeout(() => document.body.classList.remove('moving'), 2500);
  });
  // ---------- a new version ----------
  //
  // A dashboard tab refreshes its figures on its own but never the page that
  // draws them, so a tab left open across a release - or a wall display - goes
  // on running the old one. The page therefore asks for its own address now and
  // then, headers only, and compares the ETag with the one it had at load:
  // changed means the page on the server is not the page on screen. It costs
  // one tiny request every quarter hour and one on coming back to the tab, and
  // nothing at all on the database.
  //
  // A screen someone is reading gets a notice and chooses when; TV mode has
  // nobody to choose, so it reloads itself. "Later" is taken at its word for
  // the rest of the visit.
  const VERSION_CHECK_MS = 15 * 60 * 1000;
  let loadedVersion = null;
  let newVersionSeen = false;

  /** The ETag of the page the server has now, asked for with a HEAD request. */
  async function serverVersion() {
    try {
      const res = await fetch('/', { method: 'HEAD', cache: 'no-store', credentials: 'same-origin' });
      if (!res.ok) return null;
      return res.headers.get('etag') || res.headers.get('last-modified');
    } catch {
      return null;
    }
  }

  /**
   * Whether the page the server has now is the page running here: its script
   * and its styles, compared as text. Null when it cannot be told.
   */
  async function serverHasThisPage() {
    if (!RUNNING_SCRIPT) return null;
    try {
      const res = await fetch('/', { cache: 'no-store', credentials: 'same-origin' });
      if (!res.ok) return null;
      const html = await res.text();
      return html.includes(RUNNING_SCRIPT) && (!RUNNING_STYLE || html.includes(RUNNING_STYLE));
    } catch {
      return null;
    }
  }

  /** Compare the page on the server with the page on screen, and offer a reload when they differ. */
  async function checkForNewVersion() {
    if (newVersionSeen) return;
    const now = await serverVersion();
    if (!now) return;
    if (loadedVersion === null) {
      // The first ETag is only a fair baseline if it belongs to the page that is
      // running. A release landing between this page loading and this request
      // would otherwise be taken as this page's own version, and never offered.
      // So the first look also fetches the page once and compares what it
      // holds with what is running; a mismatch is a new version already.
      loadedVersion = now;
      if ((await serverHasThisPage()) !== false) return;
    } else if (now === loadedVersion) {
      return;
    }
    newVersionSeen = true;
    if (document.body.classList.contains('tv')) { location.reload(); return; }
    const bar = document.createElement('div');
    bar.className = 'newversion';
    bar.id = 'newversion';
    bar.setAttribute('role', 'status');
    bar.innerHTML = `<span>A new version of SolarLens is available.</span>
      <button type="button" class="nv-reload" id="nv-reload">Reload</button>
      <button type="button" class="nv-later" id="nv-later">Later</button>`;
    document.body.appendChild(bar);
    $('nv-reload').onclick = () => location.reload();
    $('nv-later').onclick = () => bar.remove();
  }
  checkForNewVersion();
  setInterval(checkForNewVersion, VERSION_CHECK_MS);

  // Returning to the tab is exactly when a stale figure matters, so that one
  // fetches everything rather than waiting for the slow cycle to come round -
  // and it is when a release made while the tab was hidden should be noticed.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    refresh(true);
    checkForNewVersion();
    if (document.body.classList.contains('tv')) holdScreen(true);
  });

  // Installable: the worker is what lets the dashboard live on a home screen
  // rather than in a tab. It goes to the network first and falls back to a
  // cache only when there is no network, so nothing here can make a stale
  // reading look live. Registration is deliberately last and deliberately
  // silent: a browser that refuses it, or a page opened over plain HTTP where
  // workers are not allowed, still gets the whole dashboard.
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
})();
</script>
</body>
</html>
