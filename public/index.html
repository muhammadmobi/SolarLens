    const y = (v) => T + (1 - Math.max(0, Math.min(100, v)) / 100) * (H - T - B);
    let out = '';
    for (const v of [0, 50, 100]) {
      out += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" vector-effect="non-scaling-stroke"/>`;
      out += `<text class="axis" x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v}%</text>`;
    }
    for (let h = 0; h <= 24; h += 6) {
      out += `<text class="axis" x="${x(t0 + h * 3600)}" y="${H - 6}" text-anchor="${h === 0 ? 'start' : h === 24 ? 'end' : 'middle'}">${String(h).padStart(2, '0')}:00</text>`;
    }
    let d = '';
    soc.forEach((p, i) => {
      const gap = i > 0 && p.ts - soc[i - 1].ts > 1800;
      d += `${i === 0 || gap ? 'M' : 'L'}${x(p.ts).toFixed(1)},${y(p.battery_soc).toFixed(1)}`;
    });
    out += `<path d="${d}" fill="none" stroke="${accent}" stroke-width="2.2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
    const lo = soc.reduce((a, p) => (p.battery_soc < a.battery_soc ? p : a));
    const hi = soc.reduce((a, p) => (p.battery_soc > a.battery_soc ? p : a));
    return `<div class="soc">
      <div class="ovchart-head"><span class="t">Charge today</span>
        <span class="p">low ${Math.round(lo.battery_soc)}% at ${esc(hhmm(lo.ts, lo.tz_offset_sec ?? inv.tz_offset_sec))} · high ${Math.round(hi.battery_soc)}%</span></div>
      <svg class="soc-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Battery charge through today">${out}</svg>
    </div>`;
  }

  /** The PV strings card: each MPPT string's power, voltage and current. */
  function stringsCard(invDev, accent, offline) {
    // strings === null means the vendor reports no per-string registers at all;
    // an empty array means it does, but none are producing (night). Only the
    // second case deserves a card.
    if (!invDev || invDev.strings === null || invDev.strings === undefined) return '';
    const strings = parse(invDev.strings);
    const body = !strings || !strings.length
      ? `<p style="margin:0;color:var(--muted);font-size:13.5px">No string is producing in the latest sample.</p>`
      : (() => {
          const max = Math.max(...strings.map((s) => s.powerW), 1);
          return `<div class="bars">${strings.map((s) => {
            // Offline: an empty socket is still an empty socket, but a connected
            // string's wattage is history, and says so.
            const state = stringState(s) === 'no input' ? 'no input' : offline ? 'offline' : stringState(s);
            const detail = [s.voltageV != null ? `${s.voltageV} V` : null, s.currentA != null ? `${s.currentA} A` : null]
              .filter(Boolean).join(' · ');
            return `<div class="bar-row${state === 'no input' ? ' unused' : ''}">
            <span class="lbl">String ${s.index}</span>
            <span class="bar-track"><span class="bar-fill" style="width:${Math.max(2, (s.powerW / max) * 100).toFixed(1)}%;background:${accent}"></span></span>
            <span class="num">${state ? esc(state) : fmtWs(s.powerW)}</span>
            ${detail ? `<span class="sub2">${esc(detail)}</span>` : ''}
            </div>`;
          }).join('')}</div>
          ${offline && invDev.last_seen
            ? `<p class="cardnote">The inverter is offline. Voltage and current are the last reported, ${esc(ago(invDev.last_seen))}, not a reading from now.</p>`
            : ''}
          ${strings.some((x) => stringState(x) === 'no input')
            ? `<p class="cardnote">An MPPT input reading a fraction of a volt with no current has nothing plugged into it - not a string producing zero.</p>`
            : ''}`;
        })();
    return `<section class="card"><h3>PV strings · MPPT</h3><div class="body">${body}</div></section>`;
  }

  /** The AC output card: each phase's voltage and current, frequency, power factor. */
  function acCard(invDev) {
    if (!invDev) return '';
    const phases = parse(invDev.ac_phases);
    const extras = [
      invDev.frequency_hz != null ? ['Frequency', `${invDev.frequency_hz} Hz`] : null,
      invDev.power_factor != null ? ['Power factor', String(invDev.power_factor)] : null,
      invDev.dc_bus_v != null ? ['DC bus', `${invDev.dc_bus_v} V`] : null,
    ].filter(Boolean);
    if ((!phases || !phases.length) && !extras.length) return '';
    const rows = (phases ?? []).map((p) => `<dt>Phase ${p.index}</dt><dd>${
      [p.voltageV != null ? `${p.voltageV} V` : null, p.currentA != null ? `${p.currentA} A` : null].filter(Boolean).join(' · ') || '—'
    }</dd>`).join('');
    const tail = extras.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('');
    return `<section class="card"><h3>AC output · per phase</h3><div class="body">
      <dl class="kv">${rows}${tail}</dl></div></section>`;
  }

  /**
   * Every measurement the vendor sent, as a filterable table, for questions the
   * page does not answer. Read from `telemetry`, the copy of the payload the
   * Worker cleans for publishing (src/public-view.ts, safeTelemetry): numbers,
   * units and status words, with every id, serial, name and place left out.
   */
  function rawCard(inv) {
    const raw = parse(inv.telemetry);
    if (!raw || typeof raw !== 'object') return '';
    const entries = Object.entries(raw).filter(([, v]) => v === null || typeof v !== 'object');
    if (!entries.length) return '';
    const rows = entries.map(([k, v]) => {
      const key = esc(k.toLowerCase());
      return `<div class="rk" data-k="${key}">${esc(k)}</div><div class="rv" data-k="${key}">${esc(v === null ? 'null' : String(v))}</div>`;
    });
    return `<details class="raw card"><summary>Raw telemetry · ${entries.length} fields from ${esc(inv.source ?? inv.provider)}</summary>
      <div class="body">
        <input type="search" class="rawfilter" placeholder="Filter fields…" aria-label="Filter raw telemetry fields">
        <div class="rawgrid">${rows.join('')}</div>
      </div></details>`;
  }

  /**
   * Every card that describes one system, in reading order. Shared verbatim by
   * the system view and the Power page so the two can never drift apart.
   */
  /**
   * An MPPT input with no array on it still appears in the register set,
   * reporting a fraction of a volt and no current. That is not a string
   * producing zero watts at night - it is a socket with nothing in it, and
   * saying so answers "why does string 2 have no value?" once instead of
   * every time someone looks.
   */
  const stringState = (st) =>
    (st.voltageV ?? 0) < 10 && !(st.currentA > 0) && !(st.powerW > 0) ? 'no input'
      : (st.powerW ?? 0) > 0 ? null : 'not producing';

  /**
   * How many strings are producing, out of how many are actually connected -
   * the one answer the overview tile, the Devices table and the system page
   * all give, so they cannot disagree again.
   *
   * Two things it refuses to count. An empty MPPT socket is not a string, so
   * it is not in the total: "1 of 2" for one array on a two-input inverter
   * reads as a fault that does not exist. And an offline inverter's strings
   * are not producing, whatever the device record says. That record holds the
   * last readings the inverter sent before it went quiet - at dusk, typically,
   * a few watts on each input - and it is not updated again until the
   * inverter comes back. Read as current, it said "2 producing" about a system
   * the header correctly called offline.
   *
   * Returns the label to print, or null when there is nothing to say.
   */
  const stringsLabel = (strings, offline) => {
    if (!strings || !strings.length) return null;
    const connected = strings.filter((x) => stringState(x) !== 'no input');
    if (!connected.length) return null;
    if (offline) return 'offline';
    const live = connected.filter((x) => (x.powerW ?? 0) > 0).length;
    return live === connected.length ? `${live} producing` : `${live} of ${connected.length}`;
  };

  /**
   * One system in full, as pieces a view assembles: its header, flow diagram,
   * the cards (energy, grid, battery, strings, AC, device) and raw telemetry.
   * Power shows these under each system; a system's own page shows one set.
   */
  function detailBlocks(inv) {
    const m = parse(inv.metrics) ?? {};
    const st = statusOf(inv);
    const devs = devicesFor(inv);
    const invDev = devs.find((d) => d.kind === 'inverter');
    const logger = devs.find((d) => d.kind === 'datalogger');
    const accent = colorFor(inv.provider);
    const [pv, pu] = fmtW(inv.ac_power_w);
    // Temperature is per-device telemetry, so the station snapshot rarely has it.
    const tempC = inv.temp_c ?? invDev?.temp_c ?? null;

    const identity = kvCard('Identity & hardware', [
      ['System', esc(inv.name)],
      inv.plant_name && inv.plant_name !== inv.name ? ['Plant', esc(inv.plant_name)] : null,
      ['Feed', esc(inv.source ?? providerName(inv.provider))],
      invDev?.model ? ['Model', esc(invDev.model)] : null,
      invDev?.sn ? ['Serial', esc(invDev.sn), true] : null,
      invDev?.firmware ? ['Firmware', esc(invDev.firmware), true] : null,
      ['Rated', invDev?.rated_power_w ? fmtWs(invDev.rated_power_w) : (inv.capacity_w ? fmtWs(inv.capacity_w) : '—')],
      invDev?.commissioned_at ? ['Commissioned', esc(fmtDate(invDev.commissioned_at))] : null,
      invDev?.warranty_until ? ['Warranty to', esc(fmtDate(invDev.warranty_until))] : null,
    ]);

    const link = logger ? kvCard('Datalogger & link', [
      ['Status', `<span class="pill ${logger.status === 'online' ? 'ok' : 'warn'}"><i></i>${esc(logger.status ?? 'unknown')}</span>`],
      logger.sn ? ['Serial', esc(logger.sn), true] : null,
      logger.model ? ['Model', esc(logger.model)] : null,
      logger.firmware ? ['Firmware', esc(logger.firmware), true] : null,
      parse(logger.logger)?.link ? ['Connects by', esc(parse(logger.logger).link)] : null,
      ['Signal', esc(signalLabel(logger))],
      logger.upload_cycle_s ? ['Uploads every', `${logger.upload_cycle_s}s`] : null,
      ['Last contact', esc(logger.last_seen ? ago(logger.last_seen) : '—')],
      parse(logger.logger)?.uptimeS != null ? ['Running since restart', esc(spanText(parse(logger.logger).uptimeS))] : null,
    ], 'Its week online and its signal are on the Devices tab.') : '';

    const live = kvCard('Live power', [
      ['AC output', fmtWs(inv.ac_power_w)],
      inv.dc_power_w != null ? ['DC input', fmtWs(inv.dc_power_w)] : null,
      ['House load', fmtWs(inv.load_power_w)],
      ['Grid', inv.grid_power_w == null ? '—' : (inv.grid_power_w >= 0 ? `↓ ${fmtWs(inv.grid_power_w)} import` : `↑ ${fmtWs(-inv.grid_power_w)} export`)],
      ['Updated', inv.ts ? `${esc(when(inv.ts))} · ${esc(ago(inv.ts))}` : 'never'],
    ]);

    const counters = kvCard('Energy counters', [
      ['Produced today', fmtKwh(inv.today_kwh)],
      m.genMonthKwh != null ? ['Produced this month', fmtKwh(m.genMonthKwh)] : null,
      m.genYearKwh != null ? ['Produced this year', fmtKwh(m.genYearKwh)] : null,
      ['Produced, lifetime', fmtKwh(inv.total_kwh)],
      m.loadTodayKwh != null ? ['Consumed today', fmtKwh(m.loadTodayKwh)] : null,
      m.gridImportTodayKwh != null ? ['Imported today', fmtKwh(m.gridImportTodayKwh)] : null,
      m.gridExportTodayKwh != null ? ['Exported today', fmtKwh(m.gridExportTodayKwh)] : null,
      m.gridImportTotalKwh != null ? ['Imported, lifetime', fmtKwh(m.gridImportTotalKwh)] : null,
      m.gridExportTotalKwh != null ? ['Exported, lifetime', fmtKwh(m.gridExportTotalKwh)] : null,
      m.loadTotalKwh != null ? ['Consumed, lifetime', fmtKwh(m.loadTotalKwh)] : null,
      m.selfUseTodayKwh != null ? ['Self-consumed today', fmtKwh(m.selfUseTodayKwh)] : null,
      // Two different questions, and the pair is why both are worth printing:
      // self-sufficiency is how much of the house ran on its own roof, and
      // self-consumption is how much of the roof's output stayed home. A day
      // can be high on one and low on the other.
      share(m.selfUseTodayKwh, m.loadTodayKwh) != null
        ? ['Self-sufficiency today', `${share(m.selfUseTodayKwh, m.loadTodayKwh)} % of the load`] : null,
      share(m.selfUseTodayKwh, inv.today_kwh) != null
        ? ['Self-consumption today', `${share(m.selfUseTodayKwh, inv.today_kwh)} % of what was generated`] : null,
      m.fullLoadHours != null ? ['Full-load hours', `${m.fullLoadHours} h`] : null,
    ],
    // A row that is simply absent invites the question every time. Say once
    // why: an on-grid plant with no CT clamp reports every grid field as zero,
    // and SolisCloud mirrors generation into household load so its own flow
    // diagram has something to draw. None of that is a measurement, so none of
    // it is shown - but the absence deserves a sentence.
    m.genTotalKwh != null && m.gridImportTotalKwh === null && m.gridExportTotalKwh === null
      ? 'Grid import, export and household consumption are missing because this plant has no grid meter — the vendor returns zeros for all of them, and a zero is not a measurement.'
      : undefined);

    const bat = parse(invDev?.battery);
    const cyc = cycles(m, bat);
    const battery = hasBattery(inv, m) ? `<section class="card"><h3>Battery</h3><div class="body">
      <div class="batt" style="margin-top:0;padding-top:0;border-top:none">
        ${ring(inv.battery_soc ?? 0)}
        <div><div class="k">State of charge</div><div class="v">${battText(inv.battery_power_w)}</div></div>
      </div>
      ${socChart(inv, todayOf(inv, (state.series?.points ?? []).filter((p) => p.inverter_id === inv.id)), accent)}
      <dl class="kv" style="margin-top:16px">
        ${m.batteryStatus || bat?.status ? `<dt>Status</dt><dd>${esc(String(m.batteryStatus || bat.status).toLowerCase())}</dd>` : ''}
        ${inv.battery_soc != null ? `<dt>State of charge</dt><dd>${Math.round(inv.battery_soc)} %</dd>` : ''}
        ${inv.battery_power_w != null ? `<dt>Charge / discharge</dt><dd>${battText(inv.battery_power_w)}</dd>` : ''}
        ${bat?.tempC != null ? `<dt>Pack temperature</dt><dd>${bat.tempC} °C</dd>` : ''}
        ${bat?.voltageV != null ? `<dt>Pack voltage</dt><dd>${bat.voltageV} V</dd>` : ''}
        ${bat?.currentA != null ? `<dt>Pack current</dt><dd>${bat.currentA} A</dd>` : ''}
        ${m.battChargeTodayKwh != null ? `<dt>Charged today</dt><dd>${fmtKwh(m.battChargeTodayKwh)}</dd>` : ''}
        ${m.battDischargeTodayKwh != null ? `<dt>Discharged today</dt><dd>${fmtKwh(m.battDischargeTodayKwh)}</dd>` : ''}
        ${m.battChargeTotalKwh != null ? `<dt>Charged, lifetime</dt><dd>${fmtKwh(m.battChargeTotalKwh)}</dd>` : ''}
        ${m.battDischargeTotalKwh != null ? `<dt>Discharged, lifetime</dt><dd>${fmtKwh(m.battDischargeTotalKwh)}</dd>` : ''}
        ${bat?.bmsTempC != null ? `<dt>BMS temperature</dt><dd>${bat.bmsTempC} °C</dd>` : ''}
        ${bat?.bmsVoltageV != null ? `<dt>BMS voltage</dt><dd>${bat.bmsVoltageV} V</dd>` : ''}
        ${bat?.chargeLimitA != null ? `<dt>Charge limit</dt><dd>${bat.chargeLimitA} A</dd>` : ''}
        ${bat?.dischargeLimitA != null ? `<dt>Discharge limit</dt><dd>${bat.dischargeLimitA} A</dd>` : ''}
        ${bat?.bmsSocPct != null ? `<dt>BMS state of charge</dt><dd>${Math.round(bat.bmsSocPct)} %</dd>` : ''}
        ${bat?.bmsChargeVoltageV != null ? `<dt>BMS charge voltage</dt><dd>${bat.bmsChargeVoltageV} V</dd>` : ''}
        ${bat?.bmsDischargeVoltageV != null ? `<dt>BMS discharge voltage</dt><dd>${bat.bmsDischargeVoltageV} V</dd>` : ''}
        ${bat?.chemistry ? `<dt>Chemistry</dt><dd>${esc(bat.chemistry)}</dd>` : ''}
        ${bat?.ratedCapacityAh != null ? `<dt>Rated capacity</dt><dd>${bat.ratedCapacityAh} Ah${bat.nominalVoltageV ? ` @ ${bat.nominalVoltageV} V · ${packKwh(bat).toFixed(2)} kWh` : ''}</dd>` : ''}
        ${cyc != null ? `<dt title="Derived: lifetime energy charged divided by the pack's usable capacity. Neither cloud reports a counter.">Equivalent full cycles</dt><dd>${cyc.toFixed(0)} <span class="derived">derived</span></dd>` : ''}
      </dl></div></section>` : '';

    const diagnostics = kvCard('Status & diagnostics', [
      ['Status', `<span class="pill ${st.cls}"${st.stale && st.lastWord ? ` title="Last word from the vendor: ${esc(st.lastWord)}"` : ''}><i></i>${esc(st.text)}</span>`],
      tempC != null ? ['Temperature', `${tempC.toFixed(1)} °C`] : null,
      m.gridStatus ? ['Grid', esc(String(m.gridStatus).toLowerCase())] : null,
      m.weatherText ? ['Weather', `${esc(m.weatherText)}${m.tempMinC != null && m.tempMaxC != null ? ` · ${Math.round(m.tempMinC)}–${Math.round(m.tempMaxC)} °C` : ''}`] : null,
      m.sunrise && m.sunset ? ['Sun', `${esc(m.sunrise)} – ${esc(m.sunset)}`] : null,
      ['Updated', inv.ts ? `${esc(when(inv.ts))} · ${esc(ago(inv.ts))}` : 'never'],
    ]);

    return {
      header: `<div class="sys-head" style="margin-bottom:18px">
        <div>
          <div class="vendor" style="color:${inkFor(inv.provider)}">${esc(providerName(inv.provider))}</div>
          <div class="sys-name" style="font-size:26px">${esc(inv.name)}</div>
        </div>
        <div style="text-align:right">
          <div class="herolabel">Producing now</div>
          <div class="hero" style="margin:0"><span class="val" style="font-size:40px">${pv}</span><span class="unit">${pu}</span></div>
          ${inv.capacity_w ? `<div class="cap" style="margin:0">of ${fmtWs(inv.capacity_w)} rated</div>` : ''}
        </div>
      </div>`,
      flow: `<section class="card" style="margin-bottom:16px"><div class="body">${flowSvg(inv, m)}</div></section>`,
      blocks: `<div class="blocks">${identity}${link}${live}${counters}${stringsCard(invDev, accent, st.offline)}${acCard(invDev)}${battery}${diagnostics}</div>`,
      raw: rawCard(inv),
    };
  }

  /** Wire up the raw-telemetry filters that detailBlocks() just rendered. */
  function bindRawFilters() {
    for (const box of document.querySelectorAll('.rawfilter')) {
      const grid = box.closest('details').querySelector('.rawgrid');
      box.addEventListener('input', () => {
        const q = box.value.trim().toLowerCase();
        for (const el of grid.children) el.hidden = !!q && !el.dataset.k.includes(q);
      });
    }
  }

  /** A system's own page (#/system/<id>), opened by tapping it on the Overview. */
  function renderSystem(id) {
    const inv = (state.latest?.inverters ?? []).find((i) => i.id === id);
    if (!inv) { $('view').innerHTML = `<a class="back" href="#/">← Overview</a><div class="card"><div class="empty">Unknown system.</div></div>`; return; }
    const b = detailBlocks(inv);
    $('view').innerHTML = `<a class="back" href="#/">← Overview</a>${b.header}${b.flow}${b.blocks}${b.raw}`;
    bindRawFilters();
  }

  // ---------- the guide ----------
  //
  // What SolarLens is, what is on each tab, and where to find things - opened
  // from the Guide button (an open book) in the header. A guide is reference, read now and then, so it
  // sits behind an icon rather than taking a tab from the pages used every day.
  // RELEASE is kept equal to package.json's version by a unit test, so the
  // guide never describes a release other than the one it ships with.
  const RELEASE = '2.10.0';

  function renderGuide() {
    const systems = (state.latest?.inverters ?? []).map((inv) => {
      const size = inv.capacity_w ? ` · ${(inv.capacity_w / 1000).toFixed(inv.capacity_w % 1000 ? 1 : 0)} kW` : '';
      // The same test every other page uses, so a battery whose charge figure
      // is missing for the moment is still a battery here too.
      const batt = hasBattery(inv, parse(inv.metrics)) ? ' · with a battery' : '';
      return `<span><strong>${esc(inv.name)}</strong> · ${esc(providerName(inv.provider))}${size}${batt}</span>`;
    }).join('');
    const tab = (href, name) => `<a href="${href}">${name}</a>`;
    const rows = [
      ['See what each system is producing right now', tab('#/', 'Overview')],
      ['Compare both systems on one chart, or hide one', `${tab('#/power', 'Power')} - tap a name in the legend to hide or show it`],
      ['See one system on its own, in full', `${tab('#/', 'Overview')} - tap the system`],
      ['Daily, monthly or yearly totals', `${tab('#/history', 'Historical Data')} - Day, Month or Year at the top`],
      ["One system's history on its own",`${tab('#/history', 'Historical Data')} - pick the system at the top; All systems shows both`],
      ['Take the figures into a spreadsheet', `${tab('#/history', 'Historical Data')} - Download CSV`],
      ['Know what is wrong right now', `${tab('#/alerts', 'Alerts')} - the number on the tab counts it`],
      ['See past faults, and how long each lasted', `${tab('#/alerts', 'Alerts')} - Fault history, under each system`],
      ['Be told on your phone when something goes wrong', `${tab('#/alerts', 'Alerts')} - Also when this browser is closed`],
      ['Battery charge through the day', `${tab('#/power', 'Power')}, under the hybrid system - Charge today`],
      ['PV strings, voltages, currents, temperature', `${tab('#/power', 'Power')}, under each system`],
      ['Inverter model, firmware, datalogger signal', tab('#/devices', 'Devices')],
      ['Whether a datalogger kept its link this week', `${tab('#/devices', 'Devices')} - each datalogger, Last 7 days`],
      ['Warranty and installation date', `${tab('#/power', 'Power')}, under each system, or the system on its own`],
      ['When each laptop\'s SolisCloud login runs out', `${tab('#/devices', 'Devices')} - SolisCloud relays`],
      ['Every measurement the vendor sent', `${tab('#/power', 'Power')}, under each system - Raw telemetry, with a filter`],
      ['Show it on a wall screen', `📺 at the top - ${tab('#/tv', 'TV mode')}; Esc to leave`],
      ['Light or dark', '🖥️ at the top - follows your device, or pick one'],
      ['Put it on a phone\'s home screen', 'Your browser\'s menu - Add to Home Screen (on an iPhone, the Share button)'],
    ].map(([want, where]) => `<tr><td>${want}</td><td>${where}</td></tr>`).join('');

    $('view').innerHTML = `<div class="guide">
      <section class="card"><h2>Guide<span class="ver">SolarLens ${RELEASE}</span></h2><div class="body">
        <p class="lead">SolarLens puts your solar systems on one page. Each system is watched by a different vendor's cloud,
          SolisCloud or SolarMan; SolarLens reads both every five minutes, keeps every reading in its own database,
          and shows them side by side - in the same units, on the same clock, in each system's own time.</p>
        <p>Nothing here can change an inverter: SolarLens only reads. Anyone with the link can view it, and the vendors'
          account and serial numbers are removed before anything leaves the server.</p>
        ${systems ? `<div class="systems" aria-label="Your systems">${systems}</div>` : ''}
      </div></section>

      <section class="card"><h2>What is new in ${RELEASE}</h2><div class="body"><ul>
        <li><strong>Notifications on your phone, even with the dashboard closed.</strong> Alerts tab - <em>Also when this
          browser is closed</em> - Turn on for this device. You are told when a system stops reporting while it was
          producing, a fault is recorded, a SolisCloud login is about to run out, or a vendor stops answering. Each is
          told once, and again only if it clears and comes back.</li>
        <li><strong>SolarMan faults now say when they cleared,</strong> and SolarMan's advice where it gives any. Faults
          it used to fold into one line a day are shown one by one.</li>
        <li><strong>This guide.</strong> The <strong>Guide</strong> button, the open book at the top of every page.</li>
      </ul>
      <p class="cardnote">In 2.9: Download CSV on Historical Data, the <em>Tell me when something changes</em> switch,
        days that stay correct when the clocks change, and every page checked for accessibility.</p>
      </div></section>

      <section class="card"><h2>The tabs</h2><div class="body"><dl class="tabs">
        <dt>${tab('#/', 'Overview')}</dt>
        <dd>Every system at a glance: what it is producing now, what it has made today, where the power is going -
          the house, the grid, the battery - and today's curve with its peak. Tap a system to open it on its own.</dd>
        <dt>${tab('#/power', 'Power')}</dt>
        <dd>Both systems on one chart, plus each system in full, one below the other: energy today, this month, this
          year and in total; grid in and out; the battery; each PV string and AC phase; and the raw telemetry.</dd>
        <dt>${tab('#/history', 'Historical Data')}</dt>
        <dd>The record, by day, month or year - back to installation for months and years, from each vendor's own totals.
          Every system at once, or one on its own. Each row says whose figure it is. Download CSV takes the rows on screen.</dd>
        <dt>${tab('#/alerts', 'Alerts')}</dt>
        <dd>What is wrong now, system by system, and what was checked when nothing is. Below that, each system's fault
          history with how long every fault lasted. The notification switches are here.</dd>
        <dt>${tab('#/devices', 'Devices')}</dt>
        <dd>The hardware: inverters and dataloggers with model, firmware and signal strength - and the
          SolisCloud relay laptops, with when each one's login runs out.</dd>
      </dl></div></section>

      <section class="card"><h2>Where to find it</h2><div class="tablewrap" tabindex="0" role="region" aria-label="Where to find it, scrolls sideways">
        <table class="find"><thead><tr><th scope="col">I want to</th><th scope="col">Go to</th></tr></thead>
        <tbody>${rows}</tbody></table>
      </div></section>

      <section class="card"><h2>Along the top</h2><div class="body"><ul>
        <li><strong>Producing now, Produced today, Consumed today</strong> - every system added together. A system that
          has gone quiet counts as zero and is named underneath.</li>
        <li><strong>The green dot</strong> says when the page last heard from the server. Amber means it has not for a while.</li>
        <li><strong>Guide</strong> (the open book) this page · <strong>📺</strong> TV mode · <strong>🖥️</strong> light or dark.</li>
      </ul></div></section>

      <section class="card"><h2>Good to know</h2><div class="body"><ul>
        <li><strong>An on-grid system reads offline every night.</strong> Its inverter switches off when the sun goes
          down and SolisCloud reports it offline until morning. That is normal, and it is not announced to your phone.</li>
        <li><strong>SolisCloud's figures come through a relay</strong> - a small program on a laptop, because SolisCloud
          cannot be read from the server directly. If any one relay laptop is on, the figures keep coming; with two on,
          each reading is still stored once.</li>
        <li><strong>A SolisCloud login lasts seven days</strong> and cannot renew itself. The Alerts tab warns two days
          ahead; renew it by double-clicking <code>renew-solis-login.cmd</code> on that laptop.</li>
        <li><strong>Times are each system's own.</strong> A peak "at 12:40" is 12:40 where the panels are, wherever you
          are reading from.</li>
        <li><strong>A figure the vendor did not report is shown as a dash, not a zero,</strong> so a blank never passes
          for "nothing happened".</li>
      </ul></div></section>
    </div>`;
  }

  // ---------- routing ----------
  function route() {
    const hash = location.hash || '#/';
    for (const a of $('nav').children) a.classList.toggle('on', a.getAttribute('href') === hash);
    $('guidebtn').classList.toggle('on', hash === '#/guide');
    document.body.classList.remove('ovfit');
    const tv = hash === '#/tv';
    if (document.body.classList.contains('tv') !== tv) {
      document.body.classList.toggle('tv', tv);
      holdScreen(tv);
      schedule();
    }
    // The guide needs no data, so it waits for none and is stopped by no data
    // error: it is the page to read while the rest is still loading, when the
    // feeds are down, or when the server has refused a request.
    if (hash === '#/guide') return renderGuide();
    if (state.error === 'unauthorized') {
      // Reads are public, so this should not happen. It is kept because a
      // deployment mid-rollout can still answer 401, and a blank page would
      // say nothing about why.
      $('view').innerHTML = `<div class="card"><div class="empty">The server refused this request. If it persists, redeploy.</div></div>`;
      return;
    }
    if (!state.latest) return; // first paint waits for data
    const sys = hash.match(/^#\/system\/(.+)$/);
    if (sys) return renderSystem(decodeURIComponent(sys[1]));
    if (tv) return renderTv();
    if (hash === '#/devices') return renderDevices();
    if (hash === '#/alerts') return renderAlerts();
    if (hash === '#/history') return renderHistory();
    // The Flow tab is gone: its diagrams live on the overview now, but an
    // old bookmark should still land somewhere sensible.
    if (hash === '#/flow') { location.replace('#/'); return overviewRoute(); }
    if (hash === '#/power') return renderPower();
    overviewRoute();
  }

  /**
   * TV mode: the dashboard for a screen on a wall.
   *
   * One panel per system with the only figures readable from across a room -
   * what it is producing now, what it has made today, the battery where there
   * is one, and the day's curve - plus the fleet total and a clock. The clock
   * is not decoration: on a display nobody touches, it is the only way to tell
   * a live page from a frozen one at a glance.
   */
  function renderTv() {
    const invs = (state.latest?.inverters ?? []).filter((i) => i.ts);
    const byInv = {};
    for (const p of state.series?.points ?? []) (byInv[p.inverter_id] ||= []).push(p);
    const [tw, tu] = fmtW(invs.reduce((a, i) => a + (i.ac_power_w || 0), 0));
    const panels = invs.map((inv, i) => {
      const m = parse(inv.metrics) ?? {};
      const st = statusOf(inv);
      const [pw, pu] = fmtW(inv.ac_power_w);
      const figs = [
        ['Today', fmtKwh(inv.today_kwh)],
        hasBattery(inv, m) && inv.battery_soc != null ? ['Battery', `${Math.round(inv.battery_soc)} % · ${battText(inv.battery_power_w)}`] : null,
        inv.load_power_w != null && !st.offline ? ['House', fmtWs(inv.load_power_w)] : null,
        inv.grid_power_w != null && !st.offline ? ['Grid', gridText(inv.grid_power_w)] : null,
      ].filter(Boolean);
      return `<section class="tvsys" style="--accent:${colorFor(inv.provider)};--accent-ink:${inkFor(inv.provider)}">
        <div class="tvname"><span>${esc(inv.name)}</span><span class="pill ${st.cls}"><i></i>${esc(st.text)}</span></div>
        <div class="tvnow${st.offline ? ' off' : ''}">${pw}<small>${pu}</small></div>
        <div class="tvfigs">${figs.map(([k, v]) => `<div><span class="k">${esc(k)}</span>${esc(v)}</div>`).join('')}</div>
        <div class="tvcurve">${systemChart(inv, todayOf(inv, byInv[inv.id]), 'tv' + i, 300, { bare: true })}</div>
      </section>`;
    }).join('');
    $('view').innerHTML = `<div class="tvwrap">
      <div class="tvhead">
        <div><div class="k">Producing now, both systems</div><div class="tvtotal">${tw}<small>${tu}</small></div></div>
        <div class="tvclock"><div class="t" id="tvclock"></div><div class="k" id="tvago"></div></div>
      </div>
      <div class="tvgrid">${panels || '<div class="empty">No system has reported yet.</div>'}</div>
    </div>`;
    tvTick();
  }

  /** The clock and the data's age, once a second, without refetching. */
  function tvTick() {
    if (!document.body.classList.contains('tv')) return;
    const c = $('tvclock'), a = $('tvago');
    if (c) c.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
    const newest = Math.max(0, ...(state.latest?.inverters ?? []).map((i) => i.ts || 0));
    if (a) a.textContent = newest ? `updated ${ago(newest)}` : '';
  }

  /**
   * Keep the screen on. A wall display that dims after ten minutes is a black
   * rectangle on a wall. The browser drops the lock whenever the page is
   * hidden, so it is taken again on return; where the API does not exist, or
   * the page is not on HTTPS, the display simply follows its own power
   * settings and nothing else changes.
   */
  let wakeLock = null;
  async function holdScreen(on) {
    try {
      if (on && !wakeLock && 'wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      } else if (!on && wakeLock) {
        await wakeLock.release();
        wakeLock = null;
      }
    } catch { wakeLock = null; }
  }

  /**
   * Only the overview claims the whole window. Every other tab is a list that
   * can legitimately be longer than the screen, so the class goes on for this
   * route and comes off for the rest - a body locked to 100vh on the Devices
   * tab would simply hide rows.
   */
  function overviewRoute() {
    document.body.classList.add('ovfit');
    renderOverview();
  }

  // ---------- loading data ----------
  /**
   * Fetch what the page shows and draw it again: the newest readings, today's
   * samples, the hardware and the poll log, all four at once. Skipped while
   * the tab is hidden unless forced; runs on a timer (see schedule).
   */
  async function refresh(force = false) {
    // Nobody is reading a hidden tab. visibilitychange refreshes on return.
    if (document.hidden && !force) return;
    try {
      const now = Math.floor(Date.now() / 1000);
      const [lat, ser, devs, health] = await Promise.all([
        api('/api/latest'),
        api(`/api/series?to=${now}&tz=${new Date().getTimezoneOffset()}`),
        api('/api/devices').catch(() => ({ devices: [] })),
        api('/api/health').catch(() => null),
      ]);
      // An offline inverter is not still producing whatever it managed just
      // before it dropped - nothing is flowing that anyone can see - so its
      // instantaneous figures read zero everywhere at once, from this one
      // place. The cumulative ones (today, lifetime) are left alone: those
      // kilowatt-hours were genuinely generated and are still true.
      for (const i of lat.inverters) {
        i.offline = statusOf(i).offline;
        if (!i.offline) continue;
        i.ac_power_w = i.dc_power_w = 0;
        i.grid_power_w = i.load_power_w = 0;
        if (i.battery_power_w != null) i.battery_power_w = 0;
      }
      state.latest = lat; state.series = ser; state.devices = devs.devices ?? []; state.health = health; state.error = null;

      const withData = lat.inverters.filter((i) => i.ts);
      // Offline systems now contribute a real zero rather than a last-known
      // figure, so the total is just a total. What it cannot show is *why* it
      // is low, hence the line naming anything that is down.
      const down = withData.filter((i) => i.offline);
      const [fv, fu] = fmtW(withData.reduce((a, i) => a + (i.ac_power_w || 0), 0));
      $('fleet-power').innerHTML = withData.length ? `${fv}<span class="unit"> ${fu}</span>` : '—';
      $('fleet-quiet').hidden = !down.length;
      $('fleet-quiet').textContent = down.length ? `${down.map((i) => i.name).join(', ')} offline` : '';
      $('fleet-today').textContent = withData.length ? fmtKwh(withData.reduce((a, i) => a + (i.today_kwh || 0), 0)) : '—';

      const used = withData.reduce((a, i) => a + (parse(i.metrics)?.loadTodayKwh ?? 0), 0);
      $('fleet-used').textContent = used > 0 ? fmtKwh(used) : '—';

      // Only SolisCloud ships the forecast with its snapshot, so take the first
      // system that has one rather than assuming which vendor it came from.
      const wx = withData.map((i) => parse(i.metrics)).find((m) => m?.weatherText);
      const hasWx = !!wx;
      $('wx-item').hidden = !hasWx;
      $('wx-sep').hidden = !hasWx;
      if (hasWx) {
        $('fleet-wx').textContent =
          `${wx.weatherText}${wx.tempMinC != null && wx.tempMaxC != null ? ` (${Math.round(wx.tempMinC)}–${Math.round(wx.tempMaxC)}°)` : ''}`;
      }
      // The tab carries the count, so a fault is visible from any page.
      const n = alertCount();
      // Same moment the badge is counted: one pass over the alerts, and the
      // switch on the Alerts tab decides whether anything is said out loud.
      notifyOfAlerts();
      $('alertbadge').hidden = !n;
      $('alertbadge').textContent = String(n);
      $('alertbadge').className = 'navbadge' + ((state.latest?.inverters ?? []).some((i) => alertsFor(i).some((r) => r.level === 'bad')) ? ' bad' : '');

      const newest = Math.max(0, ...withData.map((i) => i.ts));
      const stale = !newest || (now - newest) > STALE_AFTER_S;
      $('updated').className = 'livedot' + (stale ? ' stale' : '');
      $('updated').innerHTML = `<i></i>${newest ? ago(newest) : 'no samples yet'}`;

      // One line per feed. Showing only the newest row meant the busier feed
      // wrote over the quieter one, and the footer read as though a whole
      // system were untracked - "plants=1 inverters=1" for the only provider
      // that logs on a cron, with nothing at all about the relay.
      // An open dashboard is worth interrupting for: it is not a state anyone
      // chooses on a deployment that is reachable from the internet.

      const feeds = health?.feeds?.length ? health.feeds : (health?.polls?.length ? [health.polls[0]] : []);
      if (feeds.length) {
        $('poll-status').innerHTML = feeds.map((p) =>
          `<span class="feed ${p.ok ? '' : 'bad'}">${esc(providerName(p.provider))} ${p.ok ? 'ok' : 'FAILED'} ${esc(ago(p.ts))}` +
          `<em title="${esc(p.detail || '')}"> — ${esc(p.detail || '')}</em></span>`).join('');
      }
      route();
    } catch (e) {
      state.error = e.message;
      if (e.message === 'unauthorized') { $('updated').innerHTML = '<i></i>unauthorized'; route(); }
      else $('updated').innerHTML = `<i></i>error: ${esc(e.message)}`;
    }
  }

  // ---------- theme ----------
  // Three states rather than two: "auto" is the default and follows the OS, so
  // a viewer who never touches this still gets the right one at night.
  const THEMES = ['auto', 'light', 'dark'];
  const THEME_ICON = { auto: '🖥️', light: '☀️', dark: '🌙' };
  let theme = 'auto';
  try { const t = localStorage.getItem('sl-theme'); if (THEMES.includes(t)) theme = t; } catch { /* private mode */ }
  // Put the chosen theme on the page, and show which one on the button.
  function applyTheme() {
    if (theme === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', theme);
    const btn = $('theme');
    btn.textContent = THEME_ICON[theme];
    btn.title = `Theme: ${theme}`;
    btn.setAttribute('aria-label', `Theme: ${theme}. Click to change.`);
  }
  $('theme').addEventListener('click', () => {
    theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
    try { localStorage.setItem('sl-theme', theme); } catch { /* private mode */ }
    applyTheme();
  });
  applyTheme();

  window.addEventListener('hashchange', route);
  route();
  refresh(true);
  // Self-scheduling rather than setInterval, so that entering or leaving TV
  // mode can change the cadence immediately instead of after the old timer.
  function schedule() {
    clearTimeout(timer);
    timer = setTimeout(async () => { await refresh(); schedule(); },
      document.body.classList.contains('tv') ? TV_REFRESH_MS : REFRESH_MS);
  }
  schedule();
  setInterval(tvTick, 1000);

  // Leaving: Escape, or the exit link, which appears when the mouse moves and
  // hides again when it stops - a cursor parked on a wall display should not
  // leave a button hanging over the numbers.
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && document.body.classList.contains('tv')) location.hash = '#/';
  });
  let still = null;
  document.addEventListener('mousemove', () => {
    if (!document.body.classList.contains('tv')) return;
    document.body.classList.add('moving');
    clearTimeout(still);
    still = setTimeout(() => document.body.classList.remove('moving'), 2500);
  });
  // ---------- a new version ----------
  //
  // A dashboard tab refreshes its figures on its own but never the page that
  // draws them, so a tab left open across a release - or a wall display - goes
  // on running the old one. The page therefore asks for its own address now and
  // then, headers only, and compares the ETag with the one it had at load:
  // changed means the page on the server is not the page on screen. It costs
  // one tiny request every quarter hour and one on coming back to the tab, and
  // nothing at all on the database.
  //
  // A screen someone is reading gets a notice and chooses when; TV mode has
  // nobody to choose, so it reloads itself. "Later" is taken at its word for
  // the rest of the visit.
  const VERSION_CHECK_MS = 15 * 60 * 1000;
  let loadedVersion = null;
  let newVersionSeen = false;

  /** The ETag of the page the server has now, asked for with a HEAD request. */
  async function serverVersion() {
    try {
      const res = await fetch('/', { method: 'HEAD', cache: 'no-store', credentials: 'same-origin' });
      if (!res.ok) return null;
      return res.headers.get('etag') || res.headers.get('last-modified');
    } catch {
      return null;
    }
  }

  /**
   * Whether the page the server has now is the page running here: its script
   * and its styles, compared as text. Null when it cannot be told.
   */
  async function serverHasThisPage() {
    if (!RUNNING_SCRIPT) return null;
    try {
      const res = await fetch('/', { cache: 'no-store', credentials: 'same-origin' });
      if (!res.ok) return null;
      const html = await res.text();
      return html.includes(RUNNING_SCRIPT) && (!RUNNING_STYLE || html.includes(RUNNING_STYLE));
    } catch {
      return null;
    }
  }

  /** Compare the page on the server with the page on screen, and offer a reload when they differ. */
  async function checkForNewVersion() {
    if (newVersionSeen) return;
    const now = await serverVersion();
    if (!now) return;
    if (loadedVersion === null) {
      // The first ETag is only a fair baseline if it belongs to the page that is
      // running. A release landing between this page loading and this request
      // would otherwise be taken as this page's own version, and never offered.
      // So the first look also fetches the page once and compares what it
      // holds with what is running; a mismatch is a new version already.
      loadedVersion = now;
      if ((await serverHasThisPage()) !== false) return;
    } else if (now === loadedVersion) {
      return;
    }
    newVersionSeen = true;
    if (document.body.classList.contains('tv')) { location.reload(); return; }
    const bar = document.createElement('div');
    bar.className = 'newversion';
    bar.id = 'newversion';
    bar.setAttribute('role', 'status');
    bar.innerHTML = `<span>A new version of SolarLens is available.</span>
      <button type="button" class="nv-reload" id="nv-reload">Reload</button>
      <button type="button" class="nv-later" id="nv-later">Later</button>`;
    document.body.appendChild(bar);
    $('nv-reload').onclick = () => location.reload();
    $('nv-later').onclick = () => bar.remove();
  }
  checkForNewVersion();
  setInterval(checkForNewVersion, VERSION_CHECK_MS);

  // Returning to the tab is exactly when a stale figure matters, so that one
  // fetches everything rather than waiting for the slow cycle to come round -
  // and it is when a release made while the tab was hidden should be noticed.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    refresh(true);
    checkForNewVersion();
    if (document.body.classList.contains('tv')) holdScreen(true);
  });

  // Installable: the worker is what lets the dashboard live on a home screen
  // rather than in a tab. It goes to the network first and falls back to a
  // cache only when there is no network, so nothing here can make a stale
  // reading look live. Registration is deliberately last and deliberately
  // silent: a browser that refuses it, or a page opened over plain HTTP where
  // workers are not allowed, still gets the whole dashboard.
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
})();
</script>
</body>
</html>
